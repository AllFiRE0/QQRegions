# ============================================================
#  QQRegions — языковой файл
#  Формат: ключ: "перевод"
#  Всё, что видит игрок/админ/консоль, настраивается только здесь.
#  Допустимы: '&'-цвета, '&#RRGGBB' и заполнители {переменная}.
#
#  Префикс плагина НЕ добавляется к сообщениям автоматически: чтобы чат-
#  сообщение выводилось с префиксом, вставь в его текст {qqregions_prefix}
#  (раскрывается в значение ключа 'prefix' ниже).
#
#  '' (пустая строка) = сообщение ВЫКЛЮЧЕНО: не выводится даже пустая
#  строка (для команд/действий — ничего не выполняется).
#  Значение можно начинать с 'actionbar:N!' — текст уйдёт в экшнбар на
#  N секунд (вместо чата, префикс плагина не добавляется).
# ============================================================

config-version: 8

prefix: "&6▏ "

general:
  only-player: "{qqregions_prefix}&8Эта команда доступна только игрокам."
  no-permission: "{qqregions_prefix}&8У вас недостаточно прав."
  reloaded: "{qqregions_prefix}&7Конфигурация перезагружена."
  reloaded-summary: "{qqregions_prefix}&7Алиасы: &f{aliases}"
  reload-failed: "{qqregions_prefix}&8Не удалось перезагрузить конфигурацию: &7{error}"
  disabled-world: "{qqregions_prefix}&8Плагин отключён в этом мире."
  player-not-found: "{qqregions_prefix}&8Игрок #b3b07d{player} &8не найден."
  unknown-subcommand: "{qqregions_prefix}&8Неизвестная подкоманда. Введите &7/{alias} help"
  usage: "{qqregions_prefix}&7Использование: &f/{usage}"

# Шаблоны синтаксиса команд (подставляются в general.usage после имени команды).
usage:
  create: "create <название>"
  add: "add [member|owner] <ник> [территория]"
  remove: "remove [member|owner] <ник> [территория]"
  sell: "sell [ник] <сумма> [территория]"
  sell-target: "sell <ник> <сумма> [территория]"
  rent: "rent [ник] <сумма> <время> [территория]"
  rent-target: "rent <ник> <сумма> <время> [территория]"
  rent-public: "rent <сумма> <время> [территория]"
  select-expand: "select expand [сторона] <количество>"
  select-outset: "select outset <количество> [h|v|horizontal|vertical]"
  select-view: "select view <ник>|off"
  visible: "true|false [территория]"

select:
  point-1: "#b34b00точка 1"
  point-2: "#004d1fточка 2"
  pos-set: "{qqregions_prefix}&7{point} &7установлена: &f({x}&7, &f{y}&7, &f{z}&7)"
  pos-set-1: "{qqregions_prefix}&7{point} &7установлена: #b34b00({x}&7, #b34b00{y}&7, #b34b00{z}&7)"
  pos-set-2: "{qqregions_prefix}&7{point} &7установлена: #004d1f({x}&7, #004d1f{y}&7, #004d1f{z}&7)"
  reset: "{qqregions_prefix}&7Выделение сброшено."
  cleared: "{qqregions_prefix}&7Выделение очищено."
  none: "{qqregions_prefix}&7Сначала выделите область."
  max-built: "{qqregions_prefix}&7Выделение расширено до максимума: &f{blocks} &7блоков."
  chunk-built: "{qqregions_prefix}&7Выделено &f{chunks} &7чанков (&f{blocks} &7блоков)."
  chunk-over: "{qqregions_prefix}&7Доступно максимум &f{chunks} &8чанков."
  expanded: "{qqregions_prefix}&7Область расширена: &f{blocks} &7блоков."
  outset: "{qqregions_prefix}&7Область расширена во все стороны: &f{blocks} &7блоков."
  over-limit: "{qqregions_prefix}&8Превышен лимит блоков (&f{current}&8/&f{max}&8)."
  below-min: "{qqregions_prefix}&8Область меньше минимального размера (&f{current}&8/&f{min}&8)."
  point-locked: "{qqregions_prefix}&7Точка упёрлась в ограничения."
  invalid-amount: "{qqregions_prefix}&7Некорректное количество: &f{amount}"
  invalid-side: "{qqregions_prefix}&7Некорректная сторона: &f{side}"
  interactive-on: "{qqregions_prefix}&7Режим выделения включён."
  # Пусто = сообщение выключено (не спамит при каждом клике/смене точки).
  # Чтобы включить — раскомментируй строку ниже и напиши свой текст.
  interactive-select-mode: ""
  #interactive-select-mode: "{qqregions_prefix}&7Режим выделения области. Активная точка: &f{point}&7."
  interactive-help: "&#bd8c8c ознакомьтесь с названиями и описанием кнопок!"
  #interactive-help: "&7&6ПКМ&8&6ЛКМ — (&fсоздать&7, &fточка 1&7, &fточка 2&7, &fвыделить&7, &fсброс&7, &fотмена&7)."
  interactive-off: "{qqregions_prefix}&7Режим выделения выключен."
  interactive-on-fail: "{qqregions_prefix}&7Не удалось сохранить инвентарь — редактирование отменено."
  inventory-restored: "{qqregions_prefix}&7Инвентарь восстановлен после аварийного выхода."
  command-blocked: "{qqregions_prefix}&7Команда &f{cmd}&7 сейчас запрещена, выйдите из режима редактирования территории."
  confirmed: "{qqregions_prefix}&7Выделена область в &f{blocks} &7блоков."
  conflict: "{qqregions_prefix}&7Выделение пересекает #59806f{region}&7!"
  button-create: "<gradient:#00ff41:#007a1f>Создать территорию</gradient>"
  button-create-lore:
    - "&7Создать территорию из текущего выделения."
    - ""
    - "&fПравила для названия территории:"
    - "&7английский, цифры, &f_ &7и &f-&7,"
    - "&7от &f3 &7до &f32 &7символов."
    - ""
    - "&6ЛКМ&8/&6ПКМ &7— ввести название в чат."
  button-point-1: "#b34b00Установить первую точку"
  button-point-1-lore:
    - "#b34b00Установить точку 1 (верхнюю)."
    - ""
    - "&7Оранжевая кнопка — верхняя граница."
    - ""
    - "&7Берётся блок по прицелу (до &f1000 &7блоков),"
    - "&7иначе — позиция игрока."
    - ""
    - "&6ЛКМ&8/&6ПКМ &7кнопкой в руке — установить."
  button-point-2: "#004d1fУстановить вторую точку"
  button-point-2-lore:
    - "#004d1fУстанавливает точку 2 (нижнюю)."
    - ""
    - "&7Зелёная кнопка — нижняя граница."
    - ""
    - "&7Берётся блок по прицелу (до &f1000 &7блоков),"
    - "&7иначе — позиция игрока."
    - ""
    - "&6ЛКМ&8/&6ПКМ &7кнопкой в руке — установить."
  button-select: "<gradient:#ffe600:#ffb300>Выделение колесом мыши</gradient>"
  button-select-lore:
    - "&7Выделите область для территории с помощью"
    - "&7колеса мыши или клавишами &f4&8/&f6."
    - ""
    - "&6ЛКМ &7пустой рукой — сменить точку"
    - "&7выделения на &61 &7или &22&7."
    - "&cShift &8+ &6ЛКМ &7— подтвердить"
    - "&7выделение обеих точек и перейти"
    - "&7к вводу названия или отмены."
    - ""
    - "&6Оранжевая точка &7— верхняя точка"
    - "&2Зелёная &7— нижняя точка"
    - ""
    - "&8Смотрите в нужную сторону и перемещайте"
    - "&8выбраную точку колесом мыши"
  button-reset: "<gradient:#ffa500:#ff6a00>Сброс выделения</gradient>"
  button-reset-lore:
    - "&7Сбросить выделеную область."
    - ""
    - "&6ЛКМ&8/&6ПКМ &7— сбросить."
  button-cancel: "<gradient:#ff5555:#ff0000>Отмена</gradient>"
  button-cancel-lore:
    - "&7Выйти из режима выделения"
    - "&7и вернуть инвентарь."
    - ""
    - "&6ЛКМ&8/&6ПКМ &7— выйти."
  point-pane-1: "#b34b00Точка 1"
  point-pane-2: "#004d1fТочка 2"
  point-pane-1-lore:
    - "&7Активная точка: #b34b00точка 1&7."
    - ""
    - "&6Колесо мыши &7— двигать точку"
    - "&cShift &8+ &6ЛКМ &7— завершить."
    - "&6ЛКМ &7чтобы сменить на #004d1fточку 2&7."
  point-pane-2-lore:
    - "&7Активная точка: #004d1fточка 2&7."
    - ""
    - "&6Колесо мыши &7— двигать точку"
    - "&cShift &8+ &6ЛКМ &7— завершить."
    - "&6ЛКМ &7чтобы сменить на #b34b00точку 1&7."
  view-set: "{qqregions_prefix}&7Просмотр выделения игрока #b3b07d{target}&7. &6ЛКМ/&6ПКМ — сменить, колесо — двигать."
  view-offline: "{qqregions_prefix}&7Игрок #b3b07d{target} &7не в сети."
  view-self: "{qqregions_prefix}&7Нельзя просматривать собственное выделение."
  view-no-selection: "{qqregions_prefix}&7У #b3b07d{target} &7нет активного выделения."
  view-off: "{qqregions_prefix}&7Просмотр выделения игрока выключен."

create:
  prompt: "{qqregions_prefix}&7Введите название территории в чат (&7cancel&7 — отмена):"
  cancelled: "{qqregions_prefix}&7Ввод названия отменён."
  invalid-name: "{qqregions_prefix}&8Недопустимое название территории. Допустимо: &7{regex}"
  invalid-id: "{qqregions_prefix}&8Название территории содержит недопустимые символы. Разрешены: &7{charset}&8. Только английский."
  ok: "{qqregions_prefix}&7Территория #59806f{region} &7создана в мире &7{world}&7. (&7{blocks} &7блоков)"
  already-exists: "{qqregions_prefix}&8Территория #59806f{region} &8уже существует."
  fail: "{qqregions_prefix}&8Не удалось создать территорию, &7{error}"
  none: "{qqregions_prefix}&7Сначала выделите область &8(&#8f5959/{alias} help&8)."
  banned: "{qqregions_prefix}&7Территорию #59806f{region} &7нельзя редактировать."
  region-limit: "{qqregions_prefix}&7Достигнут лимит территорий: &f{max}&7."
  cancel-words:
    - "cancel"
    - "отмена"
    - "выход"

delete:
  ok: "{qqregions_prefix}&7Территория #59806f{region} &7удалёна."
  not-owner: "{qqregions_prefix}&7Вы не являетесь владельцем этой территории."
  not-found: "{qqregions_prefix}&7Территория #59806f{region} &7не найдена."
  none: "{qqregions_prefix}&7Нужно быть внутри территории или указать название."
  fail: "{qqregions_prefix}&7Не удалось удалить территорию: &#8f5959{error}"

add:
  ok-member: "{qqregions_prefix}&7Игрок #b3b07d{target} &7добавлен в участники территории #59806f{region}&7."
  ok-owner: "{qqregions_prefix}&7Игрок #b3b07d{target} &7добавлен во владельцы территории #59806f{region}&7."
  already: "{qqregions_prefix}&7Игрок #b3b07d{target} &7уже является &f{role}&7."
  not-allowed: "{qqregions_prefix}&7Вы не можете редактировать территорию #59806f{region}&7."

remove:
  ok-member: "{qqregions_prefix}&7Игрок #b3b07d{target} &7удалён из участников территории #59806f{region}&7."
  ok-owner: "{qqregions_prefix}&7Игрок #b3b07d{target} &7удалён из владельцев территории #59806f{region}&7."
  not-in: "{qqregions_prefix}&7Игрок #b3b07d{target} &7не является &f{role}&7."
  last-owner: "{qqregions_prefix}&7Нельзя удалить последнего владельца территории."
  not-allowed: "{qqregions_prefix}&7Вы не можете редактировать территорию #59806f{region}&7."

info:
  title: "&8================[ #59806f{region} &8]================"
  none: "{qqregions_prefix}&7Нужно находиться внутри территории или указать название."
  world: "&7Мир: &f{world}"
  type: "&7Тип: &f{type}"
  owners: "&7Владельцы: &f{owners}"
  members: "&7Участники: &f{members}"
  area: "&7Площадь: &f{area} &7блоков | Объём: &f{volume}"
  priority: "&7Приоритет: &f{priority}"
  flags-title: "&7Флаги:"
  flags-line: "  &7{flag}&8: &f{value}"
  flags-none: "&7  нет"
  menu-disabled: "{qqregions_prefix}&7Информационное меню не настроено!"

flags:
  not-owner: "{qqregions_prefix}&7Вы не являетесь владельцем этой территории."
  menu-disabled: "{qqregions_prefix}&7Меню флагов не настроено!"

members:
  owner: "владельцем"
  member: "участником"

visible:
  disabled: "{qqregions_prefix}&7Подсветка территорий отключена в конфиге" # (highlight.enabled: false).
  none: "{qqregions_prefix}&7Нужно находиться на территории или указать название."
  view-shown: "{qqregions_prefix}&7Просмотр подсветки территории #59806f{region}&7."
  flag-set: "{qqregions_prefix}&7Флаг &f{flag}&7 территории #59806f{region} &7установлен: &f{value}"
  flag-fail: "{qqregions_prefix}&7Не удалось установить флаг подсветки."
  not-owner: "{qqregions_prefix}&7Вы не владелец территории #59806f{region}&7 — флаг подсветки менять нельзя."
  cleanup: "{qqregions_prefix}&7Удалено осиротевших блоков подсветки: &f{count}&7."

help:
  header: "&8===== &7Территории &8====="
  line: "&f{cmd}&8: &7{desc}"
  commands:
    - usage: "select"
      desc: "Интерактивное выделение (без аргументов)"
    - usage: "select pos|point <1|2>"
      desc: "Установить точку выделения"
    - usage: "select max"
      desc: "Максимально разрешённая область вокруг игрока"
    - usage: "select chunk [количество]"
      desc: "Выделить область из чанков"
    - usage: "select expand [сторона] <N>"
      desc: "Расширить/сузить выделение"
    - usage: "select outset <N> [h|v]"
      desc: "Расширить во все стороны"
    - usage: "create <название>"
      desc: "Создать территорию из выделения"
    - usage: "delete [название]"
      desc: "Удалить территорию, которым вы владеете"
    - usage: "info [название]"
      desc: "Информация о территории"
    - usage: "add [member|owner] <ник> [территория]"
      desc: "Добавить игрока в территорию"
    - usage: "remove [member|owner] <ник> [территория]"
      desc: "Убрать игрока из территории"
    - usage: "flags [название]"
      desc: "Меню флагов (владельцы)"
    - usage: "visible true|false [территория]"
      desc: "Включить/выключить флаг подсветки территории (владелец)"
    - usage: "view [территория] [particles|blocks|territory]"
      desc: "Временно показать подсветку (без сохранения флага)"
    - usage: "select view <ник>"
      desc: "Посмотреть выделение другого игрока"
    - usage: "market flags"
      desc: "Магазин флагов"
    - usage: "market blocks"
      desc: "Расширения: площадь и «+территория»"
    - usage: "raid [территория]"
      desc: "Запустить рейд клана на территории" # (JustTeams)
    - usage: "sell [ник] <сумма> [территория]"
      desc: "Продать территорию (без ника — публичное объявление на рынке)"
    - usage: "sell accept|decline|cancel|list <id>"
      desc: "Принять/отклонить/отменить/показать сделки о продаже"
    - usage: "rent [ник] <сумма> <время> [территория]"
      desc: "Сдать территорию в аренду (1m = 1 месяц; без ника — публично)"
    - usage: "rent dur <минут> [территория]"
      desc: "Срок действия объявления аренды"
    - usage: "rent accept|decline|cancel|list <id>"
      desc: "Принять/отклонить/отменить/показать аренды"
    - usage: "buy [территория]"
      desc: "Купить территорию с публичного объявления"
    - usage: "tenant [территория]"
      desc: "Арендовать территорию с публичного объявления"
    - usage: "market"
      desc: "Открыть меню рынка"
    - usage: "reload"
      desc: "Доступ только администратору."

market:
  disabled: "{qqregions_prefix}&8Рынок отключён в конфиге (market.enabled: false)."
  economy-off: "{qqregions_prefix}&8Экономика (Vault) недоступна — рынок выключен."
  no-region: "{qqregions_prefix}&7Нужно находиться внутри территории или указать название."
  sell-no-duration: "{qqregions_prefix}&7У продажи нет срока — &f{sell-usage}&7. Чтобы сдать в аренду: &f{rent-usage}"
  not-owner: "{qqregions_prefix}&7Вы не владелец территории #59806f{region}&8."
  bad-price: "{qqregions_prefix}&7Некорректная или слишком маленькая сумма."
  bad-args: "{qqregions_prefix}&7Некорректная сумма или время аренды."
  already-offer: "{qqregions_prefix}&7На территории #59806f{region} &7уже есть активное предложение."
  not-found: "{qqregions_prefix}&7Предложение не найдено."
  sale-offer-made: "{qqregions_prefix}&7Предложение о продаже #59806f{region} &7отправлено #b3b07d{target}&7 — он увидит его в меню рынка. Цена: &f{price} {price-symbol}"
  rent-offer-made: "{qqregions_prefix}&7Предложение об аренде #59806f{region} &7отправлено #b3b07d{target}&7. Цена: &f{price} {price-symbol}"
  sale-offer-sent: "{qqregions_prefix}&7Вам предложено купить территорию #59806f{region}&7 за &f{price} {price-symbol}&7. Инициатор: #b3b07d{initiator}"
  rent-offer-sent: "{qqregions_prefix}&7Вам предложено арендовать территорию #59806f{region}&7 за &f{price} {price-symbol}&7 на &f{time}&7. Инициатор: #b3b07d{initiator}"
  offer-expired: "{qqregions_prefix}&7Срок предложения по территории #59806f{region} &7истёк — теперь объявление публичное."
  offer-relisted: "{qqregions_prefix}&7Срок приватного предложения по территории #59806f{region} &7истек — объявление перевыставлено публично по той же цене."
  offer-timeout-cancelled: "{qqregions_prefix}&7Срок приватного предложения по территории #59806f{region} &7истек — объявление снято с рынка."
  sale-listed: "{qqregions_prefix}&7Объявление о продаже #59806f{region} &7выставлено на рынок. Цена: &f{price} {price-symbol}&7. Любой игрок может купить."
  rent-listed: "{qqregions_prefix}&7Объявление об аренде #59806f{region} &7выставлено на рынок. Цена: &f{price} {price-symbol}&7. Любой игрок может арендовать."
  buy-ok: "{qqregions_prefix}&7Покупка #59806f{region} &7завершена: вы теперь владелец."
  tenant-ok: "{qqregions_prefix}&7Вы арендуете #59806f{region}&7. Вывеска видна всем рядом с территорией."
  no-offer: "{qqregions_prefix}&8На этой территории нет публичного объявления."
  no-target: "{qqregions_prefix}&7Указанный игрок не найден."
  bad-duration: "{qqregions_prefix}&7Некорректный срок."
  not-rent: "{qqregions_prefix}&8Это объявление — продажа, а не аренда."
  listdur-set: "{qqregions_prefix}&7Срок объявления аренды #59806f{region}&7: &f{minutes}&7."
  period-set: "{qqregions_prefix}&7Срок аренды #59806f{region}&7: &f{time}&7."
  too-short: "{qqregions_prefix}&7Срок аренды меньше минимального (&f1 &8час)."
  too-long: "{qqregions_prefix}&8Срок аренды больше максимального (&f1 &8год)."
