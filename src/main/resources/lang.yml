  self-invalid: "&cИспользуйте: /&7region visible self <on|off>&c. Получено: &7{value}"

help:
  header: "&8===== &bQQRegions &7v{version} &8====="
  line: "&f{cmd}&8: &7{desc}"
  commands:
    - usage: "select"
      desc: "Интерактивное выделение (без аргументов)"
    - usage: "select pos|point <1|2>"
      desc: "Установить точку выделения"
    - usage: "select max"
      desc: "Максимально разрешённая область вокруг игрока"
    - usage: "select chunk [количество]"
      desc: "Выделить область из чанков"
    - usage: "select expand [сторона] <N>"
      desc: "Расширить/сузить выделение"
    - usage: "select outset <N> [h|v]"
      desc: "Расширить во все стороны"
    - usage: "create <название>"
      desc: "Создать территорию из выделения"
    - usage: "delete [название]"
      desc: "Удалить территорию, которым вы владеете"
    - usage: "info [название]"
      desc: "Информация о территории"
    - usage: "add [member|owner] <ник> [территория]"
      desc: "Добавить игрока в территорию"
    - usage: "remove [member|owner] <ник> [территория]"
      desc: "Убрать игрока из территории"
    - usage: "flags [название]"
      desc: "Меню флагов (владельцы)"
    - usage: "visible [название] [particles|blocks|territory]"
      desc: "Показать/скрыть подсветку границ территории"
    - usage: "visible type [particles|blocks|territory]"
      desc: "Тип подсветки по умолчанию (без аргумента — текущий)"
    - usage: "visible off"
      desc: "Скрыть все подсветки"
    - usage: "visible self on|off"
      desc: "Личная подсветка «для себя» (действует только на флаг territory-visible)"
    - usage: "view [территория] [particles|blocks|territory]"
      desc: "Временно показать подсветку (без сохранения флага)"
    - usage: "visible true|allow|false|deny [particles|blocks|territory] [территория]"
      desc: "Установить флаг подсветки территория"
    - usage: "select view <ник>"
      desc: "Посмотреть выделение другого игрока"
    - usage: "market flags"
      desc: "Магазин флагов"
    - usage: "market blocks"
      desc: "Расширения: площадь и «+территория»"
    - usage: "raid [территория]"
      desc: "Запустить рейд клана на территории" # (JustTeams)
    - usage: "sell [ник] <сумма> [территория]"
      desc: "Продать территорию (без ника — публичное объявление на рынке)"
    - usage: "sell accept|decline|cancel|list <id>"
      desc: "Принять/отклонить/отменить/показать сделки о продаже"
    - usage: "rent [ник] <сумма> <время> [территория]"
      desc: "Сдать территорию в аренду (1m = 1 месяц; без ника — публично)"
    - usage: "rent dur <минут> [территория]"
      desc: "Срок действия объявления аренды"
    - usage: "rent accept|decline|cancel|list <id>"
      desc: "Принять/отклонить/отменить/показать аренды"
    - usage: "buy [территория]"
      desc: "Купить территорию с публичного объявления"
    - usage: "tenant [территория]"
      desc: "Арендовать территорию с публичного объявления"
    - usage: "market"
      desc: "Открыть меню рынка"
    - usage: "reload"
      desc: "Перезагрузить конфигурацию"

