# ============================================================
#  QQRegions — магазин флагов и расширений
#  Меню: /region market flags | blocks (кнопки в market.yml).
#
#  Экономика общая с рынком (Vault). Если Vault/плагина экономики
#  нет — магазин отвечает «экономика выключена».
#
#  Что продаётся:
#    flags.*      — флаги из WorldGuard (и из любых плагинов-регистраторов,
#                   например WGEFP), НЕ входящие в flags-menu.whitelist
#                   (бесплатные в whitelist) и flags-menu.shop-ignore
#                   (служебные, только по праву). Игрок ВИДИТ и может купить
#                   флаг только с правом на него: qqregions.flags.use.<флаг>
#                   (даётся группам через LuckPerms или игроку по отдельности;
#                   legacy-право qqregions.flags.<флаг> тоже принимается) или
#                   группой-шаблоном qqregions.flags.group.<имя> из config.yml
#                   flag-groups (открывает этот же набор флагов сразу «пачкой»).
#                   Админ/оп видят и покупают всё. После покупки флаг
#                   появляется в меню флагов региона и в «Моих флагах»
#                   (/region market -> «Мои флаги»).
#                   shop.yml flags.bought-display: RED_GLASS | HIDE —
#                   показывать ли уже купленные флаги красным стеклом
#                   (&cназвание / &7Уже куплено).
#    area-packs   — пакеты «+площадь»: увеличивают максимальные блоки
#                   выделения (max-blocks шаблона выбирается как максимум
#                   шаблонного значения и купленного). Один раз (по умолчанию).
#    region-packs — пакеты «+регион»: увеличивают лимит регионов на
#                   игрока (regions.max-regions). Повторяемые (по умолчанию)
#                   или с лимитом max-purchases.
#    custom-items — пользовательские товары: выдача прав, команд и т.п.
#                   Используется один раз (по умолчанию) — партия кнопок
#                   «расширений» (меню /region market -> «Расширения»).
#
#  Общие поля товаров (area-packs / region-packs / custom-items):
#    name           — название кнопки (переменная {pack-name})
#    price          — цена; 0/отрицательная = не продаётся
#    material       — материал кнопки (по умолчанию: area GOLD_INGOT,
#                     region EMERALD, custom EMERALD)
#    amount         — количество: блоки (area) / регионы (region) /
#                     число для лора (custom). Для area также читается
#                     старый ключ "blocks", для region — "regions".
#    max-purchases  — лимит покупок на игрока (<= 0 = повторяемый/безлимит)
#                     По умолчанию: area 1, region 0 (повторяемый), custom 1.
#    bought-display — отображение купленного и исчерпавшего лимит товара:
#                     RED_GLASS — красное стекло «&c{pack-name}» + лор
#                     «&7Уже куплено»; HIDE — кнопка исчезает, остальные
#                     сдвигаются вперёд по слотам.
#    priority       — порядок кнопок в меню (меньше — раньше).
#    lore           — строки описания (только custom-items; у пакетов
#                     лор собирается из lang.yml по умолчанию).
#    conditions     — условия вида "заполнитель оператор значение"
#                     (раскрываются PlaceholderAPI). AND: все должны быть
#                     истиной. Если есть — после покупки выполняются
#                     allow-cmds (все условия истинны) или deny-cmds.
#                     Операторы: =, !=, >, <, >=, <=, <- (содержит),
#                     !<-, |- (начинается с), !|-, -| (заканчивается на),
#                     !-|
#    commands       — команды-действия после покупки (если conditions нет).
#                     Поддерживаются action-префиксы:
#                       message!<текст>                 — сообщение игроку
#                       gMessage!<текст>                — сообщение всем
#                       title!:<ст>:<сст>:<фейд>!<текст> — тайтл с таймингом
#                       title!<текст>                   — тайтл (20/40/20)
#                       actionbar:<тики>!<текст>        — экшнбар N тиков
#                       actionbar!<текст>               — экшнбар 60 тиков
#                       sound!<звук> [громкость] [питч] — звук игроку
#                       gSound!<звук> [громкость] [питч] — звук всем
#                       asConsole!<cmd>                 — команда от консоли
#                       asPlayer!<cmd>                  — команда от игрока
#                       delay:<тики>!<действие>         — с задержкой
#                     {player} -> ник покупателя.
#    allow-cmds     — действия при выполнении условий (см. conditions).
#    deny-cmds      — действия при невыполненных условиях.
#
#  Покупки хранятся в data.yml на игрока навсегда.
# ============================================================
config-version: 2

enabled: true

# Поднимать ли цены через Vault (false = покупки запрещены).
economy-enabled: true

flags:
  # Показывать ли уже купленные флаги в магазине красным стеклом
  # (RED_GLASS) или скрывать (HIDE, по умолчанию).
  bought-display: HIDE
  # Цена по умолчанию для флагов, у которых нет своей цены в prices.
  default-price: 1000
  # Цены отдельных флагов (перебивают default-price).
  prices:
    pvp: 500
    build: 800
    entry: 600
    deny-message: 750
    chest-access: 1200
    greeting: 300
    farewell: 300
    territory-visible: 500

area-packs:
  # Пакеты площади выделения. Один пакет = один раз (max-purchases: 1).
  big:
    name: "Большая территория"
    blocks: 20000
    price: 5000
    material: GOLD_INGOT
    priority: 0
    bought-display: HIDE
  mega:
    name: "Огромная территория"
    blocks: 100000
    price: 20000
    material: GOLD_INGOT
    priority: 1
    bought-display: HIDE

region-packs:
  # Пакеты «+регион»: повторяемые (max-purchases: 0) или с лимитом.
  plus1:
    name: "+1 регион"
    regions: 1
    price: 2500
    material: EMERALD
    priority: 10
  plus5:
    name: "+5 регионов"
    regions: 5
    price: 10000
    material: EMERALD
    priority: 11

custom-items:
  # Пользовательские товары (вкладка «Расширения»): единоразовая выдача
  # прав/команд. Пример ниже — выдаёт VIP-привилегию LuckPerms, если у
  # игрока на счету >= 1000, иначе уведомляет об отказе.
  #vip:
  #  name: "VIP привилегия"
  #  material: NETHER_STAR
  #  lore:
  #    - "&7Даёт привилегию &fVIP"
  #  price: 5000
  #  max-purchases: 1
  #  bought-display: RED_GLASS
  #  priority: 20
  #  conditions:
  #    - "%vault_rank%==Default"
  #  commands:
  #    - "message! &aПрава VIP активированы!"
  #    - "asConsole! lp user {player} parent add vip"
  #    - "sound! ENTITY_PLAYER_LEVELUP 1 1"
  #  deny-cmds:
  #    - "message! &cНельзя купить VIP дважды."