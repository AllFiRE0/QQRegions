# ============================================================
#  QQRegions — магазин флагов и расширений
#  Меню: /region market flags | blocks (кнопки в market.yml).
#
#  Экономика общая с рынком (Vault). Если Vault/плагина экономики
#  нет — магазин отвечает «экономика выключена».
#
#  Что продаётся:
#    flags.*      — флаги из WorldGuard, НЕ входящие в flags-menu.whitelist
#                   (бесплатные в whitelist) и flags-menu.shop-ignore
#                   (служебные, только по праву). После покупки флаг
#                   появляется в меню флагов региона и в «Моих флагах»
#                   (/region market -> «Мои флаги»).
#    area-packs   — пакеты «+площадь»: увеличивают максимальные блоки
#                   выделения (max-blocks шаблона выбирается как максимум
#                   шаблонного значения и купленного).
#    region-packs — пакеты «+регион»: увеличивают лимит регионов на
#                   игрока (regions.max-regions). Повторяемые.
#  Покупки хранятся в data.yml на игрока навсегда.
# ============================================================
enabled: true

# Поднимать ли цены через Vault (false = покупки запрещены).
economy-enabled: true

flags:
  # Цена по умолчанию для флагов, у которых нет своей цены в prices.
  default-price: 1000
  # Цены отдельных флагов (перебивают default-price).
  prices:
    pvp: 500
    build: 800
    entry: 600
    deny-message: 750
    chest-access: 1200
    greeting: 300
    farewell: 300
    territory-visible: 500

area-packs:
  # Пакеты площади выделения. amount — блоки, добавляемые к max-blocks
  # шаблона (максимум из купленных). Один пакет = один раз.
  big:
    name: "Большая территория"
    blocks: 20000
    price: 5000
  mega:
    name: "Огромная территория"
    blocks: 100000
    price: 20000

region-packs:
  # Пакеты «+регион»: прибавляют к лимиту regions.max-regions.
  # Повторяемые — можно купить несколько раз.
  plus1:
    name: "+1 регион"
    regions: 1
    price: 2500
  plus5:
    name: "+5 регионов"
    regions: 5
    price: 10000