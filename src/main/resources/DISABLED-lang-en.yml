# ============================================================
#  QQRegions — language file (English)
#  Format: key: "translation"
#  Everything a player/admin/console sees is configured only here.
#  Allowed: '&'-colors, '&#RRGGBB' and {placeholder} variables.
#
#  The plugin prefix is NOT added to messages automatically: to print
#  a chat message with the prefix, insert {qqregions_prefix} into its text
#  (it resolves to the 'prefix' key value below).
#
#  '' (empty string) = message DISABLED: nothing is printed, not even an
#  empty line (for commands/actions — nothing is executed).
#  The value can start with 'actionbar:N!' — the text goes to the actionbar
#  for N seconds (instead of chat; the plugin prefix is not added).
# ============================================================

config-version: 8

prefix: "&6▏ "

general:
  only-player: "{qqregions_prefix}&8This command is available only to players."
  no-permission: "{qqregions_prefix}&8You do not have enough permissions."
  reloaded: "{qqregions_prefix}&7Configuration reloaded."
  reloaded-summary: "{qqregions_prefix}&7Aliases: &f{aliases}"
  reload-failed: "{qqregions_prefix}&8Failed to reload configuration: &7{error}"
  disabled-world: "{qqregions_prefix}&8The plugin is disabled in this world."
  player-not-found: "{qqregions_prefix}&8Player #b3b07d{player} &8not found."
  unknown-subcommand: "{qqregions_prefix}&8Unknown sub-command. Enter &7/{alias} help"
  usage: "{qqregions_prefix}&7Usage: &f/{usage}"

# Command syntax templates (inserted into general.usage after the command name).
usage:
  create: "create <name>"
  add: "add [member|owner] <nick> [territory]"
  remove: "remove [member|owner] <nick> [territory]"
  sell: "sell [nick] <amount> [territory]"
  sell-target: "sell <nick> <amount> [territory]"
  rent: "rent [nick] <amount> <time> [territory]"
  rent-target: "rent <nick> <amount> <time> [territory]"
  rent-public: "rent <amount> <time> [territory]"
  select-expand: "select expand [side] <amount>"
  select-outset: "select outset <amount> [h|v|horizontal|vertical]"
  select-view: "select view <nick>|off"
  visible: "true|false [territory]"

select:
  point-1: "#b34b00point 1"
  point-2: "#004d1fpoint 2"
  pos-set: "{qqregions_prefix}&7{point} &7set: &f({x}&7, &f{y}&7, &f{z}&7)"
  pos-set-1: "{qqregions_prefix}&7{point} &7set: #b34b00({x}&7, #b34b00{y}&7, #b34b00{z}&7)"
  pos-set-2: "{qqregions_prefix}&7{point} &7set: #004d1f({x}&7, #004d1f{y}&7, #004d1f{z}&7)"
  reset: "{qqregions_prefix}&7Selection reset."
  cleared: "{qqregions_prefix}&7Selection cleared."
  none: "{qqregions_prefix}&7Select an area first."
  max-built: "{qqregions_prefix}&7Selection expanded to the maximum: &f{blocks} &7blocks."
  chunk-built: "{qqregions_prefix}&7Selected &f{chunks} &7chunks (&f{blocks} &7blocks)."
  chunk-over: "{qqregions_prefix}&7Maximum &f{chunks} &8chunks available."
  expanded: "{qqregions_prefix}&7Area expanded: &f{blocks} &7blocks."
  outset: "{qqregions_prefix}&7Area expanded in all directions: &f{blocks} &7blocks."
  over-limit: "{qqregions_prefix}&8Block limit exceeded (&f{current}&8/&f{max}&8)."
  below-min: "{qqregions_prefix}&8Area is smaller than the minimum size (&f{current}&8/&f{min}&8)."
  point-locked: "{qqregions_prefix}&7The point hit the limits."
  invalid-amount: "{qqregions_prefix}&7Invalid amount: &f{amount}"
  invalid-side: "{qqregions_prefix}&7Invalid side: &f{side}"
  interactive-on: "{qqregions_prefix}&7Selection mode enabled."
  # Empty = message disabled (does not spam on every click/point change).
  # To enable — uncomment the line below and write your own text.
  interactive-select-mode: ""
  #interactive-select-mode: "{qqregions_prefix}&7Selection mode. Active point: &f{point}&7."
  interactive-help: "&#bd8c8c take a look at the button names and descriptions!"
  #interactive-help: "&7&6RMB&8&6LMB — (&fcreate&7, &fpoint 1&7, &fpoint 2&7, &fselect&7, &freset&7, &fcancel&7)."
  interactive-off: "{qqregions_prefix}&7Selection mode disabled."
  interactive-on-fail: "{qqregions_prefix}&7Failed to save inventory — editing cancelled."
  inventory-restored: "{qqregions_prefix}&7Inventory restored after an unexpected exit."
  command-blocked: "{qqregions_prefix}&7The command &f{cmd}&7 is forbidden now, exit the territory editing mode."
  confirmed: "{qqregions_prefix}&7Area selected: &f{blocks} &7blocks."
  conflict: "{qqregions_prefix}&7Selection intersects #59806f{region}&7!"
  button-create: "<gradient:#00ff41:#007a1f>Create territory</gradient>"
  button-create-lore:
    - "&7Create a territory from the current selection."
    - ""
    - "&fTerritory name rules:"
    - "&7English letters, digits, &f_ &7and &f-&7,"
    - "&7from &f3 &7to &f32 &7characters."
    - ""
    - "&6LMB&8/&6RMB &7— enter the name in chat."
  button-point-1: "#b34b00Set the first point"
  button-point-1-lore:
    - "#b34b00Set point 1 (upper)."
    - ""
    - "&7Orange button — the upper border."
    - ""
    - "&7The block aimed at is used (up to &f1000 &7blocks),"
    - "&7otherwise — the player position."
    - ""
    - "&6LMB&8/&6RMB &7with the button in hand — set."
  button-point-2: "#004d1fSet the second point"
  button-point-2-lore:
    - "#004d1fSets point 2 (lower)."
    - ""
    - "&7Green button — the lower border."
    - ""
    - "&7The block aimed at is used (up to &f1000 &7blocks),"
    - "&7otherwise — the player position."
    - ""
    - "&6LMB&8/&6RMB &7with the button in hand — set."
  button-select: "<gradient:#ffe600:#ffb300>Select with the mouse wheel</gradient>"
  button-select-lore:
    - "&7Select an area for the territory using"
    - "&7the mouse wheel or keys &f4&8/&f6."
    - ""
    - "&6LMB &7with an empty hand — switch the point"
    - "&7to &61 &7or &22&7."
    - "&cShift &8+ &6LMB &7— confirm the"
    - "&7selection of both points and move on"
    - "&7to entering the name or cancelling."
    - ""
    - "&6Orange point &7— the upper point"
    - "&2Green &7— the lower point"
    - ""
    - "&8Look in the desired direction and move"
    - "&8the selected point with the mouse wheel"
  button-reset: "<gradient:#ffa500:#ff6a00>Reset selection</gradient>"
  button-reset-lore:
    - "&7Reset the selected area."
    - ""
    - "&6LMB&8/&6RMB &7— reset."
  button-cancel: "<gradient:#ff5555:#ff0000>Cancel</gradient>"
  button-cancel-lore:
    - "&7Exit the selection mode"
    - "&7and return the inventory."
    - ""
    - "&6LMB&8/&6RMB &7— exit."
  point-pane-1: "#b34b00Point 1"
  point-pane-2: "#004d1fPoint 2"
  point-pane-1-lore:
    - "&7Active point: #b34b00point 1&7."
    - ""
    - "&6Mouse wheel &7— move the point"
    - "&cShift &8+ &6LMB &7— finish."
    - "&6LMB &7to switch to #004d1fpoint 2&7."
  point-pane-2-lore:
    - "&7Active point: #004d1fpoint 2&7."
    - ""
    - "&6Mouse wheel &7— move the point"
    - "&cShift &8+ &6LMB &7— finish."
    - "&6LMB &7to switch to #b34b00point 1&7."
  view-set: "{qqregions_prefix}&7Viewing the selection of player #b3b07d{target}&7. &6LMB/&6RMB — switch, wheel — move."
  view-offline: "{qqregions_prefix}&7Player #b3b07d{target} &7is not online."
  view-self: "{qqregions_prefix}&7You cannot view your own selection."
  view-no-selection: "{qqregions_prefix}&7#b3b07d{target} &7has no active selection."
  view-off: "{qqregions_prefix}&7Selection viewing disabled."

create:
  prompt: "{qqregions_prefix}&7Enter the territory name in chat (&7cancel&7 — cancel):"
  cancelled: "{qqregions_prefix}&7Name entry cancelled."
  invalid-name: "{qqregions_prefix}&8Invalid territory name. Allowed: &7{regex}"
  invalid-id: "{qqregions_prefix}&8The territory name contains invalid characters. Allowed: &7{charset}&8. English only."
  ok: "{qqregions_prefix}&7Territory #59806f{region} &7created in world &7{world}&7. (&7{blocks} &7blocks)"
