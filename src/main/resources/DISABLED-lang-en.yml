# Market sign hologram (market.market-holo): ONE floating hologram near the
# territory perimeter, flies around the borders following the player and always
# faces them. Placeholders: {owner} — seller/owner nick, {price} — the number,
# {price-symbol} — currency symbol, {nick} — buyer/tenant of a private offer,
# {time} — rent period, {region}.
market-holo:
  sale: "#b3b07d{owner}&7 sells for &f{price} {price-symbol}"
  rent: "#b3b07d{owner}&7 rents out for &f{price} {price-symbol} &8for &f{time}"
  sale-pending: "#b3b07d{owner}&7 awaits a purchase from #b3b07d{nick}&7 for &f{price} {price-symbol}"
  rent-pending: "#b3b07d{owner}&7 rents to #b3b07d{nick}&7 for &f{price} {price-symbol} &7for &f{time}"
  buy-hint: "&7Use &f/region buy&7 or &f/region tenant&7 to buy/rent"

