help:
  header: "&8===== &7Territories &8====="
  line: "&f{cmd}&8: &7{desc}"
  commands:
    - usage: "select"
      desc: "Interactive selection (no arguments)"
    - usage: "select pos|point <1|2>"
      desc: "Set a selection point"
    - usage: "select max"
      desc: "The maximum allowed area around the player"
    - usage: "select chunk [amount]"
      desc: "Select an area of chunks"
    - usage: "select expand [side] <N>"
      desc: "Expand/shrink the selection"
    - usage: "select outset <N> [h|v]"
      desc: "Expand in all directions"
    - usage: "create <name>"
      desc: "Create a territory from the selection"
    - usage: "delete [name]"
      desc: "Delete a territory you own"
    - usage: "info [name]"
      desc: "Information about a territory"
    - usage: "add [member|owner] <nick> [territory]"
      desc: "Add a player to a territory"
    - usage: "remove [member|owner] <nick> [territory]"
      desc: "Remove a player from a territory"
    - usage: "flags [name]"
      desc: "Flags menu (owners)"
    - usage: "visible true|false [territory]"
      desc: "Turn the territory highlighting flag on/off (owner)"
    - usage: "view [territory] [particles|blocks|territory]"
      desc: "Temporarily show highlighting (without saving a flag)"
    - usage: "select view <nick>"
      desc: "View another player's selection"
    - usage: "market flags"
      desc: "Flag shop"
    - usage: "market blocks"
      desc: "Extensions: area and +territory"
    - usage: "raid [territory]"
      desc: "Start a clan raid on a territory" # (JustTeams)
    - usage: "sell [nick] <amount> [territory]"
      desc: "Sell a territory (no nick — public market listing)"
    - usage: "sell accept|decline|cancel|list <id>"
      desc: "Accept/decline/cancel/show sale deals"
    - usage: "rent [nick] <amount> <time> [territory]"
      desc: "Rent out a territory (1m = 1 month; no nick — publicly)"
    - usage: "rent dur <minutes> [territory]"
      desc: "Validity period of a rental listing"
    - usage: "rent accept|decline|cancel|list <id>"
      desc: "Accept/decline/cancel/show rentals"
    - usage: "buy [territory]"
      desc: "Buy a territory from a public listing"
    - usage: "tenant [territory]"
      desc: "Rent a territory from a public listing"
    - usage: "market"
      desc: "Open the market menu"
    - usage: "reload"
      desc: "Admin-only access."

