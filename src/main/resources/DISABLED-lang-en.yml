  none: "{qqregions_prefix}&7You need to be on a territory or specify a name."
  view-shown: "{qqregions_prefix}&7Viewing the highlighting of territory #59806f{region}&7."
  flag-set: "{qqregions_prefix}&7Flag &f{flag}&7 of territory #59806f{region} &7set: &f{value}"
