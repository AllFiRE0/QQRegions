# [QQRegions] Переводы значений флагов для меню (сырые значения из API WG:
# allow/deny для state-флагов, true/false для boolean-флагов).
# Используется в {flag-value-label} (flags.yml). {value} = сырое значение.
flag-values:
  - placeholder: 'allow'
    replacement: '&aвключено'
  - placeholder: 'deny'
    replacement: '&cвыключено'
  - placeholder: 'true'
    replacement: '&aда'
  - placeholder: 'false'
    replacement: '&7нет'
  - placeholder: 'ELSE'
    replacement: '{value}'