# ============================================================
#  QQRegions — Sprachdatei (Deutsch)
#  Format: Schlüssel: "Übersetzung"
#  Alles, was Spieler/Admin/Console sehen, wird nur hier konfiguriert.
#  Erlaubt: '&'-Farben, '&#RRGGBB' und Platzhalter {Variable}.
#
#  Das Plugin-Präfix wird NICHT automatisch hinzugefügt: damit eine Chat-
#  Nachricht mit Präfix erscheint, füge {qqregions_prefix} in ihren Text ein
#  (wird zum Wert des Schlüssels 'prefix' unten aufgelöst).
#
#  '' (leere Zeichenkette) = Nachricht AUS: es wird nicht einmal eine leere
#  Zeile ausgegeben (bei Befehlen/Aktionen — nichts wird ausgeführt).
#  Der Wert kann mit 'actionbar:N!' beginnen — der Text geht für N Sekunden in
#  die Actionbar (statt in den Chat; das Plugin-Präfix wird nicht hinzugefügt).
# ============================================================

config-version: 8

prefix: "&6▏ "

general:
  only-player: "{qqregions_prefix}&8Dieser Befehl ist nur für Spieler verfügbar."
  no-permission: "{qqregions_prefix}&8Sie haben nicht genügend Rechte."
  reloaded: "{qqregions_prefix}&7Konfiguration neu geladen."
  reloaded-summary: "{qqregions_prefix}&7Aliase: &f{aliases}"
  reload-failed: "{qqregions_prefix}&8Konfiguration konnte nicht neu geladen werden: &7{error}"
  disabled-world: "{qqregions_prefix}&8Das Plugin ist in dieser Welt deaktiviert."
  player-not-found: "{qqregions_prefix}&8Spieler #b3b07d{player} &8nicht gefunden."
  unknown-subcommand: "{qqregions_prefix}&8Unbekannter Unterbefehl. Eingeben: &7/{alias} help"
  usage: "{qqregions_prefix}&7Verwendung: &f/{usage}"

# Syntax-Vorlagen der Befehle (werden in general.usage nach dem Befehlsnamen eingefügt).
usage:
  create: "create <Name>"
  add: "add [member|owner] <Nick> [Gebiet]"
  remove: "remove [member|owner] <Nick> [Gebiet]"
  sell: "sell [Nick] <Betrag> [Gebiet]"
  sell-target: "sell <Nick> <Betrag> [Gebiet]"
  rent: "rent [Nick] <Betrag> <Zeit> [Gebiet]"
  rent-target: "rent <Nick> <Betrag> <Zeit> [Gebiet]"
  rent-public: "rent <Betrag> <Zeit> [Gebiet]"
  select-expand: "select expand [Seite] <Menge>"
  select-outset: "select outset <Menge> [h|v|horizontal|vertical]"
  select-view: "select view <Nick>|off"
  visible: "true|false [Gebiet]"

