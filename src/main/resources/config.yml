# ============================================================
#  QQRegions — настройки
#  Автор: AllF1RE
#
#  Всё, что выводится игроку/админу/в консоль, настраивается в
#  файле lang.yml в формате   ключ: "перевод".
#  Заполнители вида {имя} подставляются плагином автоматически.
# ============================================================
#
# Версия конфига: при выходе новой версии плагина, у которой этот номер
# выше, чем в вашем файле, config.yml пересоздаётся из новых дефолтов
# автоматически (старый файл остаётся как config.yml.old). Значения ниже
# — уже настроенный дефолт, повторно вводить их не нужно.
config-version: 8

# ------------------------------------------------------------
# Команда и алиасы. Первичное имя берётся из plugin.yml, алиасы
# ниже подключаются/убираются при каждом /region reload.
# ------------------------------------------------------------
command:
  name: "region"
  aliases:
    - "territory"
    - "tr"
    - "rg"
    - "private"
    - "zone"

# ------------------------------------------------------------
# Отладка: подробные сообщения в консоль для всех механик
# (сессия выделения, выбор точек, кнопки, синхронизация sVis).
# ------------------------------------------------------------
debug: false

# ------------------------------------------------------------
# Ограничения
# ------------------------------------------------------------
restrictions:
  # Миры, в которых плагин полностью выключен.
  disabled-worlds:
    - "test"
    - "test1"
  # Регионы, с которыми нельзя работать (создавать/удалять/редактировать).
  # Например global, spawn, jail, pvp. Работает по нижнему регистру.
  banned-regions:
    - "global"
    - "spawn"
    - "jail"
    - "pvp"

# ------------------------------------------------------------
# Название региона
# ------------------------------------------------------------
region-name:
  # Регулярное выражение допустимого названия. И как общий формат,
  # и как проверка при интерактивном вводе имени.
  regex: "[A-Za-zА-Яа-я0-9_-]{3,32}"
  # WorldGuard хранит названия только строчными буквами.
  force-lowercase: true

# ------------------------------------------------------------
# Шаблоны прав выделения.
# Для игрока выбирается шаблон с наибольшим приоритетом, у которого
# совпадает право (permission) ИЛИ выполняется условие placeholder.
# placeholder — выражение вида "%заполнитель%>=60" или "true"/"false".
# Пустая строка / [] в permission или placeholder = не проверять.
# ------------------------------------------------------------
selection-templates:
  default:
    permission: ""          # или, например, "qqregions.template.default"
    placeholder: ""         # например "%auraskills_power%>=1"
    priority: 1
    max-blocks: 10000
    min-blocks: 100
    chunks: 16
#  Пример для группы от LuckPerms:
#  vip:
#    permission: "luckperms.vip"
#    placeholder: ""
#    priority: 10
#    max-blocks: 50000
#    min-blocks: 200
#    chunks: 32

# ------------------------------------------------------------
# Интерактивное выделение (команда /region select без аргументов)
# ------------------------------------------------------------
interactive:
  # Скорость движения точки колесом: за wheel-slots делений колеса точка
  # проходит wheel-distance блоков. Пример: 2 деления = 1 блок (медленно),
  # 1 деление = 4 блока (быстро). Дробные значения работают (накопление).
  wheel-slots: 2
  wheel-distance: 1
  # Во сколько раз быстрее двигается точка, когда игрок крутит колесо,
  # стоя на Шифте.
  wheel-shift-speed: 4
  # Зеркалить направление колеса
  invert-wheel: false
  # Точка всегда движется ТОЧНО по направлению взгляда (в т.ч. вверх/вниз).
  # Углы/пороги для вертикального движения больше не используются.
  # Материалы кнопок хотбара (1-9 => create/—/select/—/reset/—/—/cancel)
  buttons:
    create:
      material: LIME_DYE
    select:
      material: GOLD_INGOT
    reset:
      material: LIGHT_GRAY_DYE
    cancel:
      material: RED_DYE
  # Команды, которые нельзя вводить, пока активна сессия выделения
  # (защита от продажи/выброса кнопок). Сравнение по префиксу: "ah"
  # заблокирует и /ah sell, и /ah bids, и сам /ah.
  blocked-commands:
    - "ah"
    - "sell"
    - "shop"
    - "baltop"
  # Передавать наше выделение в WorldEdit-селекцию игрока, чтобы
  # sVis (Selection Visualizer) автоматически подсвечивал область.
  sync-worldedit: true
  # Как отображать выделение игроку:
#   PARTICLES — обычные частицы (DUST) по рёбрам объёма,
  #   BLOCKS    — миниатюрные Block Display + glow в цвете точки.
  view-mode: BLOCKS
# Подсвечивать выделение и для обычных команд (/region select pos 1,
  # select chunk, select expand ...), не только в интерактивной сессии.
  command-selection-view: true
  # Авто-скрытие подсветки КОМАНДНОГО выделения (/region select pos 1/2,
  # point, chunk, expand, ...) через N СЕКУНД без изменений. 0 = держать,
  # пока выделение есть. Не влияет на интерактивный select (у него свой
  # view-hide-after).
  command-selection-hide-after: 0
  # Через сколько СЕКУНД без изменений подсветка скрывается (задержка
  # авто-скрытия): для PARTICLES частицы перестают пересылаться — подсветка
  # плавно гаснет; для BLOCKS блоки-дисплеи убираются. Любое изменение
  # выделения снова включает подсветку. 0 = держать, пока выделение есть.
  view-hide-after: 5
  # На каком расстоянии от центра выделения (по XZ) подсветка скрывается
  # (жёсткое авто-скрытие). 0 = не использовать. «500» = игрок отошёл на
  # 500 блоков — подсветку убрать.
  view-hide-distance: 0
  # НЕ используется для контура выделения с 2026-09-06: весь объём рисуется
  # целиком, «дальние куски» не обрезаются.
  view-distance: 200
# Число точек-кубиков на ОДНО ребро куба в BLOCKS-режиме (устарело с
  # введения global outline.max-gap/max-points: плотность контура теперь
  # считается из max-gap, see раздел "outline"). Оставлено для совместимости.
  view-dots-per-edge: 16
# Потолок блоков-дисплеев выделения: не меньше outline.max-points
  # (можно поднять выше для очень больших выделений).
  view-max-blocks: 500
  # Размер блоков-дисплеев (относительный; маркер активной точки крупнее).
  view-block-scale: 0.35
  # Стили точек в режиме выделения: стеклянные панели хотбара (все 9
  # слотов), цвет частиц активной точки/области и цветной блок-дисплей.
  # pane — материал панели, highlight — цвет частиц/свечения (#RRGGBB),
  # block — материал блок-дисплея (для view-mode: BLOCKS).
  # Имена панелей настраиваются в lang.yml (select.point-pane-1/2).
  select-points:
    point-1:
      pane: GRAY_STAINED_GLASS_PANE
      highlight: "#6b6b6b"      # тёмно-серый
      block: GRAY_CONCRETE
    point-2:
      pane: YELLOW_STAINED_GLASS_PANE
      highlight: "#ffa500"      # оранжевый
      block: ORANGE_CONCRETE

# ------------------------------------------------------------
# Подсветка регионов: команды /region visible и флаг territory-visible.
# Флаг ставится в меню флагов региона (иконка — лампа), при входе игрока
# в регион с флагом allow границы подсвечиваются и гаснут сами через
# show-seconds. Флаг срабатывает не чаще, чем раз в cooldown-seconds на
# игрока и регион — бег вдоль границы не спамит частицами и не нагружает.
# ------------------------------------------------------------
highlight:
  # Общий выключатель фичи (команды + флаг). false — всё не работает.
  enabled: true
  # Включать ли сам флаг territory-visible: false сильнее enabled для
  # флага (флаг регистрируется и виден в меню, но вход не подсвечивается;
  # команда /region visible продолжает работать).
  flag-enabled: true
  # Тип подсветки: PARTICLES — частицы, BLOCKS — блок-дисплеи со свечением,
  # TERRITORY — подсветка вдоль границы по рельефу (над верхними блоками
  # и под сводами пещер). Для TERRITORY способ отображения задаётся ниже
  # (territory.display): PARTICLES (частицы) или BLOCKS (дисплей-«забор»).
  type: TERRITORY
  # Скрывать подсветку при ВЫХОДЕ из региона: подсветка от флага живёт,
  # пока игрок ВНУТРИ, и убирается, как только он вышел (сброс кулдауна —
  # повторный вход снова подсвечивает). false = старый режим: контур
  # рисуется show-seconds и гаснет сам, кулдаун действует по-прежнему.
  hide-on-exit: true
  # Сколько секунд виден контур региона, потом гаснет сам.
  show-seconds: 10
  # Кулдаун повторного срабатывания флага (сек) на игрока и регион.
  cooldown-seconds: 10
  # Как часто проверять вход игроков в регионы. Считается в серверных тиках
  # (1 тик = 1/20 сек; 20 = раз в секунду). Кулдаун срабатывания всё равно
  # ограничивает частоту показа.
  scan-ticks: 20
  # Материал блок-дисплеев для типа BLOCKS.
  block: GLASS
  block-scale: 0.35
  # Кэш рельефа для TERRITORY: пересчитывать точки территории (и «забора»)
  # не чаще, чем раз в N секунд. Поставили блок на границе — через N секунд
  # подсветка подтянет его автоматически; повторный запуск подсветки
  # пересчитывает сразу. Событие загрузки чанка тоже сбрасывает кэш мира.
  terrain-cache-seconds: 3
  # TERRITORY: способ отображения.
  #   PARTICLES — частицы над верхними блоками вдоль границы (старое).
  #   BLOCKS    — блок-дисплеи по периметру, повторяющие рельеф. Каждый
  #               блок-дисплей ставится ОТДЕЛЬНО (как штакетник): его размеры
  #               и шаг между соседями задаются в territory.fence.
  territory:
    display: BLOCKS
    # Блоки на границе, которые НЕ считаются рельефом (пустота): грибы,
    # трава, снег и т.п. — всё, что не должно участвовать в подсветке.
    # Bukkit-материалы: brown_mushroom, red_mushroom, tall_grass,
    # short_grass (1.20.3+; в старых версиях — grass), snow и т.д.
    ignore-blocks:
      - "brown_mushroom"
      - "red_mushroom"
      - "tall_grass"
      - "short_grass"
    fence:
      # Материал блок-дисплеев (Bukkit Material). Полный блок (OAK_PLANKS,
      # STONE_BRICK, QUARTZ_BLOCK...) смотрится лучше, чем OAK_FENCE.
      material: WHITE_STAINED_GLASS
      # Высота одного блока-дисплея (по Y, в блоках). 1.0 = один блок.
      height: 1.0
      # Ширина одного блока-дисплея вдоль границы (в блоках). 0.3 = узкий.
      width: 0.3
      # Толщина поперёк границы (в блоках). 0.3 = тонкая стенка.
      thickness: 0.3
      # Расстояние между ЦЕНТРАМИ соседних блоков-дисплеев вдоль границы
      # (в блоках). 1.0 = блок в каждый блок границы; 2.0 = через блок;
      # 0.5 = два блока в один. При width == spacing забор сплошной.
      spacing: 1.0
      # Поднять (+) / опустить (-) забор относительно вершины рельефа (в блоках).
      offset: 0.5
      # Светиться ли в цвет highlight.particles.dust-color.
      glow: true
  # Параметры частиц контура региона (как в разделе particles).
  particles:
    enabled: true
    update-ticks: 10    # интервал пересылки частиц (в серверных тиках)
    particle: DUST
    dust-color: "#00ff00"
    dust-size: 0.6
    amount: 1
    speed: 0.0
    # Лимит точек рельефа для TERRITORY (для PARTICLES/BLOCKS используется
    # глобальный outline.max-points, см. ниже).
    max-points: 600

# ------------------------------------------------------------
# Пунктир объёмного контура (выделение игрока + подсветка регионов
# типа PARTICLES/BLOCKS). Единый для обеих механик.
# Каждая линия (рёбра + кольца) рисуется точками с шагом НЕ БОЛЬШЕ max-gap
# блоков — у высоких областей (например, чанк-выделение на всю высоту мира)
# больше нет «дыр» из сотен блоков между точками.
# По высоте к вертикальным рёбрам добавляются горизонтальные «кольца» —
# прямоугольники по периметру на каждом ring-step-м Y-уровне: широкий регион
# видно сразу, даже стоя в середине границы. Верх и низ рисуются всегда.
# ВЫДЕЛЕНИЕ ИГРОКА рисует только грани (12 рёбер пунктиром с шагом max-gap).
  # ПОДСВЕТКА РЕГИОНОВ дополнительно «оборачивает» объём в клетку — сетка
  # квадратов на ВСЕХ гранях: верх, низ и четыре боковые (см. grid ниже).
  # Тот же вид, что был у highlight.grid, только полный куб.
# ------------------------------------------------------------
outline:
  # Максимальный зазор между соседними точками линии (в блоках).
  max-gap: 5
  # Потолок суммарного числа точек контура (частицы и блок-дисплеи).
  # При превышении контур прореживается равномерно.
  max-points: 3000
  rings:
    # Горизонтальные кольца по периметру на каждом ring-step-м Y-уровне.
    # Отключены для ВЫДЕЛЕНИЯ (его контур — 12 рёбер); работают только
    # в подсветке регионов.
    enabled: true
    # Шаг колец по Y (в блоках): 8 = кольцо каждые 8 блоков.
    step: 8
  # Сетка-«квадраты» на ВСЕХ гранях региона. Работает только для подсветки
  # регионов (PARTICLES/BLOCKS) — выделение игрока её не рисует.
  grid:
    enabled: true
    # Шаг линий сетки (в блоках; 25 = квадраты 25x25 на каждой грани).
    step: 25

# ------------------------------------------------------------
# Частицы выделения
# ------------------------------------------------------------
particles:
  enabled: true
  update-ticks: 10        # пересчёт точек частиц раз в N тиков (защита от спама колеса)
  particle: DUST          # Particle из Bukkit (DUST, FLAME, END_ROD, VILLAGER_HAPPY...)
  dust-color: "#00ff00"   # цвет для DUST, формат #RRGGBB
  dust-size: 0.6
  amount: 1               # частиц на точку
  speed: 0.0
  # Не влияет на прореживание с 2026-09-06: шаг пунктира считается из
  # budget/12 точек на ребро, бюджет = max-points.
  point-density: 2
  # жёсткий потолок общего числа точек за тик
  max-points: 4000

# ------------------------------------------------------------
# Боссбар / actionbar статуса выделения
# ------------------------------------------------------------
bossbar:
  enabled: true
  # BOSSBAR | ACTIONBAR | NONE (NONE = только заполнители %qqregions_selection_*%)
  mode: BOSSBAR
  update-ticks: 5
  # SOLID | SEGMENTED_6 | SEGMENTED_10 | SEGMENTED_12 | SEGMENTED_20
  style: SEGMENTED_10
  normal:
    color: WHITE
    text: "&8[&7{current}&8/&7{max}&8] &7блоков"
  full:
    # При максимуме полоса красная, но current/max всё равно показываются.
    color: RED
    text: "&c{value-color}{current}&8/&8{max}&c — максимум блоков!"
  conflict:
    color: YELLOW
    text: "&eВыделение пересекает чужой регион!"
# Цвет значения {current} ({value-color}): белым при норме, красным —
  # когда достигнут максимум (полоса остаётся красной из full.color).
  value-color: "&f"

# ------------------------------------------------------------
# Экшнбар/боссбар статуса выделения (для ВСЕХ способов select)
# ------------------------------------------------------------
select-status:
  enabled: true
  # Обновляемый цветной текст в экшнбаре во время ИНТЕРАКТИВНОГО select
  # (/region select). Тексты и цвета — из bossbar.normal/full/conflict
  # (работает поверх боссбара, не мешая ему).
  interactive-actionbar: true
  # Показывать статус (экшнбар + боссбар) после КОМАНДНЫХ способов select:
  # pos, point, max, chunk, expand, outset. Держится show-seconds.
  command-show: true
  # Режим статуса для командных выделений: BOTH (экшнбар + боссбар) |
  # ACTIONBAR | BOSSBAR
  command-mode: BOTH
  # Сколько секунд держать статус после командного выделения (0 = пока не
  # изменится выделение/не выйдет игрок)
  show-seconds: 10
  # Обновлять статус каждые N тиков
  update-ticks: 5
  # Отдельный экшнбар с дополнительной информацией о выделении — показывается
  # ПОВЕРХ основного статуса для всех способов select.
  # Плейсхолдеры:
  #   {height-top}       — сколько блоков от игрока до верхней границы выделения
  #   {height-bottom}    — сколько блоков от игрока до нижней границы выделения
  #   {conflict}         — да/нет: есть ли в выделении кусок чужого региона
  #   {conflict-regions} — названия чужих регионов через запятую
  #   {conflict-count}   — число таких регионов
  #   {current} {max} {percent} {player}
  info:
    enabled: true
    show-seconds: 10
    update-ticks: 5
    text: "&7Верх: &a{height-top}&7 / Низ: &a{height-bottom} &8• &7Конфликты: &f{conflict-count} &8(&f{conflict-regions}&8)"

# ------------------------------------------------------------
# Защита механик от лага/высокого пинга (enable: false по умолчанию)
# ------------------------------------------------------------
guard:
  # Когда включено, клики кнопок меню (и другие механики кнопок)
  # ОТМЕНЯЮТСЯ, если сервер нагружен (TPS ниже min-tps) или пинг игрока
  # выше max-ping мс. Защищает от «дюпа» предметов из кнопок при лагах.
  enabled: false
  min-tps: 15.0
  max-ping: 5000

# ------------------------------------------------------------
# Лимиты регионов
# ------------------------------------------------------------
regions:
  # Максимум регионов на игрока (0 = без лимита).
  # К базе добавляется число из пакетов «+регион» магазина (shop.yml).
  max-regions: 0

# ------------------------------------------------------------
# Меню флагов и магазин флагов.
# ------------------------------------------------------------
flags-menu:
  # Флаги, доступные ВСЕМ бесплатно, без права. Пустой список = прежнее
  # поведение: флаг виден только при праве qqregions.flags.<флаг>.
  whitelist: []
  #   - "pvp"
  #   - "build"
  #   - "entry"
  # Флаги, которые НЕ продаются в магазине (и видны только по праву).
  # Полезно для служебных: territory-visible, territory-type.
  shop-ignore:
    - "territory-visible"
    - "territory-type"

# Пользовательские названия флагов: выводятся в меню флагов, магазине,
# «моих флагах» и учитываются при поиске. Ключ = id флага (нижний регистр).
flags-names:
  # pvp: "Сражения"
  # deny-message: "Сообщение при входе"
  # entry: "Вход в регион"

# ------------------------------------------------------------
# Рынок: продажа и аренда регионов (/region sell|rent|buy|tenant|market).
# Требует Vault + плагин экономики (EssentialsX, CMI, ...) — мягкая
# зависимость: без Vault рынок выключен и команды отвечают об этом.
# ------------------------------------------------------------
market:
  enabled: true
  # Как распределять оплату при продаже/аренде, если у региона несколько
  # владельцев: single — вся сумма инициатору (кто выставил объявление);
  # split — разделить поровну между ВСЕМИ владельцами региона.
  multiowner: single
  # Комиссия сервера с продажи/аренды. rate — доля от суммы (1.0 = 100%,
  # 0.05 = 5%, 0.01 = 1%). Списывается с получателя: продавец/владелец
  # получает сумму х (1 - rate), остальное уходит серверу (никому).
  commission:
    enable: false
    rate: 0.01
  # Сколько МИНУТ живёт ПРИВАТНОЕ предложение (с ником) в ожидании, пока
  # контрагент примет или отклонит. По истечении срока объявление снимается
  # с рынка, владельцы региона не меняются. 0 = без ограничения.
  offer-timeout-minutes: 60
  # Что сделать с ПРИВАТНЫМ предложением по истечении offer-timeout-minutes:
  # RELIST — перевыставить регион ПУБЛИЧНО (цена и условия сохраняются);
  # CANCEL — снять объявление с рынка (владельцы региона не меняются).
  offer-timeout-action: RELIST
  economy:
    # Подключать ли Vault (false — экономии нет, команды откажут).
    enabled: true
    # Символ валюты и его позиция: 1000 ₽ (AFTER) | ₽ 1000 (BEFORE).
    symbol: "₽"
    symbol-position: AFTER
    # Сколько знаков после запятой (0-2).
    decimal-places: 0
    # Группировать разряды (1000 -> 1 000). Примеры форматов:
    #   1,000 (grouping: true, group-separator: ",")
    #   1.000 (grouping: true, group-separator: ".")
    #   1000   (grouping: false)
    #   1000.00 (grouping: false, decimal-places: 2)
    #   1.000,00 (grouping: true, group-separator: ".", decimal-separator: ",")
    grouping: true
    group-separator: ","
    decimal-separator: "."
  rent:
    # Кем становится арендатор: MEMBER | OWNER.
    grant: MEMBER
    # Как взимается плата: ONCE (один раз за весь срок) | PERIOD (списывать
    # каждый период — period-minutes — до конца срока).
    charge: PERIOD
    # Период списания/перепроверки аренды (минуты) при charge: PERIOD.
    period-minutes: 1440
    # Сколько МИНУТ объявление об аренде живёт в маркете после выставления
    # или автовозврата (по умолчанию; владелец меняет кнопкой в своём листинге).
    list-duration-minutes: 10080
    # Автовозврат с автопродлением: после окончания аренды объявление
    # автоматически снова выставляет регион в маркете. false — аренда
    # завершается, объявление уходит с рынка.
    auto-rent: true
  # Голограмма-вывеска РЫНКА (market.market-holo): ОДНА плавающая голограмма у
  # периметра региона, которая «облетает» границы следом за игроком и всегда
  # смотрит на него (billboard). Видна любому игроку в радиусе view-distance,
  # чей Y находится ВНУТРИ высот региона. Текст и цвета — в lang.yml (market-holo).
  market-holo:
    enabled: true
    # На каком расстоянии (по X/Z) от региона голограмма начинает вести игрока.
    view-distance: 24
    # Насколько выше/ниже УРОВНЯ ИГРОКА висит голограмма (0 = ровно на Y игрока).
    y-offset: 0.5
    # Множитель размера текста голограммы.
    scale: 1.0
    # Макс. длина строки в блоках (ширина текста голограммы).
    line-width: 200
# ------------------------------------------------------------
# Рейд клана «Воришка» (JustTeams).
# Кнопка «Рейд» в меню info у шаблона other (посторонний). Нужен
# установленный JustTeams (банк клана) + (для source: PLAYER) Vault.
# Процесс: нападающие (члены ОДНОГО клана) приходят в регион, один
# жмёт кнопку, все должны ПРОДЕРЖАТЬСЯ в регионе capture-time секунд
# (выход любого — рейд срывается), затем случайный «вор» получает
# доступ к региону на thief-time секунд, потом права снимаются и у
# региона начинается кулдаун cooldown-time секунд.
# placeholder-ы сообщений: {region} {world} {clan} {count} {total}
# {thief} {time} {percent} {player}
# ------------------------------------------------------------
raid:
  enabled: true
  # Мин. число нападающих (членов клана) в регионе для старта рейда.
  min-attackers: 4
  # Мин. % ОНЛАЙН-членов клана, которые должны быть в регионе в момент
  # старта. < 1 = доля (0.5 = 50%), >= 1 = проценты (50 = 50%).
  online-percent: 50
  # Секунды фазы захвата: все нападающие должны оставаться в регионе.
  capture-time: 60
  # Секунды, которые «вор» держит доступ к региону.
  thief-time: 60
  # Секунды кулдауна региона после завершения рейда.
  cooldown-time: 300
  # Регионы, которые нельзя рейдить (id, по нижнему регистру).
  blacklist:
    - ""
  # Требовать, чтобы владельцы/участники региона были офлайн для старта.
  owners-offline-required: true
  # Срывать рейд, если владелец/участник региона зашёл во время захвата.
  abort-on-owner-online: true
  # Списание монет за рейд: PLAYER — процент с баланса нападающего
  # (инициатора), CLAN — процент с банка клана JustTeams.
  economy:
    enabled: true
    source: CLAN
    # Процент: < 1 = доля (0.5 = 50%), >= 1 = проценты (10 = 10%).
    percent: 10
  # Отображение процесса: BOSSBAR | ACTIONBAR | NONE
  display:
    mode: ACTIONBAR
    update-ticks: 20
    color: RED
    style: SEGMENTED_10
    text: "&cЗахват {region}: &f{time}&c сек • нападающих &f{count}&c/&f{total}"
    # Полоса фазы «вора» (после захвата). Плейсхолдеры: {thief} {time}.
    thief-text: "&2Вор &f{thief}&2: &f{time}&2 сек"
    thief-color: GREEN
  # Оповещения этапов. commands: asConsole!... / asPlayer!...
  notify:
    start:
      message: "&8[&cКлан&8] &f{clan} &cнападает на регион &f{region}&7!"
      commands: []
    thief:
      message: "&2Вор &f{thief} &2получил доступ к региону &f{region}&2."
      commands: []
    end:
      message: "&7Рейд на &f{region} &7завершён: &f{clan}&7 получил ресурсы региона."
      commands: []
    reset:
      message: "&cРейд на &f{region} &cсорван!"
      commands: []
