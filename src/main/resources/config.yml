# ============================================================
#  QQRegions — настройки
#  Автор: AllF1RE
#
#  Всё, что выводится игроку/админу/в консоль, настраивается в
#  файле lang.yml в формате   ключ: "перевод".
#  Заполнители вида {имя} подставляются плагином автоматически.
# ============================================================

# ------------------------------------------------------------
# Команда и алиасы. Первичное имя берётся из plugin.yml, алиасы
# ниже подключаются/убираются при каждом /region reload.
# ------------------------------------------------------------
command:
  name: "region"
  aliases:
    - "territory"
    - "tr"
    - "rg"
    - "private"
    - "zone"

# ------------------------------------------------------------
# Отладка: подробные сообщения в консоль для всех механик
# (сессия выделения, выбор точек, кнопки, синхронизация sVis).
# ------------------------------------------------------------
debug: false

# ------------------------------------------------------------
# Ограничения
# ------------------------------------------------------------
restrictions:
  # Миры, в которых плагин полностью выключен.
  disabled-worlds:
    - "test"
    - "test1"
  # Регионы, с которыми нельзя работать (создавать/удалять/редактировать).
  # Например global, spawn, jail, pvp. Работает по нижнему регистру.
  banned-regions:
    - "global"
    - "spawn"
    - "jail"
    - "pvp"

# ------------------------------------------------------------
# Название региона
# ------------------------------------------------------------
region-name:
  # Регулярное выражение допустимого названия. И как общий формат,
  # и как проверка при интерактивном вводе имени.
  regex: "[A-Za-zА-Яа-я0-9_-]{3,32}"
  # WorldGuard хранит названия только строчными буквами.
  force-lowercase: true

# ------------------------------------------------------------
# Шаблоны прав выделения.
# Для игрока выбирается шаблон с наибольшим приоритетом, у которого
# совпадает право (permission) ИЛИ выполняется условие placeholder.
# placeholder — выражение вида "%заполнитель%>=60" или "true"/"false".
# Пустая строка / [] в permission или placeholder = не проверять.
# ------------------------------------------------------------
selection-templates:
  default:
    permission: ""          # или, например, "qqregions.template.default"
    placeholder: ""         # например "%auraskills_power%>=1"
    priority: 1
    max-blocks: 10000
    min-blocks: 100
    chunks: 16
#  Пример для группы от LuckPerms:
#  vip:
#    permission: "luckperms.vip"
#    placeholder: ""
#    priority: 10
#    max-blocks: 50000
#    min-blocks: 200
#    chunks: 32

# ------------------------------------------------------------
# Интерактивное выделение (команда /region select без аргументов)
# ------------------------------------------------------------
interactive:
  # Скорость движения точки колесом: за wheel-slots делений колеса точка
  # проходит wheel-distance блоков. Пример: 2 деления = 1 блок (медленно),
  # 1 деление = 4 блока (быстро). Дробные значения работают (накопление).
  wheel-slots: 2
  wheel-distance: 1
  # Во сколько раз быстрее двигается точка, когда игрок крутит колесо,
  # стоя на Шифте.
  wheel-shift-speed: 4
  # Зеркалить направление колеса
  invert-wheel: false
  # Точка всегда движется ТОЧНО по направлению взгляда (в т.ч. вверх/вниз).
  # Углы/пороги для вертикального движения больше не используются.
  # Материалы кнопок хотбара (1-9 => create/—/select/—/reset/—/—/cancel)
  buttons:
    create:
      material: LIME_DYE
    select:
      material: GOLD_INGOT
    reset:
      material: LIGHT_GRAY_DYE
    cancel:
      material: RED_DYE
  # Команды, которые нельзя вводить, пока активна сессия выделения
  # (защита от продажи/выброса кнопок). Сравнение по префиксу: "ah"
  # заблокирует и /ah sell, и /ah bids, и сам /ah.
  blocked-commands:
    - "ah"
    - "sell"
    - "shop"
    - "baltop"
  # Передавать наше выделение в WorldEdit-селекцию игрока, чтобы
  # sVis (Selection Visualizer) автоматически подсвечивал область.
  sync-worldedit: true
  # Как отображать выделение игроку:
  #   PARTICLES — обычные частицы (DUST) по рёбрам объёма,
  #   BLOCKS    — миниатюрные Block Display + glow в цвете точки.
  view-mode: PARTICLES
  # Подсвечивать выделение и для обычных команд (/region select pos 1,
  # select chunk, select expand ...), не только в интерактивной сессии.
  command-selection-view: true
  # Через сколько СЕКУНД без изменений подсветка скрывается (задержка
  # авто-скрытия): для PARTICLES частицы перестают пересылаться — подсветка
  # плавно гаснет; для BLOCKS блоки-дисплеи убираются. Любое изменение
  # выделения снова включает подсветку. 0 = держать, пока выделение есть.
  view-hide-after: 5
  # На каком расстоянии от центра выделения (по XZ) подсветка скрывается
  # (жёсткое авто-скрытие). 0 = не использовать. «500» = игрок отошёл на
  # 500 блоков — подсветку убрать.
  view-hide-distance: 0
  # НЕ используется для контура выделения с 2026-09-06: весь объём рисуется
  # целиком, «дальние куски» не обрезаются.
  view-distance: 200
  # Число точек-кубиков на ОДНО ребро куба в BLOCKS-режиме. Пунктир по
  # правилу «20б -> 1·0·1, 40б -> 1·0·0·1 и т.д.»: у каждого ребра почти
  # равное число точек, шаг растёт с длиной ребра (короткие рёбра идут
  # каждым блоком). Все 12 рёбер рисуются целиком, вертикальные грани
  # никогда не пропадают. Потолок дисплеев = этот ключ * 12.
  # max-points (particles) — бюджет точек для PARTICLES-режима.
  view-dots-per-edge: 16
  # Потолок одновременно существующих блоков-дисплеев.
  view-max-blocks: 500
  # Размер блоков-дисплеев (относительный; маркер активной точки крупнее).
  view-block-scale: 0.35
  # Стили точек в режиме выделения: стеклянные панели хотбара (все 9
  # слотов), цвет частиц активной точки/области и цветной блок-дисплей.
  # pane — материал панели, highlight — цвет частиц/свечения (#RRGGBB),
  # block — материал блок-дисплея (для view-mode: BLOCKS).
  # Имена панелей настраиваются в lang.yml (select.point-pane-1/2).
  select-points:
    point-1:
      pane: GRAY_STAINED_GLASS_PANE
      highlight: "#6b6b6b"      # тёмно-серый
      block: GRAY_CONCRETE
    point-2:
      pane: YELLOW_STAINED_GLASS_PANE
      highlight: "#ffa500"      # оранжевый
      block: ORANGE_CONCRETE

# ------------------------------------------------------------
# Подсветка регионов: команды /region visible и флаг territory-visible.
# Флаг ставится в меню флагов региона (иконка — лампа), при входе игрока
# в регион с флагом allow границы подсвечиваются и гаснут сами через
# show-seconds. Флаг срабатывает не чаще, чем раз в cooldown-seconds на
# игрока и регион — бег вдоль границы не спамит частицами и не нагружает.
# ------------------------------------------------------------
highlight:
  # Общий выключатель фичи (команды + флаг). false — всё не работает.
  enabled: true
  # Включать ли сам флаг territory-visible: false сильнее enabled для
  # флага (флаг регистрируется и виден в меню, но вход не подсвечивается;
  # команда /region visible продолжает работать).
  flag-enabled: true
  # Тип подсветки: PARTICLES — частицы, BLOCKS — блок-дисплеи со свечением,
  # TERRITORY — частицы над верхними блоками вдоль границы по рельефу
  # (в т.ч. под землёй — над сводами пещер рядом с границей).
  type: PARTICLES
  # Скрывать подсветку при ВЫХОДЕ из региона: подсветка от флага живёт,
  # пока игрок ВНУТРИ, и убирается, как только он вышел (сброс кулдауна —
  # повторный вход снова подсвечивает). false = старый режим: контур
  # рисуется show-seconds и гаснет сам, кулдаун действует по-прежнему.
  hide-on-exit: true
  # Сколько секунд виден контур региона, потом гаснет сам.
  show-seconds: 10
  # Кулдаун повторного срабатывания флага (сек) на игрока и регион.
  cooldown-seconds: 10
  # Как часто проверять вход игроков в регионы. Считается в серверных тиках
  # (1 тик = 1/20 сек; 20 = раз в секунду). Кулдаун срабатывания всё равно
  # ограничивает частоту показа.
  scan-ticks: 20
  # Материал блок-дисплеев для типа BLOCKS.
  block: GLASS
  block-scale: 0.35
  # Параметры частиц контура региона (как в разделе particles).
  particles:
    enabled: true
    update-ticks: 10    # интервал пересылки частиц (в серверных тиках)
    particle: DUST
    dust-color: "#00ff00"
    dust-size: 0.6
    amount: 1
    speed: 0.0
    # Бюджет точек контура (для BLOCKS это и потолок дисплеев).
    max-points: 600

# ------------------------------------------------------------
# Частицы выделения
# ------------------------------------------------------------
particles:
  enabled: true
  update-ticks: 10        # пересчёт точек частиц раз в N тиков (защита от спама колеса)
  particle: DUST          # Particle из Bukkit (DUST, FLAME, END_ROD, VILLAGER_HAPPY...)
  dust-color: "#00ff00"   # цвет для DUST, формат #RRGGBB
  dust-size: 0.6
  amount: 1               # частиц на точку
  speed: 0.0
  # Не влияет на прореживание с 2026-09-06: шаг пунктира считается из
  # budget/12 точек на ребро, бюджет = max-points.
  point-density: 2
  # жёсткий потолок общего числа точек за тик
  max-points: 4000

# ------------------------------------------------------------
# Боссбар / actionbar статуса выделения
# ------------------------------------------------------------
bossbar:
  enabled: true
  # BOSSBAR | ACTIONBAR | NONE (NONE = только заполнители %qqregions_selection_*%)
  mode: BOSSBAR
  update-ticks: 5
  # SOLID | SEGMENTED_6 | SEGMENTED_10 | SEGMENTED_12 | SEGMENTED_20
  style: SEGMENTED_10
  normal:
    color: WHITE
    text: "&8[&7{current}&8/&7{max}&8] &7блоков"
  full:
    # При максимуме полоса красная, но current/max всё равно показываются.
    color: RED
    text: "&c{value-color}{current}&8/&8{max}&c — максимум блоков!"
  conflict:
    color: YELLOW
    text: "&eВыделение пересекает чужой регион!"
  # Цвет значения {current} ({value-color}): белым при норме, красным —
  # когда достигнут максимум (полоса остаётся красной из full.color).
  value-color: "&f"

# ------------------------------------------------------------
# Рынок: продажа и аренда регионов (/region sell|rent|buy|tenant|market).
# Требует Vault + плагин экономики (EssentialsX, CMI, ...) — мягкая
# зависимость: без Vault рынок выключен и команды отвечают об этом.
# ------------------------------------------------------------
market:
  enabled: true
  economy:
    # Подключать ли Vault (false — экономии нет, команды откажут).
    enabled: true
    # Символ валюты и его позиция: 1000 ₽ (AFTER) | ₽ 1000 (BEFORE).
    symbol: "₽"
    symbol-position: AFTER
    # Сколько знаков после запятой (0-2).
    decimal-places: 0
    # Группировать разряды (1000 -> 1 000). Примеры форматов:
    #   1,000 (grouping: true, group-separator: ",")
    #   1.000 (grouping: true, group-separator: ".")
    #   1000   (grouping: false)
    #   1000.00 (grouping: false, decimal-places: 2)
    #   1.000,00 (grouping: true, group-separator: ".", decimal-separator: ",")
    grouping: true
    group-separator: ","
    decimal-separator: "."
  rent:
    # Кем становится арендатор: MEMBER | OWNER.
    grant: MEMBER
    # Как взимается плата: ONCE (один раз за весь срок) | PERIOD (списывать
    # каждый период — period-minutes — до конца срока).
    charge: PERIOD
    # Период списания/перепроверки аренды (минуты) при charge: PERIOD.
    period-minutes: 1440
# ------------------------------------------------------------
# Рейд клана «Воришка» (JustTeams).
# Кнопка «Рейд» в меню info у шаблона other (посторонний). Нужен
# установленный JustTeams (банк клана) + (для source: PLAYER) Vault.
# Процесс: нападающие (члены ОДНОГО клана) приходят в регион, один
# жмёт кнопку, все должны ПРОДЕРЖАТЬСЯ в регионе capture-time секунд
# (выход любого — рейд срывается), затем случайный «вор» получает
# доступ к региону на thief-time секунд, потом права снимаются и у
# региона начинается кулдаун cooldown-time секунд.
# placeholder-ы сообщений: {region} {world} {clan} {count} {total}
# {thief} {time} {percent} {player}
# ------------------------------------------------------------
raid:
  enabled: false
  # Мин. число нападающих (членов клана) в регионе для старта рейда.
  min-attackers: 2
  # Мин. % ОНЛАЙН-членов клана, которые должны быть в регионе в момент
  # старта. < 1 = доля (0.5 = 50%), >= 1 = проценты (50 = 50%).
  online-percent: 50
  # Секунды фазы захвата: все нападающие должны оставаться в регионе.
  capture-time: 60
  # Секунды, которые «вор» держит доступ к региону.
  thief-time: 60
  # Секунды кулдауна региона после завершения рейда.
  cooldown-time: 300
  # Регионы, которые нельзя рейдить (id, по нижнему регистру).
  blacklist:
    - ""
  # Требовать, чтобы владельцы/участники региона были офлайн для старта.
  owners-offline-required: true
  # Срывать рейд, если владелец/участник региона зашёл во время захвата.
  abort-on-owner-online: true
  # Списание монет за рейд: PLAYER — процент с баланса нападающего
  # (инициатора), CLAN — процент с банка клана JustTeams.
  economy:
    enabled: false
    source: CLAN
    # Процент: < 1 = доля (0.5 = 50%), >= 1 = проценты (10 = 10%).
    percent: 10
  # Отображение процесса: BOSSBAR | ACTIONBAR | NONE
  display:
    mode: ACTIONBAR
    update-ticks: 20
    color: RED
    style: SEGMENTED_10
    text: "&cЗахват {region}: &f{time}&c сек • нападающих &f{count}&c/&f{total}"
  # Оповещения этапов. commands: asConsole!... / asPlayer!...
  notify:
    start:
      message: "&8[&cКлан&8] &f{clan} &cнападает на регион &f{region}&7!"
      commands: []
    thief:
      message: "&2Вор &f{thief} &2получил доступ к региону &f{region}&2."
      commands: []
    end:
      message: "&7Рейд на &f{region} &7завершён: &f{clan}&7 получил ресурсы региона."
      commands: []
    reset:
      message: "&cРейд на &f{region} &cсорван!"
      commands: []
