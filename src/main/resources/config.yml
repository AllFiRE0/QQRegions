      # ВСЕ виды калиток
      - "oak_fence_gate"
      - "spruce_fence_gate"
      - "birch_fence_gate"
      - "jungle_fence_gate"
      - "acacia_fence_gate"
      - "dark_oak_fence_gate"
      - "mangrove_fence_gate"
      - "cherry_fence_gate"
      - "pale_oak_fence_gate"
      - "bamboo_fence_gate"
      - "crimson_fence_gate"
      - "warped_fence_gate"
      # ВСЕ виды каменных заборов/стен
      - "cobblestone_wall"
      - "mossy_cobblestone_wall"
      - "stone_brick_wall"
      - "mossy_stone_brick_wall"
