# ============================================================
#  QQRegions — настройки
#  Автор: AllF1RE
#
#  Всё, что выводится игроку/админу/в консоль, настраивается в
#  файле lang.yml в формате   ключ: "перевод".
#  Заполнители вида {имя} подставляются плагином автоматически.
# ============================================================
#
# Версия конфига: при выходе новой версии плагина, у которой этот номер
# выше, чем в вашем файле, config.yml пересоздаётся из новых дефолтов
# автоматически (старый файл остаётся как config.yml.old). Значения ниже
# — уже настроенный дефолт, повторно вводить их не нужно.
config-version: 11

# ------------------------------------------------------------
# Команда и алиасы. Первичное имя берётся из plugin.yml, алиасы
# ниже подключаются/убираются при каждом /region reload.
# ------------------------------------------------------------
command:
  name: "region"
  aliases:
    - "territory"
    - "tr"
    - "rg"
    - "region"
    - "regions"
    - "private"
    - "zone"

# ------------------------------------------------------------
# Отладка: подробные сообщения в консоль для всех механик
# (сессия выделения, выбор точек, кнопки, синхронизация sVis).
# ------------------------------------------------------------
debug: false

# ------------------------------------------------------------
# Ограничения
# ------------------------------------------------------------
restrictions:
  # Миры, в которых плагин полностью выключен.
  disabled-worlds:
    - "test"
    - "test1"
  # Территории, с которыми нельзя работать (создавать/удалять/редактировать).
  # Например global, spawn, jail, pvp. Работает по нижнему регистру.
  banned-regions:
    - "global"
    - "spawn"
    - "jail"
    - "pvp"
    - "__global__"
    - "pvparena"
    - "arena"
    - "pvp_arena"
    - "mine"

# ------------------------------------------------------------
# Название территории
# ------------------------------------------------------------
region-name:
  # Регулярное выражение допустимого названия. И как общий формат,
  # и как проверка при интерактивном вводе имени.
  # Русский + Английский "[A-Za-zА-Яа-я0-9_-]{3,32}"
  regex: "[A-Za-z0-9_-]{3,32}"
  # WorldGuard хранит названия только строчными буквами.
  force-lowercase: true

# ------------------------------------------------------------
# Шаблоны прав выделения.
# Для игрока выбирается шаблон с наибольшим приоритетом, у которого
# совпадает право (permission) ИЛИ выполняется условие placeholder.
# placeholder — выражение вида "%заполнитель%>=60" или "true"/"false".
# Пустая строка / [] в permission или placeholder = не проверять.
# ------------------------------------------------------------
selection-templates:
  default:
    permission: ""          # или, например, "qqregions.template.default"
    placeholder: ""         # например "%auraskills_power%>=1"
    priority: 1
    max-blocks: 10000
    min-blocks: 100
    chunks: 16
#  Пример для группы от LuckPerms:
#  vip:
#    permission: "luckperms.vip"
#    placeholder: ""
#    priority: 10
#    max-blocks: 50000
#    min-blocks: 200
#    chunks: 32

# ------------------------------------------------------------
# Интерактивное выделение (команда /region select без аргументов)
# ------------------------------------------------------------
interactive:
  # Скорость движения точки колесом: за wheel-slots делений колеса точка
  # проходит wheel-distance блоков. Пример: 2 деления = 1 блок (медленно),
  # 1 деление = 4 блока (быстро). Дробные значения работают (накопление).
  wheel-slots: 2
  wheel-distance: 1
  # Во сколько раз быстрее двигается точка, когда игрок крутит колесо,
  # стоя на Shift.
  wheel-shift-speed: 4
  # Зеркалить направление колеса
  invert-wheel: false
  # Точка всегда движется ТОЧНО по направлению взгляда (в т.ч. вверх/вниз).
  # Углы/пороги для вертикального движения больше не используются.
  # Материалы кнопок хотбара (1-9 => create/point1/point2/select/—/reset/—/—/cancel)
  # slot: — позиция в хотбаре (0-8, 0 — крайняя слева). Можно переназначить
  # любой кнопке любой слот; кнопка продолжает действовать ПКМ/ЛКМ в руке.
  buttons:
    create:
      material: LIME_DYE
      slot: 0
    point1:
      material: ORANGE_TERRACOTTA
      slot: 1
    point2:
      material: GREEN_CONCRETE
      slot: 2
    select:
      material: GOLD_INGOT
      slot: 3
    reset:
      material: LIGHT_GRAY_DYE
      slot: 5
    cancel:
      material: RED_DYE
      slot: 8
  # Режим выделения области (SCM): активная точка управляется колесом мыши
  # или клавишами 4/6 (вверх/вниз). Чтобы клавиши 4/6 работали как колесо,
  # выбранный слот всегда возвращается на центр (4 = 5-я ячейка хотбара).
  select-center-slot: 4
  # Команды, которые нельзя вводить, пока активна сессия выделения
  # (защита от продажи/выброса кнопок). Сравнение по префиксу: "ah"
  # заблокирует и /ah sell, и /ah bids, и сам /ah.
  blocked-commands:
    - "ah"
    - "auction"
    - "auc"
    - "sellitem"
    - "seller"
    - "sell"
    - "shop"
    - "pay"
    - "money"
    - "baltop"
    - "rt"
    - "rtp"
    - "randomtp"
    - "tpr"
    - "trp"
    - "tpa"
    - "tpo"
    - "tphere"
    - "pvp"
    - "home"
    - "homes"
    - "warp"
    - "warps"
    - "spawn"
    - "back"
    - "dback"
    - "deathback"
    - "world"
    - "backpack"
    - "bp"
    - "battlepass"
    - "quest"
    - "mine"
  # Передавать наше выделение в WorldEdit-селекцию игрока, чтобы
  # sVis (Selection Visualizer) автоматически подсвечивал область.
  sync-worldedit: true
  # Главное меню территорий (/region без аргументов). Шаблон — menus/main.yml.
  main-menu:
    # Кнопка «Назад» в слоте 0 главного меню. Выключена по умолчанию:
    # добавьте это в меню сами (или включите ниже), если она нужна.
    back-enabled: false
    # Команда кнопки (выполняется от имени игрока): "@back" — вернуться
    # в предыдущее меню, или любая команда, например "spawn".
    back-command: "@back"
  # Как отображать выделение игроку:
#   PARTICLES — обычные частицы (DUST) по рёбрам объёма,
  #   BLOCKS    — миниатюрные Block Display + glow в цвете точки.
  view-mode: BLOCKS
# Подсвечивать выделение и для обычных команд (/region select pos 1,
  # select chunk, select expand ...), не только в интерактивной сессии.
  command-selection-view: true
  # Авто-скрытие подсветки КОМАНДНОГО выделения (/region select pos 1/2,
  # point, chunk, expand, ...) через N СЕКУНД без изменений. 0 = держать,
  # пока выделение есть. Не влияет на интерактивный select (у него свой
  # view-hide-after). По умолчанию 60 = общий таймаут (см. highlight.auto-hide).
  command-selection-hide-after: 60
  # Через сколько СЕКУНД без изменений подсветка скрывается (задержка
  # авто-скрытия): для PARTICLES частицы перестают пересылаться — подсветка
  # плавно гаснет; для BLOCKS блоки-дисплеи убираются. Любое изменение
  # выделения снова включает подсветку. 0 = держать, пока выделение есть.
  view-hide-after: 60
  # На каком расстоянии от центра выделения (по XZ) подсветка скрывается
  # (жёсткое авто-скрытие). 0 = не использовать. «500» = игрок отошёл на
  # 500 блоков — подсветку убрать.
  view-hide-distance: 0
  # НЕ используется для контура выделения с 2026-09-06: весь объём рисуется
  # целиком, «дальние куски» не обрезаются.
  view-distance: 200
# Число точек-кубиков на ОДНО ребро куба в BLOCKS-режиме (устарело с
  # введения global outline.max-gap/max-points: плотность контура теперь
  # считается из max-gap, see раздел "outline"). Оставлено для совместимости.
  view-dots-per-edge: 16
# Потолок блоков-дисплеев выделения: не меньше outline.max-points
  # (можно поднять выше для очень больших выделений).
  view-max-blocks: 500
  # Размер блоков-дисплеев (относительный; маркер активной точки крупнее).
  view-block-scale: 0.35
  # Стили точек в режиме выделения: стеклянные панели хотбара (все 9
  # слотов), цвет частиц активной точки/области и цветной блок-дисплей.
  # Логика: 1 точка — ОРАНЖЕВАЯ (верхняя), 2 точка — ЗЕЛЁНАЯ (нижняя).
  # pane — материал панели, highlight — цвет частиц/свечения (#RRGGBB),
  # block — материал блок-дисплея (для view-mode: BLOCKS).
  # Имена панелей настраиваются в lang.yml (select.point-pane-1/2).
  select-points:
    point-1:
      pane: ORANGE_STAINED_GLASS_PANE
      highlight: "#ff8c00"      # оранжевая
      block: ORANGE_TERRACOTTA
    point-2:
      pane: GREEN_STAINED_GLASS_PANE
      highlight: "#00a651"      # зелёная
      block: GREEN_CONCRETE
  # Максимальная дальность луча при установке точки: команды /region select
  # point 1|2 и кнопки хотбара «Точка 1/2» берут блок по прицелу не дальше
  # этого расстояния (иначе — позиция игрока). Защита от «выстрела точки»
  # лучом в конец мира на 100 млрд блоков.
  select-point-max-distance: 1000

# ------------------------------------------------------------
# Автообновление МЕНЮ QQRegions.
# Каждое открытое меню перерисовывается раз в N тиков (20 = 1 сек), чтобы
# цены/флаги/предложения/онлайн жили без переоткрытия. У КАЖДОГО меню свой
# переключатель в его файле (menus/*.yml, ключ update_interval): значение
# этого файла сильнее глобального ticks; 0 = автообновление выключено
# (действия по кнопкам всё равно перерисовывают меню).
# Дебаунс после клика (опционально, ПО УМОЛЧАНИЮ ВЫКЛ): клик по любой
# кнопке молча откладывает следующую перерисовку на ticks — автокликер не
# сможет грузить сервер пересборкой инвентарей чаще раза в ticks на игрока.
# Включите debounce-after-click: true, если хотите защиту от автокликеров
# в ущерб мгновенному отклику меню на клик.
# ------------------------------------------------------------
menu-update:
  # Глобальный дефолт интервала автообновления (тики; 20 = 1 сек; 0 = выкл).
  ticks: 20
  # Откладывать ли перерисовку меню после клика по кнопке (молча).
  # true — анти-автокликер: ограничивает пересборку инвентаря ~1 раз в ticks,
  # но ВИЗУАЛЬНЫЙ отклик меню на клик задерживается до ticks (по умолчанию ВЫКЛ).
  debounce-after-click: false

# ------------------------------------------------------------
# Подсветка территорий: команды /region visible и флаг territory-visible.
# Флаг ставится в меню флагов территории (иконка — лампа), при входе игрока
# в территория с флагом allow границы подсвечиваются и гаснут сами через
# show-seconds. Флаг срабатывает не чаще, чем раз в cooldown-seconds на
# игрока и территория — бег вдоль границы не спамит частицами и не нагружает.
# ------------------------------------------------------------
highlight:
  # Общий выключатель фичи (команды + флаг). false — всё не работает.
  enabled: true
  # Включать ли сам флаг territory-visible: false сильнее enabled для
  # флага (флаг регистрируется и виден в меню, но вход не подсвечивается;
  # команда /region visible продолжает работать).
  flag-enabled: true
  # Тип подсветки: PARTICLES — частицы, BLOCKS — блок-дисплеи со свечением,
  # TERRITORY — подсветка вдоль границы по рельефу (над верхними блоками
  # и под сводами пещер). Для TERRITORY способ отображения задаётся ниже
  # (territory.display): PARTICLES (частицы) или BLOCKS (дисплей-«забор»).
  type: TERRITORY
  # Скрывать подсветку при ВЫХОДЕ из территории: подсветка от флага живёт,
  # пока игрок ВНУТРИ, и убирается, как только он вышел (сброс кулдауна —
  # повторный вход снова подсвечивает). false = старый режим: контур
  # рисуется show-seconds и гаснет сам, кулдаун действует по-прежнему.
  hide-on-exit: true
  # Показывать подсветку и при ВЫХОДЕ из территории (как флаг exit у WorldGuard):
  # при выходе контур рисуется один раз show-seconds с кулдауном cooldown-seconds.
  # Является взаимозаменяемым с hide-on-exit: при show-on-exit: true выход
  # подсвечивает, а не скрывает. false = hide-on-exit (скрывать при выходе).
  show-on-exit: true
  # Таймаут авто-исчезновения подсветки ТЕРРИТОРИИ (контур territory-visible и
  # /region visible): через N секунд контур гаснет сам, даже когда игрок
  # стоит/летит внутри и сессия не сброшена. Повторный вход в территория или
  # повторная команда показывает подсветку снова.
  # НЕ влияет на выделения: у выделений свои ключи (interactive.view-hide-after
  # и interactive.command-selection-hide-after).
  # Старые ключи auto-hide-seconds и show-seconds читаются как fallback.
  region-hide-seconds: 60
  # Кулдаун повторного срабатывания флага (сек) на игрока и территория.
  cooldown-seconds: 10
  # Радиус АВТО-ПОКАЗА «своих» территорий (владелец/участник) вокруг игрока
  # (в блоках). Свои так же, как и чужие, подсвечиваются ТОЛЬКО по флагу
  # territory-visible ALLOW: территория без флага не загорится ни при полёте
  # рядом, ни при входе/выходе из соседнего территории с флагом.
  # 0 = вообще без авто-показа по радиусу (только территории под игроком).
  auto-show-radius: 16
  # Как часто проверять вход игроков в территории. Считается в серверных тиках
  # (1 тик = 1/20 сек; 20 = раз в секунду). Кулдаун срабатывания всё равно
  # ограничивает частоту показа.
  scan-ticks: 20
  # Материал блок-дисплеев для типа BLOCKS.
  block: GLASS
  block-scale: 0.35
  # Кэш рельефа для TERRITORY: пересчитывать точки территории (и «забора»)
  # не чаще, чем раз в N секунд. Поставили блок на границе — через N секунд
  # подсветка подтянет его автоматически; повторный запуск подсветки
  # пересчитывает сразу. Событие загрузки чанка тоже сбрасывает кэш мира.
  terrain-cache-seconds: 3
  # TERRITORY: способ отображения.
  #   PARTICLES — частицы над верхними блоками вдоль границы (старое).
  #   BLOCKS    — блок-дисплеи по периметру, повторяющие рельеф. Каждый
  #               блок-дисплей ставится ОТДЕЛЬНО (как штакетник): его размеры
  #               и шаг между соседями задаются в territory.fence.
  territory:
    display: BLOCKS
    # Блоки на границе, которые НЕ считаются рельефом (пустота): грибы,
    # трава, снег и т.п. — всё, что не должно участвовать в подсветке.
    # Bukkit-материалы: brown_mushroom, red_mushroom, tall_grass,
    # short_grass (1.20.3+; в старых версиях — grass), snow и т.д.
    #
    # ВАЖНО: «забор» (TERRITORY + display: BLOCKS) дополнительно ставится
    # ТОЛЬКО на ПОЛНЫЕ НЕПРОЗРАЧНЫЕ блоки (isOccluding): листья, стёкла,
    # плиты, ступени, заборы, рельсы, люки, лозы и т.п. опорой не считаются —
    # под листвой забор встаёт на ствол/землю, а не на верх кроны. Здесь же
    # список нужен, чтобы эти блоки не участвовали и в PARTICLE-рельефе.
    # Мод-блоки и новые спрайты добавляйте сами обычными именами Bukkit
    # (несуществующие имена просто пропускаются).
    ignore-blocks:
      - "brown_mushroom"
      - "red_mushroom"
      - "tall_grass"
      - "short_grass"
      - "bush"
      - "dead_bush"
      - "crimson_fungus"
      - "warped_fungus"
      - "sweet_berries"
      - "sweet_berry_bush"
      - "fern"
      - "large_fern"
      - "string"
      - "redstone"
      - "redstone_torch"
      - "torch"
      - "soul_torch"
      - "copper_torch"
      - "end_rod"
      - "chain"
      - "iron_bars"
      - "tripwire_hook"
      - "flower_pot"
      - "sulfur_spike"
      - "pointed_dripstone"
      - "big_dripleaf"
      - "small_dripleaf"
      - "glow_lichen"
      - "sculk_vein"
      - "cobweb"
      - "snow"
      - "lily_pad"
      - "stonecutter"
      - "campfire"
      - "soul_campfire"
      - "scaffolding"
      - "brewing_stand"
      - "grindstone"
      - "small_amethyst_bud"
      - "medium_amethyst_bud"
