    fence:
      # Материал блок-дисплеев (Bukkit Material) — БАЗОВЫЙ (для всех ролей,
      # у которых не задан свой, см. ниже foreign/member/owner). Полный блок
      # (OAK_PLANKS, STONE_BRICK, QUARTZ_BLOCK...) смотрится лучше, чем OAK_FENCE.
      material: WHITE_STAINED_GLASS
      # Высота одного блока-дисплея (по Y, в блоках). 1.0 = один блок.
      height: 1.0
      # Ширина одного блока-дисплея вдоль границы (в блоках). 0.3 = узкий.
      width: 0.3
      # Толщина поперёк границы (в блоках). 0.3 = тонкая стенка.
      thickness: 0.3
      # Расстояние между ЦЕНТРАМИ соседних блоков-дисплеев вдоль границы
      # (в блоках). 1.0 = блок в каждый блок границы; 2.0 = через блок;
      # 0.5 = два блока в один. При width == spacing забор сплошной.
      spacing: 1.0
      # Поднять (+) / опустить (-) забор относительно вершины рельефа (в блоках).
      # -0.5 = низ забора на полблока утоплен в верхний блок, не висит над ним
      # (этот дефолт взят с живого теста: забор встал на блоки ровно).
      offset: -0.5
      # Сдвиг ВДОЛЬ границы (в блоках) от центра колонки. 0 = штакетина по
      # центру своего блока; 0.5 = смещена на полблока по ходу границы.
      along-offset: 0.0
      # Сдвиг ПОПЕРЁК границы (в блоках): + = НАРУЖУ из территории, − = внутрь.
      # ДВА ГОТОВЫХ РЕЦЕПТА:
      #  - 0.0 = ОДИНАРНЫЕ столбики по центру своего пограничного блока:
      #    забор ровно совпадает с «квадратом выделения» подсветки территории
      #    (контур территории рисуется по центрам пограничных блоков), углы —
      #    по одному столбику. (Так надо, когда забор «по центру блока».)
      #  - 0.5 = панель прижата к ВНЕШНЕЙ грани пограничного блока: центр
      #    панели на самой линии границы территории; в углах два панеля сходятся
      #    у внешней вершины. При width >= spacing получается сплошная
      #    «стенка» вплотную к границе.
      # Промежуточные значения — произвольный сдвиг между центром блока (0.0)
      # и внешней гранью (0.5); 1.0 = целиком за внешней гранью территории;
      # − значения уводят во внутрь территории до центра блока (0.0).
      across-offset: 0.35
      # Светиться ли в цвет highlight.particles.dust-color.
      glow: true
      # ЦВЕТ ЗАБОРА ПО РОЛИ ИГРОКА (перекрывают базовый material/glow):
      #   foreign — ЧУЖОЙ территория (по умолчанию белое стекло),
      #   member  — территория, где игрок УЧАСТНИК (зелёное стекло),
      #   owner   — территория, где игрок ВЛАДЕЛЕЦ (жёлтое стекло).
      # Роли применяются только к TERRITORY+BLOCKS (забору); PARTICLES и BOX
      # подсветкам они не переключают цвет.
      foreign:
        material: WHITE_STAINED_GLASS
        glow: true
      member:
        material: LIME_STAINED_GLASS
        glow: true
      owner:
        material: YELLOW_STAINED_GLASS
        glow: true
  # Параметры частиц контура территории (как в разделе particles).
  particles:
    enabled: true
    update-ticks: 10    # интервал пересылки частиц (в серверных тиках)
    particle: DUST
    dust-color: "#00ff00"
    dust-size: 0.6
    amount: 1
    speed: 0.0
    # Лимит точек рельефа для TERRITORY (для PARTICLES/BLOCKS используется
    # глобальный outline.max-points, см. ниже).
    max-points: 600

# ------------------------------------------------------------
# Пунктир объёмного контура (выделение игрока + подсветка территорий
# типа PARTICLES/BLOCKS). Единый для обеих механик.
# Каждая линия (рёбра + кольца) рисуется точками с шагом НЕ БОЛЬШЕ max-gap
# блоков — у высоких областей (например, чанк-выделение на всю высоту мира)
# больше нет «дыр» из сотен блоков между точками.
# По высоте к вертикальным рёбрам добавляются горизонтальные «кольца» —
# прямоугольники по периметру на каждом ring-step-м Y-уровне: широкий территория
# видно сразу, даже стоя в середине границы. Верх и низ рисуются всегда.
# ВЫДЕЛЕНИЕ ИГРОКА рисует только грани (12 рёбер пунктиром с шагом max-gap).
  # ПОДСВЕТКА ТЕРРИТОРИЙ дополнительно «оборачивает» объём в клетку — сетка
  # квадратов на ВСЕХ гранях: верх, низ и четыре боковые (см. grid ниже).
  # Тот же вид, что был у highlight.grid, только полный куб.
# ------------------------------------------------------------
outline:
  # Максимальный зазор между соседними точками линии (в блоках).
  max-gap: 5
  # Потолок суммарного числа точек контура (частицы и блок-дисплеи).
  # При превышении контур прореживается равномерно.
  max-points: 3000
  rings:
    # Горизонтальные кольца по периметру на каждом ring-step-м Y-уровне.
    # Отключены для ВЫДЕЛЕНИЯ (его контур — 12 рёбер); работают только
    # в подсветке территорий.
    enabled: true
    # Шаг колец по Y (в блоках): 8 = кольцо каждые 8 блоков.
    step: 8
  # Сетка-«квадраты» на ВСЕХ гранях территории. Работает только для подсветки
  # территорий (PARTICLES/BLOCKS) — выделение игрока её не рисует.
  grid:
    enabled: true
    # Шаг линий сетки (в блоках; 25 = квадраты 25x25 на каждой грани).
    step: 25

# ------------------------------------------------------------
# Частицы выделения
# ------------------------------------------------------------
particles:
  enabled: true
  update-ticks: 10        # пересчёт точек частиц раз в N тиков (защита от спама колеса)
  particle: DUST          # Particle из Bukkit (DUST, FLAME, END_ROD, VILLAGER_HAPPY...)
  dust-color: "#00ff00"   # цвет для DUST, формат #RRGGBB
  dust-size: 0.6
  amount: 1               # частиц на точку
  speed: 0.0
  # Не влияет на прореживание с 2026-09-06: шаг пунктира считается из
  # budget/12 точек на ребро, бюджет = max-points.
  point-density: 2
  # жёсткий потолок общего числа точек за тик
  max-points: 4000

# ------------------------------------------------------------
# Боссбар / actionbar статуса выделения
# ------------------------------------------------------------
bossbar:
  enabled: true
  # BOSSBAR | ACTIONBAR | NONE (NONE = только заполнители %qqregions_selection_*%)
  mode: BOSSBAR
  update-ticks: 5
  # SOLID | SEGMENTED_6 | SEGMENTED_10 | SEGMENTED_12 | SEGMENTED_20
  style: SEGMENTED_10
  normal:
    color: WHITE
    text: "&8[&7{current}&8/&7{max}&8] &7блоков"
  full:
    # При максимуме полоса красная, но current/max всё равно показываются.
    color: RED
    text: "&8{value-color}{current}&8/&8{max}&8 — максимум блоков!"
  conflict:
    color: YELLOW
    text: "&eВыделение пересекает чужой территория!"
# Цвет значения {current} ({value-color}): белым при норме, красным —
  # когда достигнут максимум (полоса остаётся красной из full.color).
  value-color: "&f"

# ------------------------------------------------------------
# Экшнбар/боссбар статуса выделения (для ВСЕХ способов select)
# ------------------------------------------------------------
select-status:
  enabled: true
  # Обновляемый цветной текст в экшнбаре во время ИНТЕРАКТИВНОГО select
  # (/region select). Тексты и цвета — из bossbar.normal/full/conflict
  # (работает поверх боссбара, не мешая ему).
  interactive-actionbar: true
  # Показывать статус (экшнбар + боссбар) после КОМАНДНЫХ способов select:
  # pos, point, max, chunk, expand, outset. Держится show-seconds.
  command-show: true
  # Режим статуса для командных выделений: BOTH (экшнбар + боссбар) |
  # ACTIONBAR | BOSSBAR
  command-mode: BOTH
  # Сколько секунд держать статус после командного выделения (0 = пока не
  # изменится выделение/не выйдет игрок)
  show-seconds: 10
  # Обновлять статус каждые N тиков
  update-ticks: 5
  # Отдельный экшнбар с дополнительной информацией о выделении — показывается
  # ПОВЕРХ основного статуса для всех способов select.
  # Плейсхолдеры:
  #   {height-top}       — сколько блоков от игрока до верхней границы выделения
  #   {height-bottom}    — сколько блоков от игрока до нижней границы выделения
  #   {conflict}         — да/нет: есть ли в выделении кусок чужого территории
  #   {conflict-regions} — названия чужих территорий через запятую
  #   {conflict-count}   — число таких территорий
  #   {current} {max} {percent} {player}
  info:
    enabled: true
    show-seconds: 10
    update-ticks: 5
    text: "&7Верх: &a{height-top}&7 / Низ: &a{height-bottom} &8• &7Конфликты: &f{conflict-count} &8(&f{conflict-regions}&8)"

# ------------------------------------------------------------
# Защита механик от лага/высокого пинга (enable: false по умолчанию)
# ------------------------------------------------------------
guard:
  # Когда включено, клики кнопок меню (и другие механики кнопок)
  # ОТМЕНЯЮТСЯ, если сервер нагружен (TPS ниже min-tps) или пинг игрока
  # выше max-ping мс. Защищает от «дюпа» предметов из кнопок при лагах.
  enabled: false
  min-tps: 15.0
  max-ping: 5000

# ------------------------------------------------------------
# Лимиты территорий
# ------------------------------------------------------------
regions:
  # Максимум территорий на игрока (0 = без лимита).
  # К базе добавляется число из пакетов «+территория» магазина (shop.yml).
  max-regions: 0

# ------------------------------------------------------------
# Меню флагов и магазин флагов.
# ------------------------------------------------------------
flags-menu:
  # Флаги, доступные ВСЕМ бесплатно, без права. Пустой список = прежнее
  # поведение: флаг виден только при праве qqregions.flags.<флаг>.
  whitelist: []
  #   - "pvp"
  #   - "build"
  #   - "entry"
  # Флаги, которые НЕ продаются в магазине (и видны только по праву).
  # Полезно для служебных: territory-visible, territory-type.
  shop-ignore:
    - "territory-visible"
    - "territory-type"

# Пользовательские названия флагов: выводятся в меню флагов, магазине,
# «моих флагах» и учитываются при поиске. Ключ = id флага (нижний регистр).
flags-names:
  # pvp: "Сражения"
  # deny-message: "Сообщение при входе"
  # entry: "Вход в территория"

# Группы-шаблоны прав на флаги. Выдайте игроку право
#   qqregions.flags.group.<имя группы>
# — и он сразу получит ВСЕ флаги из списка этой группы: видеть их в меню
# флагов и в магазине флагов и покупать. «Пачкой», без выдачи права на
# каждый флаг по отдельности (точечные права qqregions.flags.use.<флаг>
# продолжают работать отдельно и суммируются). У игрока может быть
# несколько групп — флаги суммируются. В списке флагов "*" = все флаги
# (для не-админов). Админ/оп видят и покупают всё всегда.
# Пример: новичка положите в LuckPerms-группу с правом qqregions.flags.group.newbie,
# старожила — qqregions.flags.group.veteran, и группы сами раздадут флаги.
flag-groups:
  newbie:
    flags:
      - "pvp"
      - "chest-access"
      - "sleep"
      - "tnt"
      - "potion-splash"
      - "item-pickup"
      - "item-frame-rotation"
      - "item-drop"
      - "creeper-explosion"
      - "other-explosion"
      - "enderman-grief"
      - "snow-fall"
      - "snow-melt"
      - "mob-spawning"
      - "fire-spread"
      - "lava-flow"
      - "water-flow"
      - "enderpearl"
      - "chorus-fruit-teleport"
      - "interact"
      - "use"
      - "walljump"
      - "sleep"
      - "season-effects"
      - "sit"
      - "territory-visible"
  # veteran:
  #   flags:
  #     - "pvp"
  #     - "build"
  #     - "entry"
  #     - "chest-access"
  #     - "greeting"
  #   # flags:
  #   #   - "*"        # все флаги (или несколько групп по отдельности)

# ------------------------------------------------------------
# Автофлаги при создании территории (region-flags-on-create).
# После создания каждая строка становится флагом региона:
#   <флаг>:<значение>[:<группа>]
# Значение для флагов-состояний: allow / deny (или true / false для
# boolean-флагов). Группа (необязательна, по умолчанию all):
#   all        — все
#   members    — участники и владельцы
#   owners     — владельцы
#   nonmembers — все, кто не участник и не владелец
#   nonowners  — все, кто не владелец
# Флаги любых плагинов (WorldGuard, WGEFP и др.), зарегистрированные в
# реестре; неизвестные просто пропускаются.
# ------------------------------------------------------------
region-flags-on-create:
  enabled: false
  flags:
    # - "pvp:deny:all"
    # - "tnt:deny"
    # - "mob-spawning:allow"
    # - "territory-visible:allow:all"

# ------------------------------------------------------------
# Рынок: продажа и аренда территорий (/region sell|rent|buy|tenant|market).
# Требует Vault + плагин экономики (EssentialsX, CMI, ...) — мягкая
# зависимость: без Vault рынок выключен и команды отвечают об этом.
# ------------------------------------------------------------
market:
  enabled: true
  # Телепорт «посмотреть в живую» (ЛКМ по своему объявлению во вкладке
  # «Все объявления» и по продаже в «Моих объявлениях»). Если false —
  # бесплатный телепорт к территориям из объявлений отключён совсем, чтобы
  # объявления не работали как дополнительные точки /warp.
  teleport-enabled: true
  # Как распределять оплату при продаже/аренде, если у территории несколько
  # владельцев: single — вся сумма инициатору (кто выставил объявление);
  # split — разделить поровну между ВСЕМИ владельцами территории.
  multiowner: single
  # Комиссия сервера с продажи/аренды. rate — доля от суммы (1.0 = 100%,
  # 0.05 = 5%, 0.01 = 1%). Списывается с получателя: продавец/владелец
  # получает сумму х (1 - rate), остальное уходит серверу (никому).
  commission:
    enable: false
    rate: 0.01
  # Сколько МИНУТ живёт ПРИВАТНОЕ предложение (с ником) в ожидании, пока
  # контрагент примет или отклонит. По истечении срока объявление снимается
  # с рынка, владельцы территории не меняются. 0 = без ограничения.
  offer-timeout-minutes: 60
  # Что сделать с ПРИВАТНЫМ предложением по истечении offer-timeout-minutes:
  # RELIST — перевыставить территория ПУБЛИЧНО (цена и условия сохраняются);
  # CANCEL — снять объявление с рынка (владельцы территории не меняются).
  offer-timeout-action: RELIST
  economy:
    # Подключать ли Vault (false — экономии нет, команды откажут).
    enabled: true
    # Символ валюты и его позиция: 1000 ₽ (AFTER) | ₽ 1000 (BEFORE).
    symbol: "#FFFE72Ⓜ&r"
    symbol-position: AFTER
    # Сколько знаков после запятой (0-2).
    decimal-places: 0
    # Группировать разряды (1000 -> 1 000). Примеры форматов:
    #   1,000 (grouping: true, group-separator: ",")
    #   1.000 (grouping: true, group-separator: ".")
    #   1000   (grouping: false)
    #   1000.00 (grouping: false, decimal-places: 2)
    #   1.000,00 (grouping: true, group-separator: ".", decimal-separator: ",")
    grouping: true
    group-separator: ","
    decimal-separator: "."
  rent:
    # Кем становится арендатор: MEMBER | OWNER.
    grant: MEMBER
    # Как взимается плата: ONCE (один раз за весь срок) | PERIOD (списывать
    # каждый период — period-minutes — до конца срока).
    charge: PERIOD
    # Период списания/перепроверки аренды (минуты) при charge: PERIOD.
    period-minutes: 1440
    # Минимальная и максимальная длительность аренды, которую арендодатель
    # может выставить в меню рынка («Shift+ПКМ — срок аренды»).
    # min-duration-minutes: 60 (1 час), max-duration-days: 365 (1 год).
    min-duration-minutes: 60
    max-duration-days: 365
    # Сколько МИНУТ объявление об аренде живёт в маркете после выставления
    # или автовозврата (по умолчанию; владелец меняет кнопкой в своём листинге).
    list-duration-minutes: 10080
    # Автовозврат с автопродлением: после окончания аренды объявление
    # автоматически снова выставляет территория в маркете. false — аренда
    # завершается, объявление уходит с рынка.
    auto-rent: true
  # Голограмма-вывеска РЫНКА (market.market-holo): ОДНА плавающая голограмма у
  # периметра территории, которая «облетает» границы следом за игроком и всегда
  # смотрит на него (billboard). Видна любому игроку в радиусе view-distance,
  # чей Y находится ВНУТРИ высот территории. Текст и цвета — в lang.yml (market-holo).
  market-holo:
    enabled: true
    # На каком расстоянии (по X/Z) от территории голограмма начинает вести игрока.
    view-distance: 24
    # Насколько выше/ниже УРОВНЯ ИГРОКА висит голограмма (0 = ровно на Y игрока,
    # 1.5 ≈ уровень лица).
    y-offset: 1.5
    # Множитель размера текста голограммы.
    scale: 1.0
    # Макс. длина строки в блоках (ширина текста голограммы).
    line-width: 200
# ------------------------------------------------------------
# Рейд клана «Воришка» (JustTeams).
# Кнопка «Рейд» в меню info у шаблона other (посторонний). Нужен
# установленный JustTeams (банк клана) + (для source: PLAYER) Vault.
# Процесс: нападающие (члены ОДНОГО клана) приходят в территория, один
# жмёт кнопку, все должны ПРОДЕРЖАТЬСЯ в территории capture-time секунд
# (выход любого — рейд срывается), затем случайный «вор» получает
# доступ к территории на thief-time секунд, потом права снимаются и у
# территории начинается кулдаун cooldown-time секунд.
# placeholder-ы сообщений: {region} {world} {clan} {count} {total}
# {thief} {time} {percent} {player}
# ------------------------------------------------------------
raid:
  enabled: true
  # Мин. число нападающих (членов клана) в территории для старта рейда.
  min-attackers: 4
  # Мин. % ОНЛАЙН-членов клана, которые должны быть в территории в момент
  # старта. < 1 = доля (0.5 = 50%), >= 1 = проценты (50 = 50%).
  online-percent: 50
  # Секунды фазы захвата: все нападающие должны оставаться в территории.
  capture-time: 60
  # Секунды, которые «вор» держит доступ к территории (по умолчанию 5 минут).
  thief-time: 300
  # Секунды кулдауна территории после завершения рейда.
  cooldown-time: 300
  # Территории, которые нельзя рейдить (id, по нижнему регистру).
  blacklist:
    - ""
  # Требовать, чтобы владельцы/участники территории были офлайн для старта.
  owners-offline-required: true
  # Срывать рейд, если владелец/участник территории зашёл во время захвата.
  abort-on-owner-online: true
  # Списание монет за рейд: PLAYER — процент с баланса нападающего
  # (инициатора), CLAN — процент с банка клана JustTeams.
  economy:
    enabled: true
    source: CLAN
    # Процент: < 1 = доля (0.5 = 50%), >= 1 = проценты (10 = 10%).
    percent: 10
  # ВАЛЮТА БАНКА КЛАНА: показывается везде, где речь о кланах/рейдах, если
  # economy.source: CLAN. Это СВОЯ валюта кланов — НЕ путать с Vault-балансом
  # игроков (рынок, покупка/продажа/аренда территорий — по-прежнему Vault).
  clan-currency:
    symbol: "⚔"
    # Группировка разрядов (например "1 500", а не "1500").
    grouping: true
    group-separator: " "
    decimal-separator: "."
    decimal-places: 0
  # Отображение процесса: BOSSBAR | ACTIONBAR | NONE
  display:
    mode: ACTIONBAR
    update-ticks: 20
    color: RED
    style: SEGMENTED_10
    text: "&8Захват #59806f{region}&8: &f{time} • нападающих &f{count}&8/&f{total}"
    # Полоса фазы «вора» (после захвата). Плейсхолдеры: {thief} {time}.
    thief-text: "&7Вор &f{thief}&7: &f{time}"
    thief-color: GREEN
    # Персональный боссбар ТОЛЬКО для вора (таймер доступа): полоса убывает
    # от полной к пустой за thief-time. Отдельный от group-бара (display.*),
    # работает в любом mode. Плейсхолдеры: {thief} {time}.
    # {time} — в формате time-format.units (единицы из lang.yml menu.time-*).
    thief-bar:
      enabled: true
      color: RED
      style: SOLID
      text: "&8Время нахождения на территории: &f{time}"
  # Оповещения этапов. commands: asConsole!... / asPlayer!...
  notify:
    start:
      message: "&8[&7Клан&8] &f{clan} &7нападает на территорию #59806f{region}&7!"
      commands: []
    thief:
      message: "&7Вор &f{thief} &7получил доступ к территории #59806f{region}&7."
      commands: []
    # Приватное сообщение ТОЛЬКО вору об истечении таймера доступа
    # (права сняты). commands выполняются от имени вора.
    thief-end:
      message: "&8Время нахождения на территории истекло — доступ аннулирован."
      commands: []
    end:
      message: "&7Рейд на #59806f{region} &7завершён: &f{clan}&7 теперь участник территории."
      commands: []
    reset:
      message: "&8Рейд на #59806f{region} &8сорван!"
      commands: []

# ------------------------------------------------------------
# Формат таймеров (обратного отсчёта) для ВСЕХ механик плагина:
# боссбар рейда, плейсхолдеры {time} в боссбарах/уведомлениях.
# Единицы (« {n} сек», «{n} мин», «{n} ч», «{n} д»...) берутся из
# lang.yml (menu.time-*). Правило выбора единицы:
#   >= месяца(30д) — месяцы, >= дня — дни, >= часа — часы,
#   >= минуты — минуты, иначе секунды; 0 — пусто.
# ------------------------------------------------------------
time-format:
  # Показывать единицы: TWO — две старшие ненулевые (2д 5ч / 5ч 7м / 7м 45с),
  # ONE — только старшую (2д / 5ч / 7м / 45с).
  units: TWO
