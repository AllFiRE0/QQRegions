# ============================================================
#  QQRegions — меню справки (/region help, кнопки @menu:help)
#  Статичные кнопки с командами плагина. Полный список — в
#  lang.yml (help.commands), текстовый вывод /region help.
# ============================================================
config-version: 2
update_interval: 20   # перерисовка меню каждые N тиков; 0 = выключить автообновление

Menus:
  "default":
    priority: 5
    permission-group: ""
    placeholder-group: ""
    title: "&#000000Помощь по территориям"
    size: 6
    fill:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      tooltip: false
    buttons:
      "back":
        slot: 0
        material: ARROW
        name: "&eВернуться в {back-target}"
        lore:
          - "&7Вернуться в предыдущее меню"
        commands:
          - "@back"
#      "market":
#        slot: 53
#        material: GOLD_INGOT
#        name: "&eРынок"
#        lore:
#          - "&7Продажа, аренда, магазин флагов и расширений"
#        commands:
#          - "@menu:market"
      "select":
        slot: 10
        material: WOODEN_AXE
        name: "&fВыделение"
        lore:
          - "&7/region select — интерактивное выделение"
          - "&7/region select pos <1|2>"
          - "&7/region select chunk [N]"
          - "&7/region select expand [сторона] <N>"
          - "&7/region select view <ник> — выделение игрока"
      "create-delete":
        slot: 11
        material: GRASS_BLOCK
        name: "&fТерритории"
        lore:
          - "&7/region create <название>"
          - "&7/region delete [название]"
          - "&7/region info [название]"
      "flags":
        slot: 12
        material: REDSTONE_TORCH
        name: "&fФлаги"
        lore:
          - "&7/region flags [название] — меню флагов"
          - "&7/region market flags — магазин флагов"
          - "&7/region market — меню рынка"
      "visible":
        slot: 13
        material: GLOWSTONE_DUST
        name: "&fПодсветка"
        lore:
          - "&7/region visible [территория] [тип] — показать"
          - "&7/region visible off — скрыть все"
          - "&7/region visible type [тип] — тип по умолчанию"
          - "&7/region visible self on|off — подсветка «для себя» (по флагу)"
          - "&7/region visible true|allow|false|deny [тип] [территория] — флаг"
      "market-help":
        slot: 14
        material: GOLD_INGOT
        name: "&fРынок"
        lore:
          - "&7/region sell <ник> <сумма> [территория]"
          - "&7/region rent <ник> <сумма> <время> [территория]"
          - "&7/region buy [территория]"
          - "&7/region tenant [территория]"
          - "&7/region market flags|blocks — магазин"
      "raid":
        slot: 15
        material: NETHERITE_SWORD
        name: "&fРейд клана"
        lore:
          - "&7/region raid [территория] — рейд клана" #(JustTeams)
  "compact":
    priority: 1
    permission-group: ""
    placeholder-group: ""
    title: "&#000000Помощь"
    size: 6
    fill:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      tooltip: false
    buttons:
      "back":
        slot: 0
        material: ARROW
        name: "&eВернуться в {back-target}"
        commands:
          - "@back"
#      "market":
#        slot: 53
#        material: GOLD_INGOT
#        name: "&eРынок"
#        commands:
#          - "@menu:market"
