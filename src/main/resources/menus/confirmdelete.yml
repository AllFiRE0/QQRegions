# ============================================================
#  QQRegions — меню подтверждения удаления территории.
#  Открывается кнопкой «Удалить территорию» в info-меню.
#
#  Подтверждение: @region-delete (удаляет территория через WG API,
#  с проверкой роли владельца/админа и правом qqregions.delete).
#  Отмена: @back (возврат в инфо-меню).
#
#  Переменные: {region} {world} {player} {role}
# ============================================================
config-version: 1
update_interval: 20   # перерисовка меню каждые N тиков; 0 = выключить автообновление

Menus:
  "default":
    priority: 5
    permission-group: ""
    placeholder-group: ""
    title: "&#000000Удалить &f{region}&8?"
    size: 3
    fill:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      tooltip: false
    buttons:
      "confirm":
        slot: 11
        material: RED_TERRACOTTA
        name: "&c&lДа, удалить"
        lore:
          - "&7Территория &f{region} &7будет &cудалена &7навсегда"
          - "&cВосстановить её будет нельзя"
        permission: qqregions.delete
        role-required: owner
        commands:
          - "@region-delete"
      "back":
        slot: 15
        material: LIME_CONCRETE
        name: "&2Отмена"
        lore:
          - "&7Вернуться к информации о территории"
        commands:
          - "@back"
