    dynamic-flags:
      enabled: true
      slots:
        - 10
        - 11
        - 12
        - 13
        - 14
        - 15
        - 16
        - 19
        - 20
        - 21
        - 22
        - 23
        - 24
        - 25
        - 28
        - 29
        - 30
        - 31
        - 32
        - 33
        - 34
        - 37
        - 38
        - 39
        - 40
        - 41
        - 42
        - 43
      groups:
        - all
        - members
        - owners
        - nonmembers
        - nonowners
      # игрок видит флаг только при наличии права <префикс><флаг>
      flag-permission-prefix: "qqregions.flags."
      ignore-flags: []            # какие флаги не показывать (по имени)
      material: MAP
      name: "&f{flag} &8· {group-label}{group-current}"
      lore:
        - "&7Значение: &f{flag-value-label}"
        - "&9ЛКМ — включить/выключить для этой группы"
      states:
        - allow
        - deny
      commands:
        - "@flag:{flag}:{next-state}"
      materials:
