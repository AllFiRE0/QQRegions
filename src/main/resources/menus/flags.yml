# ============================================================
#  QQRegions — меню флагов территории
#  Динамические кнопки строятся из реестра флагов WorldGuard.
#
#  Навигация: кнопка "back" (первый слот, верх-слева) возвращает к
#  предыдущему меню, её название подставляется из {back-target}.
#  Кнопка "help" — верхний правый угол (слот 8). Кнопки страниц
#  (navigation.prev/next) — внизу.
#
#  Шаблоны выбираются по роли игрока в территории (role-required):
#    owner  — владелец: флаги по правам qqregions.flags.use.<флаг>
#    member — участник: флаги по правам qqregions.flags.use.<флаг>
#    other  — посторонний: обычно без прав на флаги
#  Любой шаблон с пустым role-required подходит любой роли.
#
#  Флаг показывается игроку только если он имеет право
#    <flag-permission-prefix><флаг>  (например qqregions.flags.use.pvp).
#  Принимаются также legacy-права qqregions.flags.<флаг>. Показ и клик по
#  флагу требуют этого права; админ (qqregions.admin) видит и может менять
#  все флаги. Привилегии вида qqregions.flags.use.* выдавайте игрокам —
#  флагов без права никто не увидит, whitelist видимость НЕ даёт.
#  Группы-шаблоны: право qqregions.flags.group.<имя> (config.yml flag-groups)
#  открывает сразу весь список флагов группы (действует совместно с точечными
#  правами qqregions.flags.use.<флаг>).
#
#  Переменные: {region} {world} {player} {role} {flag} {flag-name} {group}
#              {group-label} {groups-list} {flag-group} {flag-group-label}
#              {flag-with-group} {flag-value} {flag-value-label} {next-state}
#  Пагинация: слоты из dynamic-flags.slots; навигация блок navigation.
#  Псевдокоманды: @page:prev/@page:next, @menu:<имя>, @teleport,
#                 @flag:<имя>:allow|deny|default, asConsole!..., close
#
#  Группы флагов (WorldGuard region groups): у флага может быть ТОЛЬКО
#  одна группа (как в /rg flag -g <группа> <флаг> <значение>): all,
#  members, owners, nonmembers, nonowners.
#  Menu содержит ОДНУ кнопку на каждый флаг (без дублей): она показывает
#  текущую группу флага и её значение. &6ЛКМ — цикл значений для текущей
#  группы: вкл → выкл → по умолчанию (снять, /rg flag -r, работает дефолт
#  WorldGuard); &6ПКМ — сменить группу (цикл по dynamic-flags.groups).
#  {groups-list} — подсказка со списком групп, текущая выделена.
#  Переводы групп и значений — в replace.yml (блоки flag-groups/flag-values).
# ============================================================
config-version: 3
update_interval: 20   # перерисовка меню каждые N тиков; 0 = выключить автообновление

Menus:
  "owner":
    role-required: owner
    priority: 30
    permission-group: ""
    placeholder-group: ""
    title: "&#000000Флаги ({region}) ({page}/{pages})"
    size: 6
    fill:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      tooltip: false
    buttons:
      "help":
        slot: 8
        material: BOOK
        name: "&eПомощь"
        lore:
          - "&7Команды и справка плагина"
        commands:
          - "@menu:help"
      "back":
        slot: 0
        material: ARROW
        name: "&eВернуться в {back-target}"
        lore:
          - "&7Вернуться в предыдущее меню"
        commands:
          - "@back"
    dynamic-flags:
      enabled: true
      slots:
        - 10
        - 11
        - 12
        - 13
        - 14
        - 15
        - 16
        - 19
        - 20
        - 21
        - 22
        - 23
        - 24
        - 25
        - 28
        - 29
        - 30
        - 31
        - 32
        - 33
        - 34
        - 37
        - 38
        - 39
        - 40
        - 41
        - 42
        - 43
      groups:
        - all
        - members
        - owners
        - nonmembers
        - nonowners
      # игрок видит флаг только при наличии права <префикс><флаг>
      flag-permission-prefix: "qqregions.flags.use."
      ignore-flags:
        - territory-type            # какие флаги не показывать (по имени)
      material: MAP
      name: "&f{flag-name} &8· {group-label}"
      lore:
        - "&7Значение: &f{flag-value-label}"
        - "&7Группа: {groups-list}"
        - "&6ЛКМ — вкл/выкл/по умолчанию"
        - "&6ПКМ — сменить группу"
      states:
        - allow
        - deny
        - default
      commands:
        - "@flag:{flag}:{next-state}"
      materials:
        pvp: DIAMOND_SWORD
        build: OAK_PLANK
        creeper-explosion: TNT
        tnt-explosion: TNT
        fall-damage: IRON_BOOTS
        lightning: LIGHTNING_ROD
        fire-spread: FLINT_AND_STEEL
        lava-fire: MAGMA_BLOCK
        water-flow: WATER_BUCKET
        ice-melt: ICE
        snow-fall: SNOWBALL
        snow-melt: SNOW_BLOCK
        block-break: WOODEN_PICKAXE
        block-place: GRASS_BLOCK
        chest-access: CHEST
        use: LEVER
        interact: STICK
        vehicle-place: OAK_BOAT
        vehicle-destroy: DIAMOND_PICKAXE
        vehicle-use: MINECART
        enderman-grief: ENDERMAN_SPAWN_EGG
        ghast-fireball: FIRE_CHARGE
        mob-spawning: BLAZE_SPAWN_EGG
        animal-spawn: CHICKEN_SPAWN_EGG
        monster-spawn: ZOMBIE_SPAWN_EGG
        passthrough: FEATHER
        invincible: SHIELD
        greeting: WRITABLE_BOOK
        farewell: WARPED_FUNGUS
        deny-message: REDSTONE
        send-chat: OAK_SIGN
        receive-chat: OAK_HANGING_SIGN
        sleep: RED_BED
        respawn: ENDER_CHEST
        send-title: PAINTING
        piston: PISTON
        allowed-cmds: COMMAND_BLOCK
        blocked-cmds: COMMAND_BLOCK
        exit-override: END_PORTAL_FRAME
        entry: OAK_DOOR
        exit: DARK_OAK_DOOR
        territory-visible: LIGHT
    navigation:
      prev:
        material: ARROW
        name: "&eНазад"
        lore:
          - "&7Предыдущая страница"
        slot: 45
      next:
        material: ARROW
        name: "&eВперёд"
        lore:
          - "&7Следующая страница"
        slot: 53
      search:
        material: WRITABLE_BOOK
        name: "&eПоиск флагов"
        lore:
          - "&7Поиск по имени или переводу"
          - "&7Нажмите и введите запрос в чат"
        slot: 4
        commands:
          - "@flag-search"
