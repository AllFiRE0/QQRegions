# ============================================================
#  QQRegions — меню флагов региона
#  Динамические кнопки строятся из реестра флагов WorldGuard.
#
#  Шаблоны выбираются по роли игрока в регионе (role-required):
#    owner  — владелец: флаги по правам qqregions.flags.<флаг>
#    member — участник: флаги по правам qqregions.flags.<флаг>
#    other  — посторонний: обычно без прав на флаги
#  Любой шаблон с пустым role-required подходит любой роли.
#
#  Флаг показывается игроку только если он имеет право
#    <flag-permission-prefix><флаг>  (например qqregions.flags.pvp).
#  Показ и клик по флагу требуют этого права; админ (qqregions.admin)
#  видит и может менять все флаги.
#
#  Переменные: {region} {world} {player} {role} {flag} {group}
#              {group-label} {group-current} {flag-group} {flag-group-label}
#              {flag-with-group} {flag-value} {flag-value-label} {next-state}
#  Пагинация: слоты из dynamic-flags.slots; навигация блок navigation.
#  Псевдокоманды: @page:prev/@page:next, @menu:<имя>, @teleport,
#                 @flag:<имя>:allow|deny, asConsole!..., close
#
#  Группы флагов (WorldGuard region groups): у флага может быть ТОЛЬКО
#  одна группа (как в /rg flag -g <группа> <флаг> <значение>): all,
#  members, owners, nonmembers, nonowners. dynamic-flags.groups — какие
#  кнопки-группы показывать для каждого флага; клик по кнопке ставит
#  значение ДЛЯ этой группы и переключает её. Текущая группа помечается
#  {group-current} (✓), значение видно только на кнопке текущей группы
#  ({flag-value-label}; для остальных — «не задано»).
#  Переводы групп и значений — в replace.yml (блоки flag-groups/flag-values).
# ============================================================
update_interval: 20

Menus:
  "owner":
    role-required: owner
    priority: 30
    permission-group: ""
    placeholder-group: ""
    title: "&#000000Флаги ({region}) ({page}/{pages})"
    size: 6
    fill:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
    buttons:
      "close":
        slot: 49
        material: BARRIER
        name: "&cЗакрыть"
        lore:
