# ============================================================
#  QQRegions — меню выбора территории (кнопка «Моя территория»
#  в главном меню, если игрок не стоит внутри региона).
#  Все регионы всех миров, клик по кнопке — информация о регионе.
#
#  Сортировка кнопкой «Сортировка» (@rpsort, {rp-sort-list}):
#    near         — ближайшие к игроку
#    far          — дальние от игрока
#    az           — по имени A-Z
#    za           — по имени Z-A
#    members-asc  — по людям (владельцы+участники) по возрастанию
#    members-desc — по людям по убыванию
#    area-asc     — по площади по возрастанию
#    area-desc    — по площади по убыванию
#  Инфо в лоре кнопки региона: {rp-world} {rp-type} {rp-people}
#  {rp-area} {rp-dist}.
#
#  Переменные: {region} {world} {player} {role} {rp-sort-list}
#  Псевдокоманды: @page:prev/@page:next, @menu:<имя>, @rpsort,
#  @rinfo:мир:регион, @back
# ============================================================
config-version: 2
update_interval: 20   # перерисовка меню каждые N тиков; 0 = выключить автообновление

Menus:
  "default":
    priority: 5
    permission-group: ""
    placeholder-group: ""
    title: "&#000000Выбор территории ({page}/{pages})"
    size: 6
    fill:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      tooltip: false
    buttons:
      "back":
        slot: 0
        material: ARROW
        name: "&eВернуться в {back-target}"
        lore:
          - "&7Вернуться в предыдущее меню"
        commands:
          - "@back"
      "sort":
        slot: 4
        material: HOPPER
        name: "&eСортировка"
        lore:
          - "{rp-sort-list}"
          - "&7ЛКМ — переключить сортировку"
        commands:
          - "@rpsort"
      "help":
        slot: 8
        material: BOOK
        name: "&eПомощь"
        lore:
          - "&7Команды и справка плагина"
        commands:
          - "@menu:help"
    menu-slots:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 34
    navigation:
      prev:
        material: ARROW
        name: "&eНазад"
        lore:
          - "&7Предыдущая страница"
        slot: 44
      next:
        material: ARROW
        name: "&eВперёд"
        lore:
          - "&7Следующая страница"
        slot: 53