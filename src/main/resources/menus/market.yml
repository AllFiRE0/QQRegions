# ============================================================
#  QQRegions — меню рынка (/region market)
#  Две вкладки в одном меню (кнопка «Мои объявления / Все объявления»):
#    • «Все объявления» — живые предложения: продажа/аренда региона.
#      ЛКМ на чужое — купить/арендовать; ЛКМ на своё — телепорт к региону
#      (отключается market.teleport-enabled: false в config.yml,
#      чтобы объявления не были бесплатными точками /warp).
#    • «Мои объявления» — только ваши листинги с управлением:
#      ЛКМ — автовозврат, ПКМ — отмена (с подтверждением),
#      Шифт+ЛКМ — срок объявления, Шифт+ПКМ — срок аренды.
#
#  Динамические кнопки строятся из предложений рынка (market.yml):
#    {market-type} {market-region} {market-world} {market-price}
#    {market-lister} {market-volume} {market-loc} {market-age} {market-period}
# ============================================================
config-version: 1
update_interval: 20

Menus:
  "default":
    priority: 5
    permission-group: ""
    placeholder-group: ""
    title: "&#000000{market-title}"
    size: 6
    fill:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
    buttons:
      "back":
        slot: 0
        material: ARROW
        name: "&eВернуться в {back-target}"
        lore:
          - "&7Вернуться в предыдущее меню"
        commands:
          - "@back"
      "search":
        slot: 4
        material: PAPER
        name: "&eПоиск по названию"
        lore:
          - "&7Фильтр списка предложений"
          - "&7Нажмите и введите запрос в чат"
        commands:
          - "@market-search"
      "tab":
        slot: 5
        material: BOOK
        name: "{market-tab-name}"
        lore:
          - "&7Клик — переключить вкладку:"
          - "&8Все объявления / Мои объявления"
        commands:
          - "@market-tab"
      "sort":
        slot: 6
        material: HOPPER
        name: "&eСортировка: &fНазвание"
        lore:
          - "&7Цикл: Название → Цена → По умолчанию"
        commands:
          - "@sort"
      "blocks":
        slot: 45
        material: GOLD_BLOCK
        name: "&6Расширение"
        lore:
          - "&7Пакеты площади и «+регион»"
        commands:
          - "@menu:blocks"
      "flagshop":
        slot: 46
        material: REDSTONE_TORCH
        name: "&eМагазин флагов"
        lore:
          - "&7Купить флаг, доступный по праву"
        commands:
          - "@menu:flagshop"
      "myflags":
        slot: 53
        material: WRITABLE_BOOK
        name: "&bМои флаги"
        lore:
          - "&7Купленные в магазине флаги"
        commands:
          - "@menu:myflags"
      "help":
        slot: 8
        material: BOOK
        name: "&eПомощь"
        lore:
          - "&7Команды плагина"
        commands:
          - "@menu:help"
    menu-slots:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 34
    navigation:
      prev:
        material: ARROW
        name: "&eНазад"
        slot: 47
      next:
        material: ARROW
        name: "&eВперёд"
        slot: 51