# ============================================================
#  QQRegions — меню рынка (/region market)
#  Список живых предложений: продажа/аренда регионов.
#  Открывается командой /region market и кнопками меню владельца.
#
#  Динамические кнопки строятся из market.yml (предложения):
#    {market-type} {market-region} {market-world} {market-price}
#    {market-who} {market-owner} {market-status}
#  ЛКМ — принять предложение, ПКМ — отменить своё.
#
#  Рынок требует Vault (softdepend) и market.enabled: true в config.yml.
# ============================================================
update_interval: 20

Menus:
  "default":
    priority: 5
    permission-group: ""
    placeholder-group: ""
    title: "&#000000Рынок регионов"
    size: 6
    fill:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
    buttons:
      "close":
        slot: 49
        material: BARRIER
        name: "&cЗакрыть"
        lore:
          - "&7Закрыть меню"
        commands:
          - "close"
      "back":
        slot: 48
        material: ARROW
        name: "&eНазад"
        lore:
          - "&7Вернуться в предыдущее меню"
        commands:
          - "@back"
      "search":
        slot: 4
        material: PAPER
        name: "&eПоиск по названию"
        lore:
          - "&7Фильтр списка предложений"
          - "&7Нажмите и введите запрос в чат"
        commands:
          - "@market-search"
      "sort":
        slot: 5
        material: HOPPER
        name: "&eСортировка: &fНазвание"
        lore:
          - "&7Цикл: Название → Цена → По умолчанию"
        commands:
          - "@sort"
      "blocks":
        slot: 44
        material: GOLD_BLOCK
        name: "&6Расширение"
        lore:
          - "&7Пакеты площади и «+регион»"
        commands:
          - "@menu:blocks"
      "flagshop":
        slot: 46
        material: REDSTONE_TORCH
        name: "&eМагазин флагов"
        lore:
          - "&7Купить флаг, доступный по праву"
        commands:
          - "@menu:flagshop"
      "myflags":
        slot: 53
        material: WRITABLE_BOOK
        name: "&bМои флаги"
        lore:
          - "&7Купленные в магазине флаги"
        commands:
          - "@menu:myflags"
      "help":
        slot: 45
        material: BOOK
        name: "&eПомощь"
        lore:
          - "&7Команды плагина"
        commands:
          - "@menu:help"
    menu-slots:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 34
    navigation:
      prev:
        material: ARROW
        name: "&eНазад"
        slot: 47
      next:
        material: ARROW
        name: "&eВперёд"
        slot: 51