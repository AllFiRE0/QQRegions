# ============================================================
#  QQRegions — главное меню территорий (/region, /tr, /territory
#  без аргументов).
#
#  Кнопки выстроены в один ряд:
#    0  — «Назад» (по умолчанию ВЫКЛЮЧЕНА, включается в config.yml:
#         interactive.main-menu.back-enabled: true; команда —
#         interactive.main-menu.back-command)
#    1  — Магазин территорий (рынок)
#    2  — Моя территория: управление регионом, если игрок внутри,
#         иначе — меню выбора территории ({my-region-lore})
#    3  — Поиск региона по названию (ввод в чат → меню результатов)
#    4  — Мои объявления (рынок сразу во вкладке своих объявлений)
#    5  — Расширения (+регионы / +блоки)
#    6  — Мои флаги
#    7  — Магазин флагов
#    8  — Справка
#    9  — Создать территорию (слот 31, под рядом кнопок): включает
#         интерактивный выбор, как /region select
#
#  Псевдокоманды: @menu:<имя>, @region-info-or-pick, @region-search, @select
# ============================================================
config-version: 3
update_interval: 20   # перерисовка меню каждые N тиков; 0 = выключить автообновление

Menus:
  "default":
    priority: 5
    permission-group: ""
    placeholder-group: ""
    title: "&eГлавное меню территорий"
    size: 6
    fill:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      tooltip: false
    buttons:
      "market":
        slot: 10
        material: CHEST
        name: "&6Магазин территорий"
        lore:
          - "&7Аренда/Покупка территорий"
          - "&7Выставить свой на продажу/в аренду"
        commands:
          - "@menu:market"
      "myregion":
        slot: 11
        material: MAP
        name: "&bТерритория"
        lore:
          - "{my-region-lore}"
        commands:
          - "@region-info-or-pick"
      "regionsearch":
        slot: 12
        material: COMPASS
        name: "&eПоиск территории"
        lore:
          - "&7Введите название в чат"
          - "&7чтобы быстро найти нужные"
        commands:
          - "@region-search"
      "myoffers":
        slot: 13
        material: GOLD_NUGGET
        name: "&6Мои объявления"
        lore:
          - "&7Управление вашими объявлениями:"
          - "&7сроки, отмена, автовозврат"
        commands:
          - "@market-mine"
      "blocks":
        slot: 14
        material: GOLD_BLOCK
        name: "&6Расширение территорий"
        lore:
          - "&7Пакеты площади и «+N регионов»"
        commands:
          - "@menu:blocks"
      "myflags":
        slot: 15
        material: WRITABLE_BOOK
        name: "&bМои флаги"
        lore:
          - "&7Купленные в магазине флаги"
        commands:
          - "@menu:myflags"
      "flagshop":
        slot: 16
        material: REDSTONE_TORCH
        name: "&eМагазин флагов"
        lore:
          - "&7Покупка доступных флагов"
        commands:
          - "@menu:flagshop"
      "help":
        slot: 8
        material: BOOK
        name: "&eСправка"
        lore:
          - "&7Выделение, территория, флаги,"
          - "&7подсветка, рынок, аренда, рейды"
        commands:
          - "@menu:help"
      "create":
        slot: 31
        material: GREEN_WOOL
        name: "&aСоздать территорию"
        lore:
          - "&7Нажмите чтобы создать территорию"
          - ""
          - "&7Проверьте справку в углу меню"
          - "&7чтобы изучить команды территорий."
        commands:
          - "@select"