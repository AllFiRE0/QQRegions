# ============================================================
#  QQRegions — главное меню территорий (/region, /tr, /territory
#  без аргументов).
#
#  Динамические слоты (menu-slots) заполняются ПРЕДЛОЖЕНИЯМИ рынка
#  (продажа/аренда): ЛКМ на чужое — купить/арендовать, на своё —
#  телепорт к региону («посмотреть в живую»).
#
#  Слоты (можно менять сколько угодно):
#    0  — «Назад» (по умолчанию ВЫКЛЮЧЕНА, включается в config.yml:
#         interactive.main-menu.back-enabled: true; команда —
#         interactive.main-menu.back-command)
#    4  — Магазин территорий (рынок)
#    8  — Справка
#    10 — Мой регион: владельцы/участники сейчас на месте (клик —
#         полное info-меню с шаблонами под роль)
#    11 — Поиск региона по названию (ввод в чат → меню результатов)
#    47 — Мои объявления (рынок сразу во вкладке своих объявлений)
#    48 — Расширения (+регионы / +блоки)
#    49 — Мои флаги
#    50 — Магазин флагов
#    45/53 — предыдущая/следующая страница (автоматически)
#    12-15,19-24,28-33,37-42 — предложения рынка
# ============================================================
config-version: 2
update_interval: 20

Menus:
  "default":
    priority: 5
    permission-group: ""
    placeholder-group: ""
    title: "&eГлавное меню территорий"
    size: 6
    fill:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
    buttons:
      "market":
        slot: 4
        material: CHEST
        name: "&6Магазин территорий"
        lore:
          - "&7Купить или арендовать регион"
          - "&7Выставить свой на продажу/в аренду"
        commands:
          - "@menu:market"
      "help":
        slot: 8
        material: BOOK
        name: "&eСправка"
        lore:
          - "&7Выделение, территория, флаги,"
          - "&7подсветка, рынок, аренда, рейды"
        commands:
          - "@menu:help"
      "myregion":
        slot: 10
        material: MAP
        name: "&bМой регион: &f{region-name}"
        lore:
          - "&8Владельцы:"
          - "{owners}"
          - "&8Участники:"
          - "{members}"
          - ""
          - "&7Клик — информация о регионе"
          - "&7и управление по вашей роли"
        commands:
          - "@region-info"
      "regionsearch":
        slot: 11
        material: COMPASS
        name: "&eПоиск региона"
        lore:
          - "&7Введите название в чат"
          - "&7Откроется список совпадений"
        commands:
          - "@region-search"
      "blocks":
        slot: 48
        material: GOLD_BLOCK
        name: "&6Расширение территорий"
        lore:
          - "&7Пакеты площади и «+N регионов»"
        commands:
          - "@menu:blocks"
      "myoffers":
        slot: 47
        material: GOLD_NUGGET
        name: "&6Мои объявления"
        lore:
          - "&7Управление вашими объявлениями:"
          - "&7сроки, отмена, автовозврат"
        commands:
          - "@market-mine"
      "myflags":
        slot: 49
        material: WRITABLE_BOOK
        name: "&bМои флаги"
        lore:
          - "&7Купленные в магазине флаги"
        commands:
          - "@menu:myflags"
      "flagshop":
        slot: 50
        material: REDSTONE_TORCH
        name: "&eМагазин флагов"
        lore:
          - "&7Купить флаг, доступный по праву"
        commands:
          - "@menu:flagshop"
    navigation:
      prev:
        material: ARROW
        name: "&eНазад"
      next:
        material: ARROW
        name: "&eВперёд"
    # Слоты предложений рынка (слоты 10-11 заняты кнопками «Мой регион»
    # и «Поиск региона», поэтому пул начинается с 12).
    menu-slots:
      - 12
      - 13
      - 14
      - 15
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 37
      - 38
      - 39
      - 40
      - 41
      - 42