# ============================================================
#  QQRegions — меню результатов поиска территории (/region → Поиск территории).
#  Открывается автоматически после ввода названия в чат, когда совпадений
#  больше одного. Каждая кнопка = найденный территория (клик — info по роли).
#
#  Слоты: 0 — назад, 4 — новый поиск, 8 — справка,
#  45/53 — страницы, фон залит fill, остальное — найденные территории.
# ============================================================
config-version: 2
update_interval: 20   # перерисовка меню каждые N тиков; 0 = выключить автообновление

Menus:
  "default":
    priority: 5
    permission-group: ""
    placeholder-group: ""
    title: "&#000000Поиск территорий: &f{query}"
    size: 6
    fill:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      tooltip: false
    buttons:
      "back":
        slot: 0
        material: ARROW
        name: "&eВернуться в {back-target}"
        lore:
          - "&7Вернуться в предыдущее меню"
        commands:
          - "@back"
      "newsearch":
        slot: 4
        material: COMPASS
        name: "&eНовый поиск"
        lore:
          - "&7Введите другое название в чат"
        commands:
          - "@region-search"
      "help":
        slot: 8
        material: BOOK
        name: "&eСправка"
        lore:
          - "&7Выделение, территория, флаги,"
          - "&7подсветка, рынок, аренда, рейды"
        commands:
          - "@menu:help"
    navigation:
      prev:
        material: ARROW
        name: "&eНазад"
      next:
        material: ARROW
        name: "&eВперёд"
    menu-slots:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 37
      - 38
      - 39
      - 40
      - 41
      - 42
