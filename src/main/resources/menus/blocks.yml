# ============================================================
#  QQRegions — расширения (/region market blocks)
#  Пакеты площади (area-packs, max-blocks выделения) и пакеты
#  «+регион» (region-packs, лимит regions.max-regions).
#  Цены и состав — shop.yml. Покупки на игрока навсегда.
#
#  Динамические кнопки: {pack-name} {pack-amount} {price}
# ============================================================
update_interval: 20

Menus:
  "default":
    priority: 5
    permission-group: ""
    placeholder-group: ""
    title: "&#000000Расширения ({page}/{pages})"
    size: 6
    fill:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
    buttons:
      "back":
        slot: 49
        material: ARROW
        name: "&eНазад"
        lore:
          - "&7Вернуться на рынок"
        commands:
          - "@back"
      "flagshop":
        slot: 46
        material: REDSTONE_TORCH
        name: "&eМагазин флагов"
        lore:
          - "&7Флаги без права"
        commands:
          - "@menu:flagshop"
      "myflags":
        slot: 53
        material: WRITABLE_BOOK
        name: "&bМои флаги"
        lore:
          - "&7Купленные флаги"
        commands:
          - "@menu:myflags"
      "help":
        slot: 44
        material: BOOK
        name: "&eПомощь"
        lore:
          - "&7Команды плагина"
        commands:
          - "@menu:help"
    menu-slots:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 34
      - 37
      - 38
      - 39
      - 40
      - 41
      - 42
      - 43
    navigation:
      prev:
        material: ARROW
        name: "&eНазад"
        slot: 47
      next:
        material: ARROW
        name: "&eВперёд"
        slot: 51