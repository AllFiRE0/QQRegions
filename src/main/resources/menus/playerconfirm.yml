# ============================================================
#  QQRegions — меню управления игроком в территории.
#  Открывается из меню «Игроки» (@player-del, @add:) и меню
#  «Поиск игроков» (клик по кнопке игрока) ВМЕСТО мгновенного
#  действия. Само меню и есть подтверждение: выбором действия.
#
#  Кнопки:
#    @pc-add    — «Добавить игрока»: ЛКМ — участник, ПКМ — владелец,
#                 Shift+ЛКМ — убрать участника, Shift+ПКМ — убрать владельца
#                 (подтверждение — сам выбор действия в этом меню).
#    Отмена: @back.
#
#  Переменные контекста:
#    {pc-player}       — ник игрока
#    {pc-role}         — текущая роль в территории (Владелец/Участник/Не входит)
#    {pc-balance}      — баланс игрока (Vault, только число) или «—»
#    {pc-balance-symbol} — символ валюты (market.economy.symbol) или пусто
#    {pc-clan}         — клан игрока (JustTeams) или «—»
#    {pc-regions}      — всего территорий (владелец + участник)
#    {pc-reg-owner}    — из них владелец
#    {pc-reg-member}   — из них участник
#    {pc-max}          — максимум территорий игрока (∞ — без лимита)
#  Материал "PLAYER_HEAD:{pc-uuid}" — кнопка с головой игрока.
# ============================================================
config-version: 4
update_interval: 0   # перерисовка меню каждые N тиков; 0 = выключить автообновление

Menus:
  "default":
    role-required: owner
    priority: 5
    permission-group: ""
    placeholder-group: ""
    title: "&#000000Управление: &f{pc-player}"
    size: 3
    fill:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      tooltip: false
    buttons:
      "add":
        slot: 10
        material: LIME_CONCRETE
        name: "&aДобавить игрока"
        lore:
          - "&e&lЛКМ &7- Добавить участника"
          - "&e&lПКМ &7- Добавить владельца"
          - "&c&lShift &8+ &e&lЛКМ &7- Убрать участника"
          - "&c&lShift &8+ &e&lПКМ &7- Убрать владельца"
        commands:
          - "@pc-add"
      "info":
        slot: 13
        material: "PLAYER_HEAD:{pc-uuid}"
        name: "&f{pc-player}"
        lore:
          - "&7Группа: {pc-role}"
          - "&7Клан: &f{pc-clan}"
          - "&7Баланс: &f{pc-balance} {pc-balance-symbol}"
          - "&7Территории: &f{pc-regions} &7(макс. &f{pc-max}&7)"
          - "- &e{pc-reg-owner} &7владелец"
          - "- &a{pc-reg-member} &7участник"
          - ""
          - "&7Нажмите чтобы управлять"
        commands: []
      "cancel":
        slot: 16
        material: RED_TERRACOTTA
        name: "&cОтмена"
        lore:
          - "&7Вернуться к списку"
          - "&7или в поиск"
        commands:
          - "@back"