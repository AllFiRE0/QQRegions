# ============================================================
#  QQRegions — меню игроков региона (управление участниками)
#
#  Список владельцев/участников заполняется кодом плагина в
#  секцию dynamic-players (аналогично dynamic-flags):
#  - material / owner-material / member-material — предметы кнопок
#    (владельцы — например DIAMOND, участники — GOLD_INGOT);
#  - name — имя кнопки ({player} = ник игрока);
#  - lore — описание: поддерживаются {player} {role} {role-ru}
#    и %заполнители% PlaceholderAPI, которые резолвятся на КОНКРЕТНОГО
#    игрока, например %vault_eco_balance% вернёт баланс каждого
#    игрока из списка (работает так же для любого PAPI-заполнителя);
#  - commands — команда клика: у владельца шаблон содержит
#    @player-del:{player-id}:{role} (удаление по клику);
#    у остальных ролей commands пустой — только просмотр.
#
#  Кнопки владельца:
#    @add:owner / @add:member  — добавить (ввод ника в чат)
#    @pf:members / @pf:owners  — фильтр списка (только участники/владельцы)
#    @pf:all                   — показать всех
#  Управление доступно владельцам и админам (qqregions.admin).
#
#  Переменные: {region} {world} {player} {role} {role-ru} {player-id}
#  Псевдокоманды: @page:prev/@page:next, @menu:<имя>, @add:owner|member,
#                 @player-del:<uuid|ник>:owner|member, @pf:all|owners|members, close
# ============================================================
update_interval: 20

Menus:
  "owner":
    role-required: owner
    priority: 30
    permission-group: ""
    placeholder-group: ""
    title: "&#000000Игроки ({region}) ({page}/{pages})"
    size: 6
    fill:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
    buttons:
      "close":
        slot: 49
        material: BARRIER
        name: "&cЗакрыть"
        lore:
          - "&7Закрыть меню"
        commands:
          - "close"
      "info":
        slot: 45
        material: PAPER
        name: "&eИнформация"
        lore:
          - "&7Назад к информации о регионе"
        commands:
          - "@menu:info"
      "flags":
        slot: 46
        material: REDSTONE_TORCH
        name: "&eФлаги"
        lore:
          - "&7Открыть редактор флагов"
        commands:
          - "@menu:flags"
      "add-owner":
        slot: 47
        material: EMERALD
        name: "&b+ Владелец"
        lore:
          - "&7Нажмите, затем введите ник в чат"
        commands:
          - "@add:owner"
      "add-member":
        slot: 48
        material: PLAYER_HEAD
        name: "&e+ Участник"
        lore:
          - "&7Нажмите, затем введите ник в чат"
        commands:
          - "@add:member"
      "del-members":
        slot: 50
        material: GOLD_INGOT
        name: "&cУдалить участников"
        lore:
          - "&7Показать только участников"
          - "&7клик по игроку — удалить"
        commands:
          - "@pf:members"
      "del-owners":
        slot: 51
        material: DIAMOND
        name: "&cУдалить владельцев"
        lore:
          - "&7Показать только владельцев"
          - "&7клик по игроку — удалить"
        commands:
          - "@pf:owners"
      "all":
        slot: 52
        material: CRAFTING_TABLE
        name: "&7Все"
        lore:
          - "&7Показать всех владельцев и участников"
        commands:
          - "@pf:all"
    dynamic-players:
      enabled: true
      slots:
        - 10
        - 11
        - 12
        - 13
        - 14
        - 15
        - 16
        - 19
        - 20
        - 21
        - 22
        - 23
        - 24
        - 25
        - 28
        - 29
        - 30
        - 31
        - 32
        - 33
        - 34
      material: GOLD_INGOT
      owner-material: DIAMOND
      member-material: GOLD_INGOT
      name: "{player}"
      lore:
        - "%vault_eco_balance%$"
        - "&7Роль: &b{role-ru}"
        - "&cЛКМ — удалить из региона"
      commands:
        - "@player-del:{player-id}:{role}"
    navigation:
      prev:
        material: ARROW
        name: "&eНазад"
        lore:
          - "&7Предыдущая страница"
        slot: 44
      next:
        material: ARROW
        name: "&eВперёд"
        lore:
          - "&7Следующая страница"
        slot: 53
  "default":
    priority: 5
    permission-group: ""
    placeholder-group: ""
    title: "&#000000Игроки ({region}) ({page}/{pages})"
    size: 6
    fill:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
    buttons:
      "close":
        slot: 49
        material: BARRIER
        name: "&cЗакрыть"
        lore:
          - "&7Закрыть меню"
        commands:
          - "close"
      "info":
        slot: 45
        material: PAPER
        name: "&eИнформация"
        lore:
          - "&7Назад к информации о регионе"
        commands:
          - "@menu:info"
    dynamic-players:
      enabled: true
      slots:
        - 10
        - 11
        - 12
        - 13
        - 14
        - 15
        - 16
        - 19
        - 20
        - 21
        - 22
        - 23
        - 24
        - 25
        - 28
        - 29
        - 30
        - 31
        - 32
        - 33
        - 34
      material: GOLD_INGOT
      owner-material: DIAMOND
      member-material: GOLD_INGOT
      name: "{player}"
      lore:
        - "%vault_eco_balance%$"
        - "&7Роль: &b{role-ru}"
    navigation:
      prev:
        material: ARROW
        name: "&eНазад"
        lore:
          - "&7Предыдущая страница"
        slot: 44
      next:
        material: ARROW
        name: "&eВперёд"
        lore:
          - "&7Следующая страница"
        slot: 53