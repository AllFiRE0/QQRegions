# ============================================================
#  QQRegions — меню игроков территории (управление участниками)
#
#  Список владельцев/участников заполняется кодом плагина в
#  секцию dynamic-players: головы скинов по UUID игроков
#  (материал — config.yml player-search: head-material/head-texture).
#  Описание кнопок единое с меню «поиск игроков» и строится из
#  lang.yml (menu.ps-line-*): имя — цвет ника по роли (владелец
#  &#ccbf8f / участник &#7db389), лор — группа, клан (если JustTeams
#  включён), баланс, территории и подсказка удаления (только для
#  владельца территории). Команду @player-del:{player-id}:{role}
#  задаёт шаблон владельца; у остальных ролей commands пустой —
#  только просмотр.
#
#  Кнопки владельца:
#    «Добавить участников»       — меню поиска игрока по нику
#    (playersearch.yml), оттуда — добавление/удаление либо по клику
#    на голову найденного игрока, либо через меню подтверждения.
#  Управление доступно владельцам и админам (qqregions.admin).
#
#  Переменные: {region} {world} {player} {role} {player-id}
#              {ps-group} {ps-clan} {ps-balance} {ps-regions}
#  Псевдокоманды: @page:prev/@page:next, @menu:<имя>,
#                 @player-del:<uuid|ник>:owner|member
# ============================================================
config-version: 3
update_interval: 20   # перерисовка меню каждые N тиков; 0 = выключить автообновление

Menus:
  "owner":
    role-required: owner
    priority: 30
    permission-group: ""
    placeholder-group: ""
    title: "&#000000Игроки ({region}) ({page}/{pages})"
    size: 6
    fill:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      tooltip: false
    buttons:
#      "info":
#        slot: 45
#        material: PAPER
#        name: "&eИнформация"
#        lore:
#          - "&7Назад к информации о территории"
#        commands:
#          - "@menu:info"
      "help":
        slot: 8
        material: BOOK
        name: "&eСправка"
        lore:
          - "&7Выделение, территория, флаги,"
          - "&7подсветка, рынок, аренда, рейды"
        commands:
          - "@menu:help"
#      "flags":
#        slot: 46
#        material: REDSTONE_TORCH
#        name: "&eФлаги"
#        lore:
#          - "&7Открыть редактор флагов"
#        commands:
#          - "@menu:flags"
      "addplayers":
        slot: 4
        material: PLAYER_HEAD
        name: "&bДобавить участников"
        lore:
          - "&7Найти игрока по нику и добавить"
          - "&7в территорию (меню поиска игроков)"
        commands:
          - "@menu:playersearch"
      "back":
        slot: 0
        material: ARROW
        name: "&eВернуться в {back-target}"
        lore:
          - "&7Вернуться в предыдущее меню"
        commands:
          - "@back"
    dynamic-players:
      enabled: true
      slots:
        - 10
        - 11
        - 12
        - 13
        - 14
        - 15
        - 16
        - 19
        - 20
        - 21
        - 22
        - 23
        - 24
        - 25
        - 28
        - 29
        - 30
        - 31
        - 32
        - 33
        - 34
      material: PLAYER_HEAD
      owner-material: PLAYER_HEAD
      member-material: PLAYER_HEAD
      name: "{player}"
      # Описание кнопок списка строится кодом из lang.yml (menu.ps-line-*):
      # имя — цвет ника по роли (владелец &#ccbf8f / участник &#7db389),
      # лор — группа, клан, баланс, территории, «Нажмите чтобы удалить»
      # (подсказка видна только владельцу территории).
      lore:
        - "{ps-group}"
        - "{ps-clan}"
        - "{ps-balance}"
        - "{ps-regions}"
      commands:
        - "@player-del:{player-id}:{role}"
    navigation:
      prev:
        material: ARROW
        name: "&eНазад"
        lore:
          - "&7Предыдущая страница"
        slot: 45
      next:
        material: ARROW
        name: "&eВперёд"
        lore:
          - "&7Следующая страница"
        slot: 53
  "default":
    priority: 5
    permission-group: ""
    placeholder-group: ""
    title: "&#000000Игроки ({region}) ({page}/{pages})"
    size: 6
    fill:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      tooltip: false
    buttons:
#      "info":
#        slot: 45
#        material: PAPER
#        name: "&eИнформация"
#        lore:
#          - "&7Назад к информации о территории"
#        commands:
#          - "@menu:info"
      "help":
        slot: 8
        material: BOOK
        name: "&eСправка"
        lore:
          - "&7Выделение, территория, флаги,"
          - "&7подсветка, рынок, аренда, рейды"
        commands:
          - "@menu:help"
      "back":
        slot: 0
        material: ARROW
        name: "&eВернуться в {back-target}"
        lore:
          - "&7Вернуться в предыдущее меню"
        commands:
          - "@back"
    dynamic-players:
      enabled: true
      slots:
        - 10
        - 11
        - 12
        - 13
        - 14
        - 15
        - 16
        - 19
        - 20
        - 21
        - 22
        - 23
        - 24
        - 25
        - 28
        - 29
        - 30
        - 31
        - 32
        - 33
        - 34
      material: PLAYER_HEAD
      owner-material: PLAYER_HEAD
      member-material: PLAYER_HEAD
      name: "{player}"
      # Описание кнопок списка строится кодом из lang.yml (menu.ps-line-*) —
      # см. шаблон владельца выше.
      lore:
        - "{ps-group}"
        - "{ps-clan}"
        - "{ps-balance}"
        - "{ps-regions}"
    navigation:
      prev:
        material: ARROW
        name: "&eНазад"
        lore:
          - "&7Предыдущая страница"
        slot: 45
      next:
        material: ARROW
        name: "&eВперёд"
        lore:
          - "&7Следующая страница"
        slot: 53
