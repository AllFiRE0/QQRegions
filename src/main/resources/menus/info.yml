          - "&7Статус: &a{status}"
          - "&7Площадь: &f{area} &7блоков | Объём: &f{volume} &7блоков"
          - "&7Приоритет: &f{priority}"
          - "&7Ваша роль: &7Посторонний"
      "people":
        slot: 11
        material: PLAYER_HEAD
        name: "&fИгроки территории"
        lore:
