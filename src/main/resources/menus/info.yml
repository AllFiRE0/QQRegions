# ============================================================
#  QQRegions — информационное меню региона (/territory info)
#
#  Шаблоны выбираются по роли игрока в регионе (role-required):
#    owner  — владелец: всё + флаги + управление игроками + телепорт
#    member — участник: база + списки, без флагов
#    other  — посторонний: только базовая информация
#  Любой шаблон с пустым role-required подходит любой роли.
#
#  Переменные: {region} {world} {player} {role} {owners} {members}
#              {type} {area} {volume} {priority} {status}
#              {my-regions} {max-regions} {max-blocks} — лимиты игрока
#  Рейд-кнопка: {raid-clan} {raid-balance} {raid-online} {raid-total}
#               {raid-in-region} {raid-needed}
#
#  Псевдокоманды: @page:prev/@page:next, @menu:<имя>, @teleport,
#                 asConsole!..., asPlayer!..., close
# ============================================================
config-version: 3
update_interval: 20   # перерисовка меню каждые N тиков; 0 = выключить автообновление

Menus:
  "owner":
    role-required: owner
    priority: 30
    permission-group: ""            # шаблон владельца (или свой перм)
    placeholder-group: ""
    title: "&#000000Информация о регионе ({region})"
    size: 6
    fill:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      tooltip: false
    buttons:
      "region":
        slot: 10
        material: NAME_TAG
        name: "&fРегион: &b{region}"
        lore:
          - "&7Мир: &f{world}"
          - "&7Тип: &f{type}"
          - "&7Статус: &a{status}"
          - "&7Площадь: &f{area} &7блоков | Объём: &f{volume} &7блоков"
          - "&7Приоритет: &f{priority}"
          - "&7Ваша роль: &aВладелец"
          - "&7Ваших регионов: &f{my-regions}&7/&f{max-regions}"
          - "&7Максимум блоков выделения: &f{max-blocks}"
      "people":
        slot: 11
        material: PLAYER_HEAD
        name: "&fИгроки территории"
        lore:
          - "&7Владельцы:"
          - "{owners}"
          - "&7Участники:"
          - "{members}"
      "flags":
        slot: 19
        material: REDSTONE_TORCH
        name: "&eФлаги"
        lore:
          - "&7Открыть редактор флагов"
        commands:
          - "@menu:flags"
      "players":
        slot: 20
        material: PLAYER_HEAD
        name: "&eИгроки"
        lore:
          - "&7Управление участниками и владельцами"
        commands:
          - "@menu:players"
      "teleport":
        slot: 21
        material: ENDER_PEARL
        name: "&eТелепорт"
        lore:
          - "&7Переместиться в центр региона"
        permission: qqregions.admin
        commands:
          - "@teleport"
      "highlight":
        slot: 22
        material: GLOWSTONE_DUST
        name: "&eПодсветка границ"
        lore:
          - "&7Показать границы региона"
        commands:
          - "@highlight"
      "market":
        slot: 23
        material: GOLD_INGOT
        name: "&eРынок"
        lore:
          - "&7Продать регион или сдать в аренду"
        permission: qqregions.market
        commands:
          - "@menu:market"
      "delete":
        slot: 24
        material: BARRIER
        name: "&cУдалить территорию"
        lore:
          - "&7Разделить территорию навсегда"
          - "&cПодтверждение откроется отдельно"
        permission: qqregions.delete
        role-required: owner
        commands:
          - "@menu:confirmdelete"
      "raid":
        slot: 25
        material: NETHERITE_SWORD
        name: "&cРейд клана"
        lore:
          - "&7Клан: &f{raid-clan}"
          - "&7Баланс клана: &f{raid-balance}"
          - "&7Онлайн клана: &f{raid-online}&7/&f{raid-total}"
          - "&7В регионе: &f{raid-in-region}&7/&f{raid-needed}"
          - "&7Требует клан (JustTeams)"
        permission: qqregions.raid
        role-required: other
        commands:
          - "@raid:start"
      "help":
        slot: 8
        material: BOOK
        name: "&eПомощь"
        lore:
          - "&7Команды плагина"
        commands:
          - "@menu:help"

  "member":
    role-required: member
    priority: 20
    permission-group: ""
    placeholder-group: ""
    title: "&#000000Информация о регионе ({region})"
    size: 6
