# ============================================================
#  QQRegions — информационное меню территории (/territory info)
#
#  Шаблоны выбираются по роли игрока в территории (role-required):
#    owner  — владелец: всё + флаги + управление игроками + телепорт
#    member — участник: база + списки, без флагов
#    other  — посторонний: только базовая информация
#  Любой шаблон с пустым role-required подходит любой роли.
#
#  Переменные: {region} {world} {player} {role} {owners} {members}
#              {type} {area} {volume} {priority} {status}
#              {my-regions} {max-regions} {max-blocks} — лимиты игрока
#  Рейд-кнопка: {raid-clan} {raid-balance} {raid-balance-symbol} {raid-online} {raid-total}
#               {raid-in-region} {raid-needed}
#
#  Псевдокоманды: @page:prev/@page:next, @menu:<имя>, @teleport,
#                 asConsole!..., asPlayer!..., close
# ============================================================
config-version: 3
update_interval: 20   # перерисовка меню каждые N тиков; 0 = выключить автообновление

Menus:
  "owner":
    role-required: owner
    priority: 30
    permission-group: ""            # шаблон владельца (или свой перм)
    placeholder-group: ""
    title: "&#000000Инфо о ({region})"
    size: 6
    fill:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      tooltip: false
    buttons:
      "home":
        slot: 0
        material: ARROW
        name: "&eВернуться в главное меню"
        lore:
          - "&7Открыть главное меню территорий"
        commands:
          - "@menu:main"
      "region":
        slot: 10
        material: NAME_TAG
        name: "&7Территория: #59806f{region}"
        lore:
          - "&7Ваша роль: &eВладелец"
          - "&7Мир: &f{world}"
          - "&7Приоритет: &f{priority}"
          - " "
          #- "&7Тип: &f{type}"
          #- "&7Статус: &a{status}"
          - "&7Площадь: &f{area} &7блоков" 
          - "&7Объём: &f{volume} &7блоков"
          - "&7Ваших территорий: &f{my-regions}&7/&f{max-regions}"
          - "&7Доступно в области: &f{max-blocks}"
      "people":
        slot: 11
        material: PLAYER_HEAD
        name: "&fИгроки территории"
        lore:
          - "&7Владельцы:"
          - "&#ccbf8f{owners}"
          - "&7Участники:"
          - "&#7db389{members}"
      "flags":
        slot: 19
        material: REDSTONE_TORCH
        name: "&eФлаги"
        lore:
          - "&7Открыть редактор флагов"
        commands:
          - "@menu:flags"
      "players":
        slot: 20
        material: PLAYER_HEAD
        name: "&eИгроки"
        lore:
          - "&7Управление участниками"
        commands:
          - "@menu:players"
      "teleport":
        slot: 21
        material: ENDER_PEARL
        name: "&eТелепорт"
        lore:
          - "&7Переместиться в центр территории"
        permission: qqregions.admin
        commands:
          - "@teleport"
      "highlight":
        slot: 22
        material: GLOWSTONE_DUST
        name: "&eПодсветка границ"
        lore:
          - "&7Показать границы территории"
        commands:
          - "@highlight"
      "market":
        slot: 23
        material: GOLD_INGOT
        name: "&eРынок"
        lore:
          - "&7Приобрести территорию"
        permission: qqregions.market
        commands:
          - "@menu:market"
      "delete":
        slot: 24
        material: BARRIER
        name: "&8Удалить территорию"
        lore:
          - "&7Разделить территорию навсегда"
          - "&8Подтверждение откроется отдельно"
        permission: qqregions.delete
        role-required: owner
        commands:
          - "@menu:confirmdelete"
      "raid":
        slot: 25
        material: NETHERITE_SWORD
        name: "&8Рейд клана"
        lore:
          - "&7Клан: &f{raid-clan}"
          - "&7Баланс клана: &f{raid-balance} {raid-balance-symbol}"
          - "&7Онлайн клана: &f{raid-online}&7/&f{raid-total}"
          - "&7На территории: &f{raid-in-region}&7/&f{raid-needed}"
          - "&7Требуется состоять в клане."
        permission: qqregions.raid
        role-required: other
        commands:
          - "@raid:start"
      "help":
        slot: 8
        material: BOOK
        name: "&eПомощь"
        lore:
          - "&7Команды плагина"
        commands:
          - "@menu:help"

  "member":
    role-required: member
    priority: 20
    permission-group: ""
    placeholder-group: ""
    title: "&#000000Инфо о ({region})"
    size: 6
    fill:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      tooltip: false
    buttons:
      "home":
        slot: 0
        material: ARROW
        name: "&eВернуться в главное меню"
        lore:
          - "&7Открыть главное меню территорий"
        commands:
          - "@menu:main"
      "region":
        slot: 10
        material: NAME_TAG
        name: "&7Территория: #59806f{region}"
        lore:
          - "&7Ваша роль: &aУчастник"
          - "&7Мир: &f{world}"
          - "&7Приоритет: &f{priority}"
          - " "
          #- "&7Тип: &f{type}"
          #- "&7Статус: &a{status}"
          - "&7Площадь: &f{area} &7блоков" 
          - "&7Объём: &f{volume} &7блоков"
          - "&7Ваших территорий: &f{my-regions}&7/&f{max-regions}"
          - "&7Доступно в области: &f{max-blocks}"
      "people":
        slot: 11
        material: PLAYER_HEAD
        name: "&fИгроки территории"
        lore:
          - "&7Владельцы:"
          - "&#ccbf8f{owners}"
          - "&7Участники:"
          - "&#7db389{members}"
      "players":
        slot: 20
        material: PLAYER_HEAD
        name: "&eИгроки"
        lore:
          - "&7Просмотр владельцев и участников"
        commands:
          - "@menu:players"
      "highlight":
        slot: 21
        material: GLOWSTONE_DUST
        name: "&eПодсветка границ"
        lore:
          - "&7Показать границы территории"
        commands:
          - "@highlight"
      "help":
        slot: 8
        material: BOOK
        name: "&eПомощь"
        lore:
          - "&7Команды плагина"
        commands:
          - "@menu:help"

  "other":
    role-required: other
    priority: 10
    permission-group: ""
    placeholder-group: ""
    title: "&#000000Инфо о ({region})"
    size: 6
    fill:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      tooltip: false
    buttons:
      "home":
        slot: 0
        material: ARROW
        name: "&eВернуться в главное меню"
        lore:
          - "&7Открыть главное меню территорий"
        commands:
          - "@menu:main"
      "region":
        slot: 10
        material: NAME_TAG
        name: "&7Территория: #59806f{region}"
        lore:
          - "&7Мир: &f{world}"
          - " "
          #- "&7Тип: &f{type}"
          #- "&7Статус: &a{status}"
          - "&7Площадь: &f{area} &7блоков" 
          - "&7Объём: &f{volume} &7блоков"
      "people":
        slot: 11
        material: PLAYER_HEAD
        name: "&fИгроки территории"
        lore:
          - "&7Владельцы:"
          - "&#ccbf8f{owners}"
          - "&7Участники:"
          - "&#7db389{members}"
      "raid":
        slot: 19
        material: NETHERITE_SWORD
        name: "&8Рейд клана"
        lore:
          - "&7Клан: &f{raid-clan}"
          - "&7Баланс клана: &f{raid-balance} {raid-balance-symbol}"
          - "&7Онлайн клана: &f{raid-online}&7/&f{raid-total}"
          - "&7На территории: &f{raid-in-region}&7/&f{raid-needed}"
          - "&7Требуется состоять в клане."
        permission: qqregions.raid
        role-required: other
        commands:
          - "@raid:start"
      "highlight":
        slot: 20
        material: GLOWSTONE_DUST
        name: "&eПодсветка границ"
        lore:
          - "&7Показать границы территории"
        commands:
          - "@highlight"
      "help":
        slot: 8
        material: BOOK
        name: "&eСправка"
        lore:
          - "&7Выделение, территория, флаги,"
          - "&7подсветка, рынок, аренда, рейды"
        commands:
          - "@menu:help"
