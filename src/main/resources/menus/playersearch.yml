# ============================================================
#  QQRegions — меню поиска игроков (кнопка «Добавить игроков»
#  в меню игроков). Все игроки сервера: онлайн — первыми, затем
#  оффлайн. Головы скин подставляются по UUID игрока.
#
#  Клики по «голове» игрока:
#    ЛКМ       — добавить игрока в выбранную группу (подтверждение)
#    ПКМ       — убрать игрока из региона (подтверждение)
#    Шифт+ЛКМ  — сменить ВЫБРАННУЮ группу добавления
#                (владелец <-> участник, сразу)
#  Выбранная группа видна на каждой голове ({ps-group}).
#  Подтверждение открывает playerconfirm.yml — кнопка «Подтвердить»,
#  кнопка с информацией об игроке (ник, группа, баланс, регионы,
#  клан) и «Отмена».
#
#  Сортировка кнопкой «Сортировка» (@ps-sort, {ps-sort-list}):
#    az          — по имени A-Z
#    za          — по имени Z-A
#    balance     — по балансу (богатые сверху)
#    regions-asc — по числу регионов (вл.+уч.) по возрастанию
#    regions-desc— по числу регионов по убыванию
#    dist-far    — самые дальние игроки
#    dist-near   — самые ближние игроки
#
#  Переменные: {region} {world} {player} {role} {ps-group} {ps-sort-list}
#  Псевдокоманды: @page:prev/@page:next, @menu:<имя>, @ps-sort, @back
# ============================================================
config-version: 3
update_interval: 20   # перерисовка меню каждые N тиков; 0 = выключить автообновление

Menus:
  "default":
    role-required: owner
    priority: 5
    permission-group: ""
    placeholder-group: ""
    title: "&#000000Поиск игроков ({page}/{pages})"
    size: 6
    fill:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      tooltip: false
    buttons:
      "back":
        slot: 0
        material: ARROW
        name: "&eВернуться в {back-target}"
        lore:
          - "&7Вернуться в предыдущее меню"
        commands:
          - "@back"
      "sort":
        slot: 4
        material: HOPPER
        name: "&eСортировка"
        lore:
          - "{ps-sort-list}"
          - "&7ЛКМ — переключить сортировку"
        commands:
          - "@ps-sort"
      "help":
        slot: 8
        material: BOOK
        name: "&eПомощь"
        lore:
          - "&7Команды и справка плагина"
        commands:
          - "@menu:help"
    menu-slots:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 34
    navigation:
      prev:
        material: ARROW
        name: "&eНазад"
        lore:
          - "&7Предыдущая страница"
        slot: 45
      next:
        material: ARROW
        name: "&eВперёд"
        lore:
          - "&7Следующая страница"
        slot: 53