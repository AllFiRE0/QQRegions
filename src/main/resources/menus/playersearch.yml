# ============================================================
#  QQRegions — меню поиска игроков (кнопка «Добавить игроков»
#  в меню игроков). Все игроки сервера: онлайн — первыми, затем
#  оффлайн. Головы скин подставляются по UUID игрока.
#
#  Материал голов — PLAYER_HEAD (скин по UUID игрока); при желании
#  строки можно заменить на любой материал/голову (см. MENU_EDITOR.md,
#  раздел про material: головы head-*/basehead-*/texture-*/hdb-*).
#
#  Клик по кнопке игрока — меню УПРАВЛЕНИЯ и подтверждения
#  (playerconfirm.yml): добавить участника/владельца или удалить.
#  Меню только через кнопку «Добавить игроков» и только для
#  владельца территории.
#
#  Сортировка кнопкой «Сортировка» (@ps-sort, {ps-sort-list}):
#    az          — по имени A-Z
#    za          — по имени Z-A
#    balance     — по балансу (богатые сверху)
#    regions-asc — по числу территорий (вл.+уч.) по возрастанию
#    regions-desc— по числу территорий по убыванию
#    dist-far    — самые дальние игроки
#    dist-near   — самые ближние игроки
#
#  Переменные: {region} {world} {player} {role} {ps-group}
#              {ps-sort-list}
#  Псевдокоманды: @page:prev/@page:next, @menu:<имя>, @ps-sort, @back,
#                 @player-search
#
#  «Поиск по нику» (@player-search): ввод нику (или части ника) в чат —
#  список строк отфильтруется по regex (как поиск регионов). Найденный
#  игрок показывается в списке строк; клик — меню управления.
# ============================================================
config-version: 3
update_interval: 20   # перерисовка меню каждые N тиков; 0 = выключить автообновление

Menus:
  "default":
    role-required: owner
    priority: 5
    permission-group: ""
    placeholder-group: ""
    title: "&#000000Поиск игроков ({page}/{pages})"
    size: 6
    fill:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      tooltip: false
    buttons:
      "back":
        slot: 0
        material: ARROW
        name: "&eВернуться в {back-target}"
        lore:
          - "&7Вернуться в предыдущее меню"
        commands:
          - "@back"
      "search":
        slot: 2
        material: COMPASS
        name: "&eПоиск игроков"
        lore:
          - "&7Ищет игроков по никнейму"
          #- "&7Список отфильтруется по регулярному"
          #- "&7выражению (как поиск регионов)"
          #- "&7off/отмена — убрать поиск"
        commands:
          - "@player-search"
      "sort":
        slot: 4
        material: HOPPER
        name: "&eСортировка"
        lore:
          - "{ps-sort-list}"
          - " "
          - "&7Нажмите чтобы сортировать"
          #- "&6ЛКМ — переключить сортировку"
        commands:
          - "@ps-sort"
      "help":
        slot: 8
        material: BOOK
        name: "&eСправка"
        lore:
          - "&7Выделение, территория, флаги,"
          - "&7подсветка, рынок, аренда, рейды"
        commands:
          - "@menu:help"
    menu-slots:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 34
    navigation:
      prev:
        material: ARROW
        name: "&eНазад"
        lore:
          - "&7Предыдущая страница"
        slot: 45
      next:
        material: ARROW
        name: "&eВперёд"
        lore:
          - "&7Следующая страница"
        slot: 53
