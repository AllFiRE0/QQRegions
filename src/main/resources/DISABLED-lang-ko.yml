  cancel-words:
    - "cancel"
    - "отмена"
    - "취소"

delete:
  ok: "{qqregions_prefix}&7지역 #59806f{region} &7이(가) 삭제되었습니다."
  not-owner: "{qqregions_prefix}&7이 지역의 소유자가 아닙니다."
  not-found: "{qqregions_prefix}&7지역 #59806f{region}&7 을(를) 찾을 수 없습니다."
  none: "{qqregions_prefix}&7지역 안에 있거나 이름을 지정해야 합니다."
  fail: "{qqregions_prefix}&7지역 삭제 실패: &#8f5959{error}"

add:
  ok-member: "{qqregions_prefix}&7플레이어 #b3b07d{target} &7이(가) 지역 #59806f{region}&7 의 멤버로 추가되었습니다."
  ok-owner: "{qqregions_prefix}&7플레이어 #b3b07d{target} &7이(가) 지역 #59806f{region}&7 의 소유자로 추가되었습니다."
  already: "{qqregions_prefix}&7플레이어 #b3b07d{target} &7은(는) 이미 &f{role}&7 입니다."
  not-allowed: "{qqregions_prefix}&7지역 #59806f{region}&7 을(를) 편집할 수 없습니다."

remove:
  ok-member: "{qqregions_prefix}&7플레이어 #b3b07d{target} &7이(가) 지역 #59806f{region}&7 의 멤버에서 제거되었습니다."
  ok-owner: "{qqregions_prefix}&7플레이어 #b3b07d{target} &7이(가) 지역 #59806f{region}&7 의 소유자에서 제거되었습니다."
