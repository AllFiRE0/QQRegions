# ============================================================
#  QQRegions — 언어 파일 (한국어)
#  형식: 키: "번역"
#  플레이어/관리자/콘솔이 보는 모든 내용은 여기에서만 설정합니다.
#  지원: '&' 색상, '&#RRGGBB', 그리고 {변수} 플레이스홀더.
#
#  플러그인 접두사는 자동으로 추가되지 않습니다: 채팅 메시지에 접두사를
#  붙이려면 텍스트에 {qqregions_prefix}를 넣으세요 (아래 'prefix' 키 값으로 대체됩니다).
#
#  '' (빈 문자열) = 메시지 비활성화: 빈 줄도 표시되지 않습니다
#  (명령/동작의 경우 — 아무것도 실행되지 않습니다).
#  값이 'actionbar:N!'로 시작하면 — 텍스트가 N초 동안 액션바로 전송됩니다
#  (채팅 대신; 플러그인 접두사는 추가되지 않습니다).
# ============================================================

config-version: 8

prefix: "&6▏ "

general:
  only-player: "{qqregions_prefix}&8이 명령은 플레이어만 사용할 수 있습니다."
  no-permission: "{qqregions_prefix}&8권한이 부족합니다."
  reloaded: "{qqregions_prefix}&7설정이 다시 로드되었습니다."
  reloaded-summary: "{qqregions_prefix}&7별칭: &f{aliases}"
  reload-failed: "{qqregions_prefix}&8설정 로드 실패: &7{error}"
  disabled-world: "{qqregions_prefix}&8월드에서 플러그인이 비활성화되었습니다."
  player-not-found: "{qqregions_prefix}&8플레이어 #b3b07d{player}&8(을)를 찾을 수 없습니다."
  unknown-subcommand: "{qqregions_prefix}&8알 수 없는 하위 명령입니다. &7/{alias} help 입력"
  usage: "{qqregions_prefix}&7사용법: &f/{usage}"

# 명령 구문 템플릿 (명령 이름 뒤의 general.usage에 삽입됨).
usage:
  create: "create <이름>"
  add: "add [member|owner] <닉네임> [지역]"
  remove: "remove [member|owner] <닉네임> [지역]"
  sell: "sell [닉네임] <금액> [지역]"
  sell-target: "sell <닉네임> <금액> [지역]"
  rent: "rent [닉네임] <금액> <기간> [지역]"
  rent-target: "rent <닉네임> <금액> <기간> [지역]"
  rent-public: "rent <금액> <기간> [지역]"
  select-expand: "select expand [방향] <수량>"
  select-outset: "select outset <수량> [h|v|horizontal|vertical]"
  select-view: "select view <닉네임>|off"
  visible: "true|false [지역]"

select:
  point-1: "#b34b00지점 1"
  point-2: "#004d1f지점 2"
  pos-set: "{qqregions_prefix}&7{point} &7설정됨: &f({x}&7, &f{y}&7, &f{z}&7)"
  pos-set-1: "{qqregions_prefix}&7{point} &7설정됨: #b34b00({x}&7, #b34b00{y}&7, #b34b00{z}&7)"
  pos-set-2: "{qqregions_prefix}&7{point} &7설정됨: #004d1f({x}&7, #004d1f{y}&7, #004d1f{z}&7)"
  reset: "{qqregions_prefix}&7선택 영역이 초기화되었습니다."
  cleared: "{qqregions_prefix}&7선택 영역이 비워졌습니다."
  none: "{qqregions_prefix}&7먼저 지역을 선택하세요."
  max-built: "{qqregions_prefix}&7선택 영역이 최대로 확장됨: &f{blocks} &7블록."
  chunk-built: "{qqregions_prefix}&7선택됨 &f{chunks} &7청크 (&f{blocks} &7블록)."
  chunk-over: "{qqregions_prefix}&7청크는 최대 &f{chunks} &8개 사용 가능합니다."
  expanded: "{qqregions_prefix}&7지역 확장: &f{blocks} &7블록."
  outset: "{qqregions_prefix}&7모든 방향으로 확장: &f{blocks} &7블록."
  over-limit: "{qqregions_prefix}&8블록 한도 초과 (&f{current}&8/&f{max}&8)."
  below-min: "{qqregions_prefix}&8지역이 최소 크기보다 작습니다 (&f{current}&8/&f{min}&8)."
  point-locked: "{qqregions_prefix}&7해당 지점이 한도에 도달했습니다."
  invalid-amount: "{qqregions_prefix}&7잘못된 수량: &f{amount}"
  invalid-side: "{qqregions_prefix}&7잘못된 방향: &f{side}"
  interactive-on: "{qqregions_prefix}&7선택 모드가 활성화되었습니다."
  # 빈 값 = 메시지 비활성화 (매 클릭/지점 전환 시 스팸 방지).
  # 활성화하려면 아래 줄의 주석을 풀고 텍스트를 작성하세요.
  interactive-select-mode: ""
  #interactive-select-mode: "{qqregions_prefix}&7선택 모드. 현재 지점: &f{point}&7."
  interactive-help: "&#bd8c8c 버튼의 이름과 설명을 확인하세요!"
  #interactive-help: "&7&6우클릭&8&6좌클릭 — (&f생성&7, &f지점 1&7, &f지점 2&7, &f선택&7, &f초기화&7, &f취소&7)."
  interactive-off: "{qqregions_prefix}&7선택 모드가 비활성화되었습니다."
  interactive-on-fail: "{qqregions_prefix}&7인벤토리를 저장할 수 없습니다 — 편집이 취소되었습니다."
  inventory-restored: "{qqregions_prefix}&7비정상 종료 후 인벤토리가 복구되었습니다."
  command-blocked: "{qqregions_prefix}&7명령 &f{cmd}&7 은(는) 현재 금지되어 있습니다. 지역 편집 모드를 종료하세요."
  confirmed: "{qqregions_prefix}&7지역 선택됨: &f{blocks} &7블록."
  conflict: "{qqregions_prefix}&7선택 영역이 #59806f{region}&7(와)과 교차합니다!"
  button-create: "<gradient:#00ff41:#007a1f>지역 생성</gradient>"
  button-create-lore:
    - "&7현재 선택 영역에서 지역을 생성합니다."
    - ""
    - "&f지역 이름 규칙:"
    - "&7영문, 숫자, &f_ &7및 &f-&7,"
    - "&7길이 &f3 &7~ &f32 &7자."
    - ""
    - "&6좌클릭&8/&6우클릭 &7— 채팅에 이름 입력."
  button-point-1: "#b34b00첫 번째 지점 설정"
  button-point-1-lore:
    - "#b34b00지점 1 (상단) 설정."
    - ""
    - "&7주황색 버튼 — 상단 경계."
    - ""
    - "&7십자선이 가리키는 블록 기준 (&f1000 &7블록까지),"
    - "&7아니면 — 플레이어 위치."
    - ""
    - "&6좌클릭&8/&6우클릭 &7버튼을 든 상태 — 설정."
  button-point-2: "#004d1f두 번째 지점 설정"
  button-point-2-lore:
    - "#004d1f지점 2 (하단) 설정."
    - ""
    - "&7초록색 버튼 — 하단 경계."
    - ""
    - "&7십자선이 가리키는 블록 기준 (&f1000 &7블록까지),"
    - "&7아니면 — 플레이어 위치."
    - ""
    - "&6좌클릭&8/&6우클릭 &7버튼을 든 상태 — 설정."
  button-select: "<gradient:#ffe600:#ffb300>마우스 휠로 선택</gradient>"
  button-select-lore:
    - "&7마우스 휠 또는 버튼 &f4&8/&f6 으로 지역을 선택합니다."
    - ""
    - "&6좌클릭 &7빈 손 — 선택 영역"
    - "&71 &7또는 &22 &7전환."
    - "&cShift &8+ &6좌클릭 &7— 두 지점의"
    - "&7선택 영역 확인 후 이름 입력 또는 취소."
    - ""
    - "&6주황색 점 — &7상단 지점"
    - "&2초록색 — &7하단 지점"
    - ""
    - "&8원하는 방향을 보고 마우스 휠을 돌려"
    - "&8선택 지점 이동"
  button-reset: "<gradient:#ffa500:#ff6a00>선택 영역 초기화</gradient>"
  button-reset-lore:
    - "&7선택 영역을 초기화합니다."
    - ""
    - "&6좌클릭&8/&6우클릭 &7— 초기화."
  button-cancel: "<gradient:#ff5555:#ff0000>취소</gradient>"
  button-cancel-lore:
    - "&7선택 모드를 종료하고"
    - "&7인벤토리를 돌려받습니다."
    - ""
    - "&6좌클릭&8/&6우클릭 &7— 종료."
  point-pane-1: "#b34b00지점 1"
  point-pane-2: "#004d1f지점 2"
  point-pane-1-lore:
    - "&7현재 지점: #b34b00지점 1&7."
    - ""
    - "&6휠 &7— 지점 이동"
    - "&cShift &8+ &6좌클릭 &7— 완료."
    - "&6좌클릭 &7— #004d1f지점 2 &7로 전환."
  point-pane-2-lore:
    - "&7현재 지점: #004d1f지점 2&7."
    - ""
    - "&6휠 &7— 지점 이동"
    - "&cShift &8+ &6좌클릭 &7— 완료."
    - "&6좌클릭 &7— #b34b00지점 1 &7로 전환."
  view-set: "{qqregions_prefix}&7플레이어 #b3b07d{target}&7 의 선택 영역 보기 중. &6좌클릭/&6우클릭 — 전환, 휠 — 이동."
  view-offline: "{qqregions_prefix}&7플레이어 #b3b07d{target} &7이(가) 온라인이 아닙니다."
  view-self: "{qqregions_prefix}&7자신의 선택 영역을 볼 수 없습니다."
  view-no-selection: "{qqregions_prefix}&7#b3b07d{target} &7은(는) 활성 선택 영역이 없습니다."
  view-off: "{qqregions_prefix}&7선택 영역 보기가 꺼졌습니다."

create:
  prompt: "{qqregions_prefix}&7채팅에 지역 이름을 입력하세요 (cancel — 취소):"
  cancelled: "{qqregions_prefix}&7이름 입력이 취소되었습니다."
  invalid-name: "{qqregions_prefix}&8지역 이름이 잘못되었습니다. 허용: &7{regex}"
  invalid-id: "{qqregions_prefix}&8지역 이름에 잘못된 문자가 있습니다. 허용: &7{charset}&8. 영문만."
  ok: "{qqregions_prefix}&7지역 #59806f{region} &7이(가) 월드 &7{world}&7에 생성되었습니다. (&7{blocks} &7블록)"
  already-exists: "{qqregions_prefix}&8지역 #59806f{region} &8이(가) 이미 존재합니다."
  fail: "{qqregions_prefix}&8지역 생성 실패, &7{error}"
  none: "{qqregions_prefix}&7먼저 지역을 선택하세요 &8(&#8f5959/{alias} help&8)."
  banned: "{qqregions_prefix}&7지역 #59806f{region} &7은(는) 편집할 수 없습니다."
