# ============================================================
#  QQRegions — arquivo de idioma (Português)
#  Formato: chave: "tradução"
#  Tudo o que o jogador/admin/console vê é configurado somente aqui.
#  Permitidos: cores '&', '&#RRGGBB' e placeholders {variável}.
#
#  O prefixo do plugin NÃO é adicionado automaticamente: para exibir uma
#  mensagem de chat com o prefixo, insira {qqregions_prefix} no texto
#  (é substituído pelo valor da chave 'prefix' abaixo).
#
#  '' (string vazia) = mensagem DESATIVADA: nem uma linha vazia é exibida
#  (para comandos/ações — nada é executado).
#  O valor pode começar com 'actionbar:N!' — o texto vai para a actionbar por
#  N segundos (em vez do chat; o prefixo do plugin não é adicionado).
# ============================================================

config-version: 8

prefix: "&6▏ "

general:
  only-player: "{qqregions_prefix}&8Este comando está disponível apenas para jogadores."
  no-permission: "{qqregions_prefix}&8Você não tem permissões suficientes."
  reloaded: "{qqregions_prefix}&7Configuração recarregada."
  reloaded-summary: "{qqregions_prefix}&7Aliases: &f{aliases}"
  reload-failed: "{qqregions_prefix}&8Falha ao recarregar a configuração: &7{error}"
  disabled-world: "{qqregions_prefix}&8O plugin está desativado neste mundo."
  player-not-found: "{qqregions_prefix}&8Jogador #b3b07d{player} &8não encontrado."
  unknown-subcommand: "{qqregions_prefix}&8Subcomando desconhecido. Digite &7/{alias} help"
  usage: "{qqregions_prefix}&7Uso: &f/{usage}"

# Modelos de sintaxe dos comandos (inseridos em general.usage após o nome do comando).
usage:
  create: "create <nome>"
  add: "add [member|owner] <nick> [território]"
  remove: "remove [member|owner] <nick> [território]"
  sell: "sell [nick] <valor> [território]"
  sell-target: "sell <nick> <valor> [território]"
  rent: "rent [nick] <valor> <tempo> [território]"
  rent-target: "rent <nick> <valor> <tempo> [território]"
  rent-public: "rent <valor> <tempo> [território]"
  select-expand: "select expand [lado] <quantidade>"
  select-outset: "select outset <quantidade> [h|v|horizontal|vertical]"
  select-view: "select view <nick>|off"
  visible: "true|false [território]"

