# Holograma de placa do mercado (market.market-holo): UM holograma flutuante
# perto do perímetro do território, voa ao redor das fronteiras seguindo o
# jogador e sempre o encara. Placeholders: {owner} — nick do vendedor/dono,
# {price} — o número, {price-symbol} — símbolo da moeda, {nick} — comprador/
# inquilino de uma oferta privada, {time} — prazo do aluguel, {region}.
market-holo:
  sale: "#b3b07d{owner}&7 vende por &f{price} {price-symbol}"
  rent: "#b3b07d{owner}&7 aluga por &f{price} {price-symbol} &8por &f{time}"
