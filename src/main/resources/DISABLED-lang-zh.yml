help:
  header: "&8===== &7区域 &8====="
  line: "&f{cmd}&8: &7{desc}"
  commands:
    - usage: "select"
      desc: "交互式选区（无参数）"
    - usage: "select pos|point <1|2>"
      desc: "设置选区点"
    - usage: "select max"
      desc: "玩家周围最大允许的区域"
    - usage: "select chunk [数量]"
      desc: "按区块选择区域"
    - usage: "select expand [方向] <N>"
      desc: "扩展/缩小选区"
    - usage: "select outset <N> [h|v]"
      desc: "向所有方向扩展"
    - usage: "create <名称>"
      desc: "从选区创建区域"
    - usage: "delete [名称]"
      desc: "删除您拥有的区域"
    - usage: "info [名称]"
      desc: "区域信息"
    - usage: "add [member|owner] <昵称> [区域]"
      desc: "将玩家添加到区域"
    - usage: "remove [member|owner] <昵称> [区域]"
      desc: "将玩家移出区域"
    - usage: "flags [名称]"
      desc: "Flag 菜单（所有者）"
    - usage: "visible true|false [区域]"
      desc: "开启/关闭区域高亮 Flag（所有者）"
    - usage: "view [区域] [particles|blocks|territory]"
      desc: "临时显示高亮（不保存 Flag）"
    - usage: "select view <昵称>"
      desc: "查看其他玩家的选区"
    - usage: "market flags"
      desc: "Flag 商店"
    - usage: "market blocks"
      desc: "扩展: 面积和 +区域"
    - usage: "raid [区域]"
      desc: "在区域上发起氏族突袭" # (JustTeams)
    - usage: "sell [昵称] <金额> [区域]"
      desc: "出售区域（无昵称 — 市场公开挂牌）"
    - usage: "sell accept|decline|cancel|list <id>"
      desc: "接受/拒绝/取消/显示出售交易"
    - usage: "rent [昵称] <金额> <时间> [区域]"
      desc: "出租区域（1m = 1 个月；无昵称 — 公开）"
    - usage: "rent dur <分钟> [区域]"
      desc: "出租挂牌的有效期"
    - usage: "rent accept|decline|cancel|list <id>"
      desc: "接受/拒绝/取消/显示租赁"
    - usage: "buy [区域]"
      desc: "从公开挂牌购买区域"
    - usage: "tenant [区域]"
      desc: "从公开挂牌租赁区域"
    - usage: "market"
      desc: "打开市场菜单"
    - usage: "reload"
      desc: "仅限管理员访问。"

