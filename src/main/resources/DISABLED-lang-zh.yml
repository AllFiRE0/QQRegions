  not-allowed: "{qqregions_prefix}&7您不能编辑区域 #59806f{region}&7。"

info:
  title: "&8================[ #59806f{region} &8]================"
  none: "{qqregions_prefix}&7您需要在区域内或指定名称。"
  world: "&7世界: &f{world}"
  type: "&7类型: &f{type}"
  owners: "&7所有者: &f{owners}"
  members: "&7成员: &f{members}"
  area: "&7面积: &f{area} &7个方块 | 体积: &f{volume}"
  priority: "&7优先级: &f{priority}"
  flags-title: "&7Flag:"
  flags-line: "  &7{flag}&8: &f{value}"
  flags-none: "&7  无"
  menu-disabled: "{qqregions_prefix}&7信息菜单未配置！"

flags:
  not-owner: "{qqregions_prefix}&7您不是该区域的所有者。"
  menu-disabled: "{qqregions_prefix}&7Flag 菜单未配置！"

members:
  owner: "所有者"
  member: "成员"

visible:
  disabled: "{qqregions_prefix}&7区域高亮已在配置中禁用" # (highlight.enabled: false)。
  none: "{qqregions_prefix}&7您需要在区域内或指定名称。"
  view-shown: "{qqregions_prefix}&7查看区域 #59806f{region}&7 的高亮。"
  flag-set: "{qqregions_prefix}&7区域 #59806f{region} &7的 Flag &f{flag} &7已设置: &f{value}"
  flag-fail: "{qqregions_prefix}&7设置高亮 Flag 失败。"
  not-owner: "{qqregions_prefix}&7您不是区域 #59806f{region}&7 的所有者 — 不能更改高亮 Flag。"
