  ok-owner: "{qqregions_prefix}&7玩家 #b3b07d{target} &7已从区域 #59806f{region}&7 的所有者中移除。"
  not-in: "{qqregions_prefix}&7玩家 #b3b07d{target} &7不是 &f{role}&7。"
