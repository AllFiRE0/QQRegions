# ============================================================
#  QQRegions — 语言文件（简体中文）
#  格式：键: "翻译"
#  玩家/管理员/控制台看到的所有内容都只能在这里配置。
#  支持：'&' 颜色、'&#RRGGBB' 和占位符 {变量}。
#
#  插件前缀不会自动添加到消息中：要让聊天消息带上前缀，
#  请在文本中插入 {qqregions_prefix}（它会被替换为下面的 'prefix' 键的值）。
#
#  ''（空字符串）= 消息已禁用：连空行也不会显示
#  （对于命令/操作——什么都不执行）。
#  值可以以 'actionbar:N!' 开头——文本会发送到动作栏 N 秒
#  （而不是聊天；不会添加插件前缀）。
# ============================================================

config-version: 8

prefix: "&6▏ "

general:
  only-player: "{qqregions_prefix}&8此命令仅玩家可用。"
  no-permission: "{qqregions_prefix}&8您的权限不足。"
  reloaded: "{qqregions_prefix}&7配置已重新加载。"
  reloaded-summary: "{qqregions_prefix}&7别名: &f{aliases}"
  reload-failed: "{qqregions_prefix}&8重新加载配置失败: &7{error}"
  disabled-world: "{qqregions_prefix}&8插件在此世界中已禁用。"
  player-not-found: "{qqregions_prefix}&8未找到玩家 #b3b07d{player}&8。"
  unknown-subcommand: "{qqregions_prefix}&8未知子命令。请输入 &7/{alias} help"
  usage: "{qqregions_prefix}&7用法: &f/{usage}"

# 命令语法模板（在命令名后插入到 general.usage 中）。
usage:
  create: "create <名称>"
  add: "add [member|owner] <昵称> [区域]"
  remove: "remove [member|owner] <昵称> [区域]"
  sell: "sell [昵称] <金额> [区域]"
  sell-target: "sell <昵称> <金额> [区域]"
  rent: "rent [昵称] <金额> <时间> [区域]"
  rent-target: "rent <昵称> <金额> <时间> [区域]"
  rent-public: "rent <金额> <时间> [区域]"
  select-expand: "select expand [方向] <数量>"
  select-outset: "select outset <数量> [h|v|horizontal|vertical]"
  select-view: "select view <昵称>|off"
  visible: "true|false [区域]"

select:
  point-1: "#b34b00点 1"
  point-2: "#004d1f点 2"
  pos-set: "{qqregions_prefix}&7{point} &7已设置: &f({x}&7, &f{y}&7, &f{z}&7)"
  pos-set-1: "{qqregions_prefix}&7{point} &7已设置: #b34b00({x}&7, #b34b00{y}&7, #b34b00{z}&7)"
  pos-set-2: "{qqregions_prefix}&7{point} &7已设置: #004d1f({x}&7, #004d1f{y}&7, #004d1f{z}&7)"
  reset: "{qqregions_prefix}&7选区已重置。"
  cleared: "{qqregions_prefix}&7选区已清除。"
  none: "{qqregions_prefix}&7请先选择区域。"
  max-built: "{qqregions_prefix}&7选区已扩展到最大: &f{blocks} &7个方块。"
  chunk-built: "{qqregions_prefix}&7已选择 &f{chunks} &7个区块（&f{blocks} &7个方块）。"
  chunk-over: "{qqregions_prefix}&7最多可用 &f{chunks} &8个区块。"
  expanded: "{qqregions_prefix}&7区域已扩展: &f{blocks} &7个方块。"
  outset: "{qqregions_prefix}&7区域已向所有方向扩展: &f{blocks} &7个方块。"
  over-limit: "{qqregions_prefix}&8超出方块上限（&f{current}&8/&f{max}&8）。"
  below-min: "{qqregions_prefix}&8区域小于最小尺寸（&f{current}&8/&f{min}&8）。"
  point-locked: "{qqregions_prefix}&7该点已达限制。"
  invalid-amount: "{qqregions_prefix}&7无效的数量: &f{amount}"
  invalid-side: "{qqregions_prefix}&7无效的方向: &f{side}"
  interactive-on: "{qqregions_prefix}&7已启用选区模式。"
  # 空 = 消息已禁用（不会在每次点击/切换点时刷屏）。
  # 要启用——取消下面一行的注释并写上自己的文本。
  interactive-select-mode: ""
  #interactive-select-mode: "{qqregions_prefix}&7选区模式。当前点: &f{point}&7。"
  interactive-help: "&#bd8c8c 请查看按钮的名称和说明！"
  #interactive-help: "&7&6右键&8&6左键 —（&f创建&7, &f点 1&7, &f点 2&7, &f选择&7, &f重置&7, &f取消&7）。"
  interactive-off: "{qqregions_prefix}&7已禁用选区模式。"
  interactive-on-fail: "{qqregions_prefix}&7无法保存物品栏——编辑已取消。"
  inventory-restored: "{qqregions_prefix}&7意外退出后物品栏已恢复。"
  command-blocked: "{qqregions_prefix}&7命令 &f{cmd}&7 当前被禁止，请退出区域编辑模式。"
  confirmed: "{qqregions_prefix}&7已选择区域: &f{blocks} &7个方块。"
  conflict: "{qqregions_prefix}&7选区与 #59806f{region}&7 相交！"
  button-create: "<gradient:#00ff41:#007a1f>创建区域</gradient>"
  button-create-lore:
    - "&7从当前选区创建区域。"
    - ""
    - "&f区域命名规则:"
    - "&7英文、数字、&f_ &7和 &f-&7，"
    - "&7长度为 &f3 &7到 &f32 &7个字符。"
    - ""
    - "&6左键&8/&6右键 &7— 在聊天中输入名称。"
  button-point-1: "#b34b00设置第一个点"
  button-point-1-lore:
    - "#b34b00设置点 1（上方）。"
    - ""
    - "&7橙色按钮 — 上边界。"
    - ""
    - "&7取准星对准的方块（最多 &f1000 &7格），"
    - "&7否则 — 玩家位置。"
    - ""
    - "&6左键&8/&6右键 &7手持按钮 — 设置。"
  button-point-2: "#004d1f设置第二个点"
  button-point-2-lore:
    - "#004d1f设置点 2（下方）。"
    - ""
    - "&7绿色按钮 — 下边界。"
    - ""
    - "&7取准星对准的方块（最多 &f1000 &7格），"
    - "&7否则 — 玩家位置。"
    - ""
    - "&6左键&8/&6右键 &7手持按钮 — 设置。"
  button-select: "<gradient:#ffe600:#ffb300>使用鼠标滚轮选择</gradient>"
  button-select-lore:
    - "&7使用鼠标滚轮或按键 &f4&8/&f6 选择区域。"
    - ""
    - "&6左键 &7空手 — 切换选区"
    - "&7为 &61 &7或 &22&7。"
    - "&cShift &8+ &6左键 &7— 确认两个点的"
    - "&7选区并进入命名或取消。"
    - ""
    - "&6橙色点为 &7— 上方点"
    - "&2绿色为 &7— 下方点"
    - ""
    - "&8看向所需方向并滚动鼠标滚轮"
    - "&8移动所选点"
  button-reset: "<gradient:#ffa500:#ff6a00>重置选区</gradient>"
  button-reset-lore:
    - "&7重置所选区域。"
    - ""
    - "&6左键&8/&6右键 &7— 重置。"
  button-cancel: "<gradient:#ff5555:#ff0000>取消</gradient>"
  button-cancel-lore:
    - "&7退出选区模式"
    - "&7并返还物品栏。"
    - ""
    - "&6左键&8/&6右键 &7— 退出。"
  point-pane-1: "#b34b00点 1"
  point-pane-2: "#004d1f点 2"
  point-pane-1-lore:
    - "&7当前点: #b34b00点 1&7。"
    - ""
    - "&6滚轮 &7— 移动点"
    - "&cShift &8+ &6左键 &7— 完成。"
    - "&6左键 &7切换到 #004d1f点 2&7。"
  point-pane-2-lore:
    - "&7当前点: #004d1f点 2&7。"
    - ""
    - "&6滚轮 &7— 移动点"
    - "&cShift &8+ &6左键 &7— 完成。"
    - "&6左键 &7切换到 #b34b00点 1&7。"
  view-set: "{qqregions_prefix}&7查看玩家 #b3b07d{target}&7 的选区。&6左键/&6右键 — 切换，滚轮 — 移动。"
  view-offline: "{qqregions_prefix}&7玩家 #b3b07d{target} &7不在线。"
  view-self: "{qqregions_prefix}&7不能查看自己的选区。"
  view-no-selection: "{qqregions_prefix}&7#b3b07d{target} &7没有活动选区。"
  view-off: "{qqregions_prefix}&7已关闭选区查看。"

create:
  prompt: "{qqregions_prefix}&7请在聊天中输入区域名称（&7cancel&7 — 取消）:"
  cancelled: "{qqregions_prefix}&7名称输入已取消。"
  invalid-name: "{qqregions_prefix}&8区域名称无效。允许: &7{regex}"
  invalid-id: "{qqregions_prefix}&8区域名称包含无效字符。允许: &7{charset}&8。仅限英文。"
  ok: "{qqregions_prefix}&7区域 #59806f{region} &7已在世界 &7{world}&7 创建。（&7{blocks} &7个方块）"
  already-exists: "{qqregions_prefix}&8区域 #59806f{region} &8已存在。"
  fail: "{qqregions_prefix}&8创建区域失败，&7{error}"
  none: "{qqregions_prefix}&7请先选择区域 &8（&#8f5959/{alias} help&8）。"
  banned: "{qqregions_prefix}&7区域 #59806f{region} &7不可编辑。"
  region-limit: "{qqregions_prefix}&7已达到区域上限: &f{max}&7。"
  cancel-words:
    - "cancel"
    - "отмена"
    - "取消"

delete:
  ok: "{qqregions_prefix}&7区域 #59806f{region} &7已删除。"
  not-owner: "{qqregions_prefix}&7您不是该区域的所有者。"
  not-found: "{qqregions_prefix}&7未找到区域 #59806f{region}&7。"
  none: "{qqregions_prefix}&7您需要在区域内或指定名称。"
  fail: "{qqregions_prefix}&7删除区域失败: &#8f5959{error}"

add:
  ok-member: "{qqregions_prefix}&7玩家 #b3b07d{target} &7已添加为区域 #59806f{region}&7 的成员。"
  ok-owner: "{qqregions_prefix}&7玩家 #b3b07d{target} &7已添加为区域 #59806f{region}&7 的所有者。"
  already: "{qqregions_prefix}&7玩家 #b3b07d{target} &7已是 &f{role}&7。"
  not-allowed: "{qqregions_prefix}&7您不能编辑区域 #59806f{region}&7。"

remove:
