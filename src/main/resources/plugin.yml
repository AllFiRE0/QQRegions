name: QQRegions
version: '1.0.0'
main: dev.qqregions.QQRegions
api-version: '26.2'
description: Мощное управление территориями поверх WorldGuard
website: https://github.com/AllF1RE
author: AllF1RE

depend:
  - WorldGuard

softdepend:
  - PlaceholderAPI
  - WorldGuardExtraFlagsPlus
  - LuckPerms
  - Vault
  - JustTeams

permissions:
  qqregions.use:
    description: Базовый доступ к командам
    default: true
  qqregions.reload:
    description: Перезагрузка конфигурации (/region reload)
    default: op
  qqregions.create:
    description: Создание территорияов
    default: true
  qqregions.delete:
    description: Удаление территорияов
    default: true
  qqregions.select:
    description: Выделение территории
    default: true
  qqregions.info:
    description: Информация о территории (/region info)
    default: true
  qqregions.manage:
    description: Управление участниками и владельцами
    default: true
  qqregions.flags:
    description: Меню флагов
    default: true
  qqregions.visible:
    description: Подсветка границ территорияов (/region visible)
    default: true
  qqregions.market:
    description: Рынок территорияов (sell/rent/buy/tenant/market)
    default: true
  qqregions.raid:
    description: Запуск рейдов клана (JustTeams)
    default: true
  qqregions.admin:
    description: Полный доступ, включая территории чужих игроков
    default: op
    children:
      qqregions.reload: true
      qqregions.create: true
      qqregions.delete: true
      qqregions.select: true
      qqregions.info: true
      qqregions.manage: true
      qqregions.flags: true
      qqregions.visible: true
      qqregions.market: true
      qqregions.raid: true
  qqregions.bypass.selection-limits:
    description: Игнорировать max-blocks/min-blocks в шаблонах прав
    default: op
  qqregions.bypass.disabled-worlds:
    description: Работать в мирах из disabled-worlds
    default: op
  qqregions.bypass.banned-regions:
    description: Работать с территориями из banned-regions
    default: op